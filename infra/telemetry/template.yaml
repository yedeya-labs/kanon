# The hosted telemetry store (plan 0002 §3 to §5, §6.1, §7, §9, §10): one DynamoDB table, written
# only by a validating function behind an IAM-authenticated URL, with a writer and a reader role
# per registered repository, and an aggregate-only function behind a second such URL. Beside them,
# the register table of plan 0008 §5, and the token paths: the ingest function's (plan 0008 §3,
# J3), a public URL on its `live` alias, its `erase` alias and the self-read role; and the
# aggregate function's (§3.6, J4), a public URL on its own `live` alias. No lane calls either
# until the collector and the reading lanes move to them (J5, J7).
#
# THIS FILE IS NOT DEPLOYED AS IT IS. The register (who is opted in) is private (§5), so
# `render.mjs` reads it and adds each repository's roles to this template. `docs/telemetry.md`
# has the Owner's commands. Intrinsics are written in their long form (`Ref:`, `Fn::GetAtt:`)
# so the file parses as plain YAML, for the render script and for the unit test that checks it.
#
# COST (§9): on-demand DynamoDB, one 128 MB ingest function and one 256 MB aggregate function,
# neither with a schedule, and a 30-day log group each. No NAT, no VPC, no always-on compute,
# no customer-managed key, no alarm. A rejected or failed write turns the collector red, and that
# red run is the page (`K-OBS-4`); a collector that stops running is not paged, as the reference
# adopter decided.
AWSTemplateFormatVersion: '2010-09-09'
Description: Kanon's hosted telemetry store (plan 0002).

Parameters:
  OwnerPrincipalArn:
    Type: String
    Description: The Owner's role (the SSO role's ARN, with its path). It alone may assume the importer, backfill and verify paths, and erase rows.
    # One role, as render.mjs's OWNER holds it (#798): a path and name of IAM's role characters only,
    # so no `*` or `?`, which ArnEquals and ArnNotEquals read as wildcards, and no `,`, which the
    # register table's Fn::Split reads as a second principal. The pattern is also the backstop for a
    # deploy that sets this parameter by hand rather than through the render.
    AllowedPattern: '^arn:aws:iam::\d{12}:role/(?:[\w+=.@-]+/)*[\w+=.@-]+$'
  CreateOidcProvider:
    Type: String
    Description: Create GitHub's OIDC provider. Set false when the account already has one.
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableImporter:
    Type: String
    Description: The importer role (plan 0002, section 7, step S5). Deleted when the import is done.
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableBackfill:
    Type: String
    Description: The backfill role (plan 0002, section 7, step S7a). Deleted when the backfill is done.
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableVerify:
    Type: String
    Description: Let the Owner assume the writer and reader roles, and create the write probe, for verify.mjs only.
    AllowedValues: ['true', 'false']
    Default: 'false'
  OperatorJobRoleArns:
    Type: CommaDelimitedList
    Description: The operator's private jobs' roles (plan 0008, section 5.3), comma-separated, which the register table's resource policy lets in. Empty names none.
    Default: ''
  Audience:
    Type: String
    Description: The audience a token must carry on the token path (plan 0008, section 2.2, check 4). A test store takes its own.
    AllowedPattern: '^[A-Za-z0-9._:-]{1,128}$'
    Default: kanon-telemetry
  MinTokenVersion:
    Type: String
    Description: The lowest Kanon release, X.Y.Z, whose workflows the token paths admit (plan 0008, section 2.2, check 7). Empty admits no token.
    AllowedPattern: '^$|^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
    Default: ''
  CursorKey:
    Type: String
    NoEcho: true
    Description: 64 hex characters, new on every deploy (openssl rand -hex 32), sealing GET /v1/rows/self's cursor (plan 0008, section 3.2). Empty refuses that endpoint.
    AllowedPattern: '^$|^[0-9a-f]{64}$'
    Default: ''
  ReservedConcurrency:
    Type: Number
    Description: Each function's reserved concurrency (plan 0002, section 4; plan 0008, section 12). 0 sets none, for an account whose concurrency quota can't spare it.
    MinValue: 0
    Default: 2

# Kept in Frankfurt by the account's SCP (§5), and by this template too.
Rules:
  Frankfurt:
    Assertions:
      - Assert:
          Fn::Equals: [{ Ref: AWS::Region }, eu-central-1]
        AssertDescription: The telemetry store is deployed to eu-central-1 only (ADR 0007, rule 4).

Conditions:
  CreateOidc: { 'Fn::Equals': [{ Ref: CreateOidcProvider }, 'true'] }
  ImporterOn: { 'Fn::Equals': [{ Ref: EnableImporter }, 'true'] }
  BackfillOn: { 'Fn::Equals': [{ Ref: EnableBackfill }, 'true'] }
  VerifyOn: { 'Fn::Equals': [{ Ref: EnableVerify }, 'true'] }
  HasOperatorJobRoles: { 'Fn::Not': [{ 'Fn::Equals': [{ 'Fn::Join': ['', { Ref: OperatorJobRoleArns }] }, ''] }] }
  HasReservedConcurrency: { 'Fn::Not': [{ 'Fn::Equals': [{ Ref: ReservedConcurrency }, 0] }] }

Resources:
  # Its lifecycle is independent of the stack (K-OBS-17): retained on delete and on replace,
  # and protected from deletion. Its ARN is written out, not referenced, everywhere else, so the
  # table's resource policy can name the function's role without a cycle.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: kanon-telemetry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # The function is the only writer by construction (plan 0002, section 4): every write is denied to every
      # principal but the function's role and the Owner's erase procedure (§10), and the self-read
      # role, which only the function assumes, for the erasure walk's deletes under a session held
      # to the erased key (plan 0008 §7).
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: OnlyTheIngestFunctionWrites
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    - { 'Fn::GetAtt': [IngestRole, Arn] }
                    - { Ref: OwnerPrincipalArn }
                    - { 'Fn::GetAtt': [SelfReadRole, Arn] }

  # The register (plan 0008 §5): who is registered, under which key, and the operator's fields,
  # outside any repository. The ingest function reads and writes it on both of its paths (plan
  # 0008 J3), the aggregate function reads it on both of its (J4), and the operator writes it with
  # `register.mjs`. Its lifecycle is the rows table's
  # (K-OBS-17): retained, deletion-protected, point-in-time recovery. Encrypted with the
  # AWS-managed key `aws/dynamodb` (Owner decision 4 of 2026-10-12): no key fee, and every use of
  # the key is in CloudTrail, but its key policy can't be narrowed, so it is not an access
  # control. Access is held by the resource policy below and the roles' conditions.
  RegisterTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: kanon-telemetry-register
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # For the quota counters (§6); a registration, a key item and a tombstone have no expiry.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # No KMSMasterKeyId: the AWS-managed key, not a customer-managed one.
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      # §5.3: every action, by every principal but four, is denied: the ingest function's role,
      # the aggregate function's role, the Owner's role, and the operator's private jobs' roles
      # (OperatorJobRoleArns). What each may do inside that is its own policy's to narrow.
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: OnlyTheNamedPrincipals
              Effect: Deny
              Principal: '*'
              Action: dynamodb:*
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    Fn::If:
                      - HasOperatorJobRoles
                      - Fn::Split:
                          - ','
                          - Fn::Join:
                              - ','
                              - - { 'Fn::GetAtt': [IngestRole, Arn] }
                                - { 'Fn::GetAtt': [AggregateRole, Arn] }
                                - { Ref: OwnerPrincipalArn }
                                - { 'Fn::Join': [',', { Ref: OperatorJobRoleArns }] }
                      - - { 'Fn::GetAtt': [IngestRole, Arn] }
                        - { 'Fn::GetAtt': [AggregateRole, Arn] }
                        - { Ref: OwnerPrincipalArn }

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanon-telemetry-ingest
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-rows-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: { 'Fn::GetAtt': [IngestLogGroup, Arn] }
        # The register (plan 0008 §5.3), on both paths since J3.
        - PolicyName: read-and-write-the-register
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRegistrations
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
              # assertNoKey's keys (§3.4): a Scan of `pk` alone, which for a key item is `key#<key>`.
              - Sid: ScanThePartitionKeys
                Effect: Allow
                Action: dynamodb:Scan
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [pk]
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
              # Every field but the operator's (function/register-fields.mjs, FUNCTION_FIELDS):
              # aggregate_invoker, publish_own_figures_as, page_reader, quota_*, suspended_* and
              # first_review are not listed, so IAM refuses the function a write that SETS one.
              # It does not keep them: a whole-item PutItem of these fields alone replaces an item
              # and drops its operator fields without naming them. Keeping them across the
              # function's writes is its conditional writes' to hold (function/register-store.mjs).
              # A TransactWriteItems is authorized per item, as these actions.
              - Sid: WriteNoOperatorField
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - repository_id
                      - repository_owner_id
                      - repository
                      - key
                      - status
                      - default_ref
                      - name_hashes
                      - registered_at
                      - registered_by_version
                      - last_seen_at
                      - erased_at
                      - rows_erased_at
                      - source
                      - n
                      - expires_at
              # A DeleteItem names no attribute, so dynamodb:Attributes can't hold it. It is held
              # to the key items instead (`key#<key>`), the one delete §5.3 grants, on erasure (§7):
              # a registration becomes its tombstone by a PutItem, and counters expire by TTL.
              - Sid: DeleteKeyItemsOnly
                Effect: Allow
                Action: dynamodb:DeleteItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['key#*']
        # The token path (plan 0008 §3.5, §7): a session of the self-read role for each read of the
        # adopter's own rows and each erasure walk, held by its session policy to one key; and the
        # erasure walk started on the function's own `erase` alias, which nothing else may invoke.
        - PolicyName: token-path
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTheSelfReadRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/kanon-telemetry-self-read
              - Sid: StartTheErasureWalk
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:kanon-telemetry-ingest:erase

  # The adopter's own rows (plan 0008 §3.5) and the erasure walk (§7): Query and delete on the
  # rows table, assumed only by the ingest function, which passes a session policy whose
  # dynamodb:LeadingKeys is the one key the registration gave, so a query or a delete can't leave
  # that key (Owner decision 2 of 2026-10-12). Replaces the per-adopter reader roles at vM+1.
  SelfReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanon-telemetry-self-read
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { 'Fn::GetAtt': [IngestRole, Arn] } }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: query-and-delete-rows
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:BatchWriteItem]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry

  # Keys and field names only (the function never logs a value), kept 30 days (§10).
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/kanon-telemetry-ingest
      RetentionInDays: 30

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kanon-telemetry-ingest
      Description: Validates telemetry rows and writes them (plan 0002, section 4).
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      # A local directory: `aws cloudformation package` zips it. render.mjs makes it absolute.
      Code: function
      MemorySize: 128
      Timeout: 10
      Role: { 'Fn::GetAtt': [IngestRole, Arn] }
      ReservedConcurrentExecutions:
        Fn::If: [HasReservedConcurrency, { Ref: ReservedConcurrency }, { Ref: AWS::NoValue }]
      LoggingConfig:
        LogGroup: { Ref: IngestLogGroup }
        LogFormat: Text
      Environment:
        Variables:
          TABLE_NAME: kanon-telemetry
          ACCOUNT_ID: { Ref: AWS::AccountId }
          # Set by render.mjs from the register: every key; and per key, the SHA-256 of each word
          # of its repository's owner and name, never the words, which a finding row's text is
          # checked against (plan 0006 §4.2).
          WRITER_KEYS: ''
          NAME_HASHES: ''
          IMPORTER_ROLE: { 'Fn::If': [ImporterOn, kanon-telemetry-importer, ''] }
          BACKFILL_ROLE: { 'Fn::If': [BackfillOn, kanon-telemetry-backfill, ''] }
          # The token path (plan 0008 J3). Since J3 the SigV4 path reads its keys and name hashes
          # from the register too; WRITER_KEYS and NAME_HASHES stay, unread, until J9.
          REGISTER_TABLE: kanon-telemetry-register
          AUDIENCE: { Ref: Audience }
          MIN_TOKEN_VERSION: { Ref: MinTokenVersion }
          SELF_READ_ROLE: { 'Fn::GetAtt': [SelfReadRole, Arn] }
          CURSOR_KEY: { Ref: CursorKey }

  IngestUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: { 'Fn::GetAtt': [IngestFunction, Arn] }
      AuthType: AWS_IAM

  # The token path's two aliases (plan 0008 §7, §9), on $LATEST, so a deploy moves them with the
  # function. The handler reads which one it was invoked through from the ARN Lambda passes it,
  # never from the request: `live` serves the five endpoints, `erase` the erasure walk, and the
  # unqualified function the SigV4 path above.
  IngestLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: { Ref: IngestFunction }
      FunctionVersion: $LATEST
      Name: live
  IngestEraseAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: { Ref: IngestFunction }
      FunctionVersion: $LATEST
      Name: erase

  # The token path's URL: public, since the token is the gate (plan 0008 §2, §12), and bounded by
  # the reserved concurrency, a precondition of deploying it (§9 step 3a). It serves the `live`
  # alias alone, so an IAM-signed request on it reaches the token path, which refuses it.
  IngestLiveUrl:
    Type: AWS::Lambda::Url
    DependsOn: IngestLiveAlias
    Properties:
      TargetFunctionArn: { 'Fn::GetAtt': [IngestFunction, Arn] }
      Qualifier: live
      AuthType: NONE
  IngestLiveUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { Ref: IngestLiveAlias }
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  IngestLiveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { Ref: IngestLiveAlias }
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # §7: may name an adopter key and backdate up to 13 months. Owner-only; deleted after S5.
  ImporterRole:
    Type: AWS::IAM::Role
    Condition: ImporterOn
    Properties:
      RoleName: kanon-telemetry-importer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { 'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' } }
            Action: sts:AssumeRole
            Condition:
              ArnEquals: { aws:PrincipalArn: { Ref: OwnerPrincipalArn } }
      Policies:
        - PolicyName: invoke-ingest-url
          PolicyDocument: &invokeIngestUrl
            # A function URL call needs both actions since October 2025. InvokeFunction is held
            # to URL calls, so no caller can invoke the function with a forged request context.
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: { 'Fn::GetAtt': [IngestFunction, Arn] }
                Condition:
                  StringEquals: { lambda:FunctionUrlAuthType: AWS_IAM }
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: { 'Fn::GetAtt': [IngestFunction, Arn] }
                Condition:
                  Bool: { lambda:InvokedViaFunctionUrl: 'true' }

  # §7, S7a: may name an adopter key, for work-item rows only, in the normal window.
  BackfillRole:
    Type: AWS::IAM::Role
    Condition: BackfillOn
    Properties:
      RoleName: kanon-telemetry-backfill
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { 'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' } }
            Action: sts:AssumeRole
            Condition:
              ArnEquals: { aws:PrincipalArn: { Ref: OwnerPrincipalArn } }
      Policies:
        - PolicyName: invoke-ingest-url
          PolicyDocument: *invokeIngestUrl

  # verify.mjs check 7 (kanon#101): a role whose OWN policy allows every write the table's
  # resource policy denies, so a denied write proves that deny rather than missing IAM grants.
  # The writer can't show it: it holds no DynamoDB action, so IAM refuses it first. Owner-only,
  # and only while EnableVerify is on, like the Owner's way into the writer and reader roles.
  VerifyProbeRole:
    Type: AWS::IAM::Role
    Condition: VerifyOn
    Properties:
      RoleName: kanon-telemetry-verify-probe
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { 'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' } }
            Action: sts:AssumeRole
            Condition:
              ArnEquals: { aws:PrincipalArn: { Ref: OwnerPrincipalArn } }
      Policies:
        - PolicyName: every-write-the-table-denies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry

  # The aggregate-only function (§6.1, decided by the Owner 2026-10-07, #443). It answers only
  # what may leave: cross-adopter cells with at least three non-declaring adopters, the own
  # figures of adopters that declared them publishable, and failure signals with a count of
  # adopters affected; asked for its page view, the declaring adopters' work-item indicators
  # (plan 0003 M7). Its
  # role may Query the table, and only with exactly the aggregate's projection: IAM refuses a
  # request that asks for any other attribute or leaves `Select` unnamed. About a cent a month.
  AggregateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanon-telemetry-aggregate
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: query-the-projection-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry
                Condition:
                  # The aggregate's ATTRIBUTES (function/aggregate.mjs): its run PROJECTION and the
                  # page view's WORK_PROJECTION (plan 0003 M7), and sk, the key's other half.
                  ForAllValues:StringEquals:
                    dynamodb:Attributes:
                      - pk
                      - sk
                      - row_kind
                      - tag
                      - recorded_at
                      - lane
                      - model
                      - total_cost_usd
                      - expires_at
                      - outcome
                      - reason
                      - failed_stage
                      - kanon_error
                      - kanon_version
                      - pr_number
                      - issue_number
                      - closed_at
                      - fate
                      - closing_issues
                      - changed_lines
                      - changed_files
                      - changed_dirs
                      - author_kind
                      - revert_days
                      - first_fix_days
                      - first_verdict
                      - human_commits
                      - human_cr_after_approval
                  # Not IfExists: a request without `Select` would read whole items, so it is refused.
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: { 'Fn::GetAtt': [AggregateLogGroup, Arn] }
        # The register (plan 0008 §3.6, §5.3), each read held to exactly its projection: the
        # aggregate function's keys, labels and callers come from the table (J4).
        - PolicyName: read-the-register-projections
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Every registration's key, status and label: no name and no owner id, since the
              # three-adopter rule counts keys (Owner decision 7 of 2026-10-12).
              - Sid: ScanTheRegistrations
                Effect: Allow
                Action: dynamodb:Scan
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [pk, key, status, publish_own_figures_as]
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
              # The caller's registration, for checks 8 and 9 and its two operator flags. GetItem
              # takes no Select parameter, so dynamodb:Select is held only where present; the
              # projection is held by dynamodb:Attributes. verify.mjs shows this role's GetItem
              # with no projection, and with `repository` projected, denied (plan 0008 §13's
              # added checks, which J6 runs) before the token URL is published.
              - Sid: GetTheCallersRegistration
                Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kanon-telemetry-register
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [pk, key, status, repository_owner_id, default_ref, aggregate_invoker, page_reader]
                  StringEqualsIfExists:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES

  # Counts only (the function never logs a row, a key or a figure), kept 30 days.
  AggregateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/kanon-telemetry-aggregate
      RetentionInDays: 30

  AggregateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kanon-telemetry-aggregate
      Description: Answers the publishable aggregate only (plan 0002, section 6.1).
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: aggregate.handler
      # The same directory as the ingest function: one package, two handlers.
      Code: function
      MemorySize: 256
      Timeout: 60
      Role: { 'Fn::GetAtt': [AggregateRole, Arn] }
      # Its token URL is public (plan 0008 §12): the reservation bounds what a flood can cost.
      ReservedConcurrentExecutions:
        Fn::If: [HasReservedConcurrency, { Ref: ReservedConcurrency }, { Ref: AWS::NoValue }]
      LoggingConfig:
        LogGroup: { Ref: AggregateLogGroup }
        LogFormat: Text
      Environment:
        Variables:
          TABLE_NAME: kanon-telemetry
          REGISTER_TABLE: kanon-telemetry-register
          ACCOUNT_ID: { Ref: AWS::AccountId }
          AUDIENCE: { Ref: Audience }
          MIN_TOKEN_VERSION: { Ref: MinTokenVersion }
          # Set by render.mjs from the register file. Only INVOKER_KEYS is still read: the keys
          # whose invoker role may call the IAM URL. Whose rows are aggregated, and under which
          # labels, comes from the register table on both URLs (plan 0008 §3.6, §9), so
          # AGGREGATE_KEYS and OWN_FIGURES are unused, and go with render.mjs at vM+1.
          AGGREGATE_KEYS: ''
          OWN_FIGURES: ''
          INVOKER_KEYS: ''

  # Only the invoker roles render.mjs adds may call it: AWS_IAM auth, and a permission per role.
  # The unqualified function's URL; the handler refuses a bearer token on it (plan 0008 §9).
  AggregateUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: { 'Fn::GetAtt': [AggregateFunction, Arn] }
      AuthType: AWS_IAM

  # The token path (plan 0008 §3.6, §9): an alias of its own, `live`, on the latest code, whose
  # URL takes no IAM auth. GitHub's OIDC token is the gate, checked by the function, which tells
  # the two URLs apart by the alias in the ARN Lambda invoked, never by the request.
  AggregateLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: { Ref: AggregateFunction }
      FunctionVersion: $LATEST
      Name: live

  AggregateLiveUrl:
    Type: AWS::Lambda::Url
    DependsOn: AggregateLiveAlias
    Properties:
      TargetFunctionArn: { 'Fn::GetAtt': [AggregateFunction, Arn] }
      Qualifier: live
      AuthType: NONE

  # A public URL needs both grants, each on the alias alone: InvokeFunctionUrl held to the URL's
  # NONE auth, and InvokeFunction held to calls through a function URL (since October 2025).
  AggregateLiveUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { Ref: AggregateLiveAlias }
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  AggregateLiveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: { Ref: AggregateLiveAlias }
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # render.mjs adds, per registered repository: WriterRole<id>, ReaderRole<id> and
  # WriterUrlPermission<id>, from the shapes it holds; and, for an entry that sets
  # `aggregate_invoker`, AggregateInvokerRole<id> and AggregateUrlPermission<id>.

Outputs:
  TableName:
    Value: { Ref: Table }
  RegisterTableName:
    Value: { Ref: RegisterTable }
  IngestUrl:
    Value: { 'Fn::GetAtt': [IngestUrl, FunctionUrl] }
  IngestTokenUrl:
    Value: { 'Fn::GetAtt': [IngestLiveUrl, FunctionUrl] }
  AggregateUrl:
    Value: { 'Fn::GetAtt': [AggregateUrl, FunctionUrl] }
  AggregateTokenUrl:
    Value: { 'Fn::GetAtt': [AggregateLiveUrl, FunctionUrl] }
