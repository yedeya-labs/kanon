# actionlint configuration. CI runs actionlint through .github/scripts/actionlint.sh (#77).
#
# actionlint 1.7.12, the latest release, bundles metadata for
# actions/create-github-app-token@v3 from before v3.1.0, which added the `client-id` input
# and made `app-id` optional and deprecated. Kanon's mint steps pass `client-id`, so without
# these two entries actionlint reports every one of them twice. Drop them when a released
# actionlint knows `client-id`; tests/unit/app-token-input.test.ts still requires it.
#
# The same release doesn't know the `job` context's `workflow_ref` and `workflow_sha`, the
# reusable workflow that defines the job, which `kanonVersion` reads the Kanon release from
# (kanon#454; actions/agent-telemetry/action.yml). The lanes' filing jobs pass both to stamp a
# finding row's `kanon_version` (plan 0006 F3). Drop these two when a released actionlint knows them.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"\.'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"\.'
      - 'property "workflow_ref" is not defined in object type \{check_run_id: number; container:'
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
  # `deploy.yml` declares one optional `workflow_call` secret, `KANON_CHAT_DEPLOY`, for its
  # `notify` job (plan 0011 N9), so actionlint then knows only the declared secrets. The deploy
  # hook's `KANON_DEPLOY_SECRET` is an ENVIRONMENT secret, which GitHub resolves in the job that
  # sets `environment:` whatever the caller passes ("the environment secret will be used", GitHub's
  # reusable-workflow docs), and which no caller may map (plan 0010 §7). Keep this one name only.
  .github/workflows/deploy.yml:
    ignore:
      - 'property "kanon_deploy_secret" is not defined in object type \{actions_runner_debug: string; actions_step_debug: string; github_token: string; kanon_chat_deploy: string\}'
