# Kanon's own QA store hook (docs/qa-store.md, plan 0004 §3.2), for the lanes Kanon runs on
# itself (ADR 0011, amended 2026-10-06 by kanon#423): the code audit and the Overseer.
#
# It is the AWS hook template from docs/qa-store.md, written exactly as an adopter writes it, for
# the `kanon-qa-store` stack the Owner provisioned on 2026-10-06 with
# infra/qa-store/aws/provision.mjs (eu-central-1, termination-protected). The stack's role trusts
# the default branch's ref alone, so a run of any other ref never reaches the store.
#
# THE STORE'S ROLE AND BUCKET ARE REPOSITORY SECRETS, NEVER COMMITTED (kanon#433): both name the AWS
# account, which stays out of the public tree, and the runner masks a secret in every log, where
# it printed a variable in each store job's log. The lane callers map `QA_STORE_ROLE_ARN` and
# `QA_STORE_BUCKET` by name, the lane hands them to the `qa-store` block as `secrets`, and the
# block hands them on to this hook, which reads nothing else: since kanon#479 the block passes no
# repository variables. With either secret unset or unmapped, the check step below fails by name:
# a read is then `degraded`, and a write fails its job.
#
# Kanon's `qa-store` block reads this file from the checkout of the run's commit and calls it in a
# store job, which holds `id-token: write` in its exact shape (tests/unit/id-token-guard.test.ts).
# The `uses:` below names Kanon's last release, like every other Kanon reference under .github/
# (`lane-check` holds them to one version), and Dependabot's `/.github/actions/*` directory
# proposes each release here with the others.
name: QA store
description: The QA store hook (Kanon plan 0004).
inputs:
  operation: { required: true }
  kind: { required: false, default: "" }
  dir: { required: true }
  from: { required: false, default: "" }
  to: { required: false, default: "" }
  secrets: { required: false, default: "" }
runs:
  using: composite
  steps:
    # An AWS error names the account in ARNs that are not these secrets, so the runner would not
    # mask it there: register the account id first (kanon#488).
    - name: Mask the store's account id
      shell: bash
      env:
        ROLE_ARN: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_ROLE_ARN }}
        BUCKET: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_BUCKET }}
      run: |
        printf '%s %s' "$ROLE_ARN" "$BUCKET" | grep -oE '[0-9]+' | grep -xE '[0-9]{12}' | sort -u | sed 's/^/::add-mask::/' || true
    - name: Check the store's coordinates
      shell: bash
      env:
        ROLE_ARN: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_ROLE_ARN }}
        BUCKET: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_BUCKET }}
      run: |
        if [ -z "$ROLE_ARN" ] || [ -z "$BUCKET" ]; then
          echo "::error title=QA store hook::the repository secrets QA_STORE_ROLE_ARN and QA_STORE_BUCKET must both be set, and mapped by the lane's caller (docs/qa-store.md)"
          exit 1
        fi
    - uses: yedeya-labs/kanon/infra/qa-store/aws@v0.36.0
      with:
        operation: ${{ inputs.operation }}
        kind: ${{ inputs.kind }}
        dir: ${{ inputs.dir }}
        from: ${{ inputs.from }}
        to: ${{ inputs.to }}
        role-arn: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_ROLE_ARN }}
        region: eu-central-1
        table: kanon-qa-store
        bucket: ${{ fromJSON(inputs.secrets || '{}').QA_STORE_BUCKET }}
