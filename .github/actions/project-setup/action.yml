# Kanon's own project-setup hook (plan 0001 §5), for the lanes Kanon runs on itself (ADR 0011).
#
# Every lane that checks out calls it after the checkout and before the agent. Kanon is a
# Node project with no database and no app, so this installs Node at Kanon's version and,
# when asked, its dependencies. An agent's commits pass Kanon's own `dco` check without it:
# the lanes' `agent-setup` block authors them as the minted App and adds the delegate's
# sign-off (K-AGENT-44, kanon#234), for Kanon as for any adopter.
#
# `database` is accepted and ignored: Kanon declares `none` in `docs/qa/test-database.md`
# (K-LAYOUT-16), so every lane passes 'false'. Like every hook, it declares no outputs: the
# contract defines none, and the lanes judge a hook by its outcome alone (#77). `browsers`
# `issue-number`, `app-slug` and `github-token` are declared because the lanes pass them, and
# unused.
#
# It is read from the checked-out tree, but the review lane restores it from the default
# branch first (K-MERGE-17), so a PR can't change the setup its own review runs.
name: Project setup
description: Kanon's setup for an agent lane — Node and npm ci, no database.
inputs:
  lane:
    description: The lane's telemetry agent name.
    required: true
  install:
    description: "'true' runs npm ci."
    default: "true"
  database:
    description: "Ignored: Kanon has no database."
    default: "false"
  browsers:
    description: "Ignored: Kanon has no app to drive."
    default: "false"
  issue-number:
    description: The issue the run was dispatched for. Unused.
    default: ""
  app-slug:
    description: The minted App's slug. Unused.
    default: ""
  github-token:
    description: The minted App token. Unused.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - if: inputs.install == 'true'
      shell: bash
      run: npm ci
