# Kanon's own project-setup hook (plan 0001 §5), for the lanes Kanon runs on itself (ADR 0011).
#
# Every lane that checks out calls it after the checkout and before the agent. Kanon is a
# Node project with no database and no app, so this installs Node at Kanon's version and,
# when asked, its dependencies. For the Implementer's two lanes it also makes the agent's
# commits pass Kanon's own `dco` check (agent-commits.sh, K-AGENT-44): authored as the
# minted App, and signed off by the delegate the record names.
#
# `database` is accepted and ignored: Kanon declares `none` in `docs/qa/test-database.md`
# (K-LAYOUT-16), so every lane passes 'false'. Like every hook, it declares no outputs: the
# contract defines none, and the lanes judge a hook by its outcome alone (#77). `browsers`
# and `issue-number` are declared because the lanes pass them, and unused; `app-slug` and
# `github-token` are read by agent-commits.sh alone.
#
# It is read from the checked-out tree, but the review lane restores it from the default
# branch first (K-MERGE-17), so a PR can't change the setup its own review runs.
name: Project setup
description: Kanon's setup for an agent lane — Node and npm ci, no database.
inputs:
  lane:
    description: The lane's telemetry agent name.
    required: true
  install:
    description: "'true' runs npm ci."
    default: "true"
  database:
    description: "Ignored: Kanon has no database."
    default: "false"
  browsers:
    description: "Ignored: Kanon has no app to drive."
    default: "false"
  issue-number:
    description: The issue the run was dispatched for. Unused.
    default: ""
  app-slug:
    description: The minted App's slug, which the Implementer's lanes commit as.
    default: ""
  github-token:
    description: The minted App token, to read the App's bot account id.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - if: inputs.install == 'true'
      shell: bash
      run: npm ci
    # After Node, because the delegation record is read with the `dco` action's parser.
    - shell: bash
      env:
        LANE: ${{ inputs.lane }}
        APP_SLUG: ${{ inputs.app-slug }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/agent-commits.sh"
