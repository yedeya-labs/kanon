name: Bug
description: A check, workflow or document in Kanon does the wrong thing.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Kanon version
      description: The exact version you pinned, for example v0.4.0.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or merged, and what Kanon did. Paste the failing log lines.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Cite the rule id (for example K-SHIP-4) if a rule says what should happen.
    validations:
      required: true
  - type: input
    id: introduced-by
    attributes:
      label: Introduced by
      description: The Kanon pull request that caused this, if you know it, written as `#123`. GitHub links the two, and Kanon's metrics count the link as an escaped defect, so leave it empty if you aren't sure.
      placeholder: "#123"
    validations:
      required: false
