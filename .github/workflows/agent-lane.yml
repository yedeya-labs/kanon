# The shared spine of an agent lane (RA-2092).
#
# Every lane that dispatches an agent does the same eight things — mint an App token,
# check out, start the project's database, run the project's setup, run `claude-code-action`,
# explain a red run, and record what it cost. Only the PROMPT and the IDENTITY differ — plus a few CAPABILITY SWITCHES a lane
# sets for what it genuinely lacks or needs (`database`, `browsers`, `ref`/`fetch-depth`,
# and `push-probe` for a lane whose whole output is a pushed branch, which is OFF by
# default: a lane converted without it silently loses its early 403). Each switch is the
# same step for every lane that sets it. Before this, that spine was copied into
# eleven files, so a fix to it was eleven edits and eleven chances to miss one — RA-1544
# and RA-1562 are both that shape.
#
# WHAT STAYS IN THE CALLER, and why it is not an oversight:
#   • triggers, `concurrency`, and the job `if` — a reusable workflow cannot declare
#     its caller's events, and the `if` is the lane's admission rule, not the spine's.
#   • the prompt — 21% of these files and up to 473 lines. A workflow input is the right
#     home for a paragraph, not for a document; keeping it beside the trigger also keeps
#     "what fires this" and "what it is told" readable together.
#
# BUILT FROM THREE BLOCKS (RA-2666). The steps are the composite actions `agent-setup`,
# `agent-run` and `agent-finish`, Kanon's `actions/agent-*` (called as `$/actions/agent-*`,
# so at the commit of the release the caller pinned), joined by the few steps
# no block holds: the App-token mint and the checkout (no block needed to before RA-2697,
# when a `./` block could not load before the checkout existed; they stay lane steps
# because this change moves no step), and the RA-2519 breadcrumbs (the jobs API cannot see a step inside a
# composite action, and the recoveries read those by name).
#
# AND ONE HOOK THAT IS THE PROJECT'S, NOT THE SPINE'S (RA-2694; Kanon plan 0001 §5). Every
# value specific to the project — its toolchain and install, its schema setup against the
# database, its browser, its per-lane output and identity checks — lives in
# `.github/actions/project-setup`, which this job calls after the checkout and before
# `agent-setup`, with the lane's `agent` name and its `database` and `browsers` switches.
# Nothing in this file or the blocks names one of those values, and
# `tests/unit/lane-workflows.test.ts` fails when one comes back. The hook is read
# from the CHECKED-OUT tree, never loaded from another commit: on a lane that sets `ref` it
# is the branch's own, and a branch cut before it existed fails the presence check below,
# by name — rebase it. A lane whose own steps must
# sit between the stages — a gate before the agent, a record after it — calls the blocks
# directly instead of this file; the reference adopter's pipeline doc says which to use when.
# `agent-finish` calls a fourth block, `agent-classify` (RA-2691), which the lanes that
# classify a run outside `agent-finish` call directly.
#
# THE BLOCKS ARE `$/` REFERENCES, THE HOOK IS `./` (RA-2697; Kanon plan 0001 §2). A `uses:`
# starting with `$/` is GitHub's self-reference: it resolves to this repository at the
# commit that defined this workflow, and the runner downloads it into its action cache
# during `Set up job`, nested references included. So the blocks are never read from the
# workspace — not before the agent, not for their post steps — and a lane that checks out
# a PR branch cut before they existed loses nothing. That retired three steps this file
# carried: a load of the blocks from `github.sha` into the checked-out tree, a reload after
# the agent, and a restore of the telemetry action from the default branch (RA-1588). The
# hook is the project's own code, which a Kanon lane cannot `$/` into, so it stays a `./`
# reference read from the checkout, and keeps its presence check and its put-back.
#
# `claude_args` IS ONE INPUT USED TWICE, and that is a fix rather than a convenience.
# Each lane passed it separately to `claude-code-action` and to `agent-telemetry`, which
# must agree or the row records a model the run did not use. Nothing enforced that.
#
# THE DATABASE IS THE PROJECT'S, AND ITS HOOK STARTS IT (kanon#18, K-LAYOUT-16). The project
# says in `docs/qa/test-database.md` whether its lanes need one: no file (or `none`), or `hook`,
# when its project-setup hook starts the database and writes `DATABASE_URL`. Kanon names no
# engine (the Owner, 2026-10-03). `$/actions/test-database` reads the declaration after the
# checkout and says what to pass the hook's `database` input. It was a job service until #18,
# and a service cannot read the checkout: `services:` sees only inputs, `vars`, `needs`,
# `matrix` and `github` (RA-2592 used that to switch it off by `database: false`, with an
# empty `image`). With no declaration the hook gets `database: 'false'` and `DATABASE_URL`
# stays unset.
#
# `database` IS STILL THE LANE'S SWITCH: a lane that edits prose (`lead-revise`) passes
# `database: false` and starts nothing, whatever the project declares.
#
# THE APP'S PRIVATE KEY NEVER ENTERS THE AGENT'S JOB (`K-AGENT-49`, which says why). Two jobs:
#   • `mint` holds the key, and nothing else runs there: no checkout, no project code, no
#     agent. It mints the lane's narrowed token with `skip-token-revoke`, because its post
#     step would otherwise revoke the token the moment this job ends, and hands it on.
#   • `run` is `lane-agent-job.yml`, the job that checks out, runs the project's hook and the
#     agent. It is given the TOKEN, never the key, and revokes the token itself when it ends.
#
# HOW THE TOKEN CROSSES, and why that way. GitHub drops a job output that contains a masked
# value, so `mint` hex-encodes the token. A job output is never printed, but a value used in a
# step's `env:` or `with:` is printed in that step's header, job-level `env:` included, so a
# plain `needs.mint.outputs` read in a job would put the token in that job's log. A called
# workflow's `secrets:` is the one channel that arrives masked: `run` is a reusable-workflow
# call for that reason, and `lane-agent-job.yml` decodes the value and masks the token
# before any step can print it. What is left, accepted by the Owner (2026-10-04): the
# hex-encoded token sits in GitHub's stored job outputs for this run, short-lived (an hour at
# most) and revoked when `run` ends.
#
# A RE-RUN MUST RE-RUN BOTH JOBS. "Re-run failed jobs" on a red run re-runs `run` alone and
# hands it the token `mint` minted for the earlier attempt, which `run` revoked as it ended.
# So `mint` also passes on the attempt it minted for, and `run`'s token step refuses a token
# from another attempt by name, telling the operator to use "Re-run all jobs".
name: Agent lane

on:
  workflow_call:
    inputs:
      agent:
        description: Telemetry agent name — the `agent` column in the run row.
        required: true
        type: string
      role:
        description: >-
          The agent role the lane runs as (plan 0005 §3.3): `Implementer`, `Lead`, ... Since L4
          the Author and the Judge Apps each hold several roles, so the minted App's slug no
          longer says which; every lane names it.
        required: true
        type: string
      lane:
        description: >-
          Kanon's lane name for the version-2 telemetry row (plan 0002 §2; `LANES` in
          `actions/agent-telemetry/schema.mjs`). Empty writes only the version-1 row.
        required: false
        type: string
        default: ""
      arm:
        description: Human name for this arm, used by classify-agent-result on a red run.
        required: true
        type: string
      prompt:
        description: The agent's instructions. Interpolate issue numbers in the caller.
        required: true
        type: string
      claude_args:
        description: Passed to BOTH claude-code-action and the telemetry row, so they cannot disagree.
        required: true
        type: string
      timeout-minutes:
        description: >-
          Bounds a hang (RA-1336). Size at ~3x this lane's longest real run — EXCEPT where a
          turn cap is the constraint that should bind, in which case size above what the
          cap can take (RA-2212): the implement lanes run 180 for that reason, not because
          3x their longest run is 180.
        required: false
        type: number
        default: 120
      prompt-cache-ttl:
        description: >-
          `CLAUDE_CODE_PROMPT_CACHE_TTL` for this lane, or empty to leave the default.
          AN INPUT RATHER THAN A SPINE CONSTANT (RA-2188): four arms pin `5m` and the rest
          do not, so it is a per-lane decision. It also has to be readable from the
          CALLER — `cache-ttl-check.mjs` joins the pin to the arm name, and a `uses:` job
          accepts only `with:` and `secrets:`, never `env:`, so an env line on the spine
          would name no arm and the four pinned arms would read as unpinned.
        required: false
        type: string
        default: ""
      full-transcript:
        description: >-
          Print the agent's whole transcript into the job log (`show_full_output` on
          `claude-code-action`, RA-2651). Off, the log carries only the init and result
          events, and the execution file that holds the rest is deleted with the runner,
          so a run that ends `completed` with no push and no comment cannot be
          diagnosed afterwards. The log, not an artifact, because Actions masks
          registered secrets in logs and does not mask artifact files. It changes only
          what is printed: the model's input, turns and spend are identical either way.
          OPT-IN PER LANE; the default keeps the action's hidden output.
        required: false
        type: boolean
        default: false
      labels:
        description: >-
          The taxonomy labels this lane's agent may apply, space-separated. The agent's job
          creates each one the repository lacks before the agent starts (plan 0005 §5.3,
          `K-WORK-12`). Empty creates nothing.
        required: false
        type: string
        default: ""
      issue-number:
        description: >-
          The issue this run was dispatched for; recorded on the row (RA-1517), and passed to
          the project-setup hook.
        required: false
        type: string
        default: ""
      pr-number:
        description: >-
          The PR this run was dispatched for; recorded on the row. A PR lane (revise) has
          no issue to identify its run by, so without this the row carries neither.
        required: false
        type: string
        default: ""
      ref:
        description: >-
          What to check out — a revise lane's PR head branch. Empty checks out the
          triggering commit, as a lane that opens a new branch wants. The blocks never
          come from it: they are `$/` references, read from the commit that defined this
          workflow (see the header). The project-setup hook does, so a branch cut before
          the hook existed fails its presence check, by name.
        required: false
        type: string
        default: ""
      fetch-depth:
        description: >-
          `actions/checkout`'s depth. 1 (the default) for a lane that branches from the
          checked-out commit; 0 for a lane that must see a PR branch's history against
          `main` — a revise lane rebases and diffs. See RA-1742 for why 1 is the default.
        required: false
        type: number
        default: 1
      database:
        description: >-
          This lane runs the project's tests, so it reads the test-database declaration
          (`docs/qa/test-database.md`, kanon#18) and passes the project-setup hook
          `database: 'true'` when the project declares one, for the hook to start it and
          set up its schema. A project that declares none gets none either way. Default
          on: a lane that writes code runs the project's tests. Off for a lane that edits
          prose, which gets none whatever the project declares.
        required: false
        type: boolean
        default: true
      browsers:
        description: >-
          Tell the project-setup hook to install a browser. Default on, for a lane that may
          run the E2E tier; off for one that never had it, so converting it adds no install
          minute.
        required: false
        type: boolean
        default: true
      project-setup:
        description: >-
          Run the project-setup hook (and the test-database block before it). Default on, for
          a lane whose agent builds and tests code. Off for a lane whose agent runs none of
          the tree's code (`K-AGENT-50`, kanon#243): the hook, read from the checked-out tree,
          is the tree's code, and on a lane that checks out a pull request it would run
          beside the token. Off skips the presence check, the database and the hook, and
          puts Kanon's own scripts on the agent's PATH by name (`kanon-brief-guard`,
          `kanon-spec-ids`, `kanon-spec-coverage`), so an allow-listed shell can run them
          without an interpreter rule. The Lead's lanes set it off, with a shell allow-list.
        required: false
        type: boolean
        default: true
      push-probe:
        description: >-
          Prove the minted App can push (`git push --dry-run`) after the project's setup
          and before a single turn is paid for. Default off. On for a lane
          whose whole output is a pushed branch, where a missing `contents: write` grant
          would otherwise surface as a 403 at the END of a long run — or not at all, read
          as "the agent had nothing to say". A capability switch like `database`, not a
          hook: the step is the same for every lane that sets it, and the App slug and
          the arm name are what make its message the lane's own.
        required: false
        type: boolean
        default: false
      quality-pr-label:
        description: >-
          OPT-IN quality column (RA-1627). The label on the PR this lane's agent opens, e.g.
          `agent:triage`. Set, the run's `artifacts_filed` counts the PRs carrying it that
          reference `issue-number` and were opened after the agent started — so a run that
          opened none records 0, not absent. Empty (the default) adds no column: a lane
          whose PRs another arm also labels, or that has no measured question, must not
          gain a count it cannot earn.
        required: false
        type: string
        default: ""
      permission-contents:
        description: The minted token's `contents` permission (`read` or `write`), or empty for none. See `Mint App token`.
        required: false
        type: string
        default: ""
      permission-issues:
        description: The minted token's `issues` permission (`read` or `write`), or empty for none. See `Mint App token`.
        required: false
        type: string
        default: ""
      permission-pull-requests:
        description: The minted token's `pull_requests` permission (`read` or `write`), or empty for none. See `Mint App token`.
        required: false
        type: string
        default: ""
      permission-workflows:
        description: The minted token's `workflows` permission (`read` or `write`), or empty for none. See `Mint App token`.
        required: false
        type: string
        default: ""
      permission-actions:
        description: The minted token's `actions` permission (`read` or `write`), or empty for none. See `Mint App token`.
        required: false
        type: string
        default: ""
    outputs:
      # THE CLASSIFIER'S VERDICT ON A RED RUN (RA-2118) — `unavailable` / `exhausted` /
      # `failed` / `not-reached`, empty on a green run. A caller branches on it after the
      # fact: `agent-implement.yml` frees a crashed run's WIP slot only for a run that
      # reached the model and did not finish. Job outputs survive a failed job.
      kind:
        description: classify-agent-result.mjs's `kind` for a red run, empty otherwise.
        value: ${{ jobs.run.outputs.kind }}
      # THE AGENT STEP'S OWN OUTCOME (RA-2592) — `success` / `failure` / `skipped`, the value
      # `steps.agent.outcome` had inside the job. A revise lane's round record reads it to
      # say how the run ended, and that step runs in the CALLER now: it names the lane's
      # login and marker, which a spine must not. Empty when the job was cancelled before
      # it set outputs; the round record already prints `unknown` for that.
      outcome:
        description: The agent step's outcome, readable from the caller after the job.
        value: ${{ jobs.run.outputs.outcome }}
      # THE BRANCH HEADS THE AGENT'S JOB HELD WHEN IT FINISHED (#324): the implementer status's
      # `open` pick stamps only a pull request whose head is one of them. See the spine's
      # `Record the branch heads the agent left`.
      heads:
        description: A JSON array of `{ ref, sha }`, the agent's job's local branches and HEAD after the agent, or empty.
        value: ${{ jobs.run.outputs.heads }}
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true
      claude-token:
        required: true

# NO `permissions:` BLOCK, DELIBERATELY (RA-2592). A called workflow's block can only
# NARROW its caller's grant, and without one the job gets exactly what the calling job
# was given — so each lane's default-token scope is decided where its trigger is, and
# converting a lane leaves it unchanged. That is load-bearing: the telemetry action reads
# a PR lane's diff size with the DEFAULT token, and the `contents: read` that stood here
# stripped the revise lanes' `pull-requests: read`, so every revise row would have lost
# the denominator cost comparisons normalise by, silently (telemetry never reds a run).
# Declaring `pull-requests: read` here instead would fail every caller that does not
# grant it — the issue lanes grant `contents: read` alone, which is also minimal.
# The App token still carries every write.

jobs:
  # HOLDS THE KEY, AND ONLY THE MINT (`K-AGENT-49`; see the header). No step here reads the
  # workspace or runs anything a lane or its agent wrote, so nothing can rewrite the cached
  # action before its post step, which skips the revoke and returns.
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      app-slug: ${{ steps.app-token.outputs.app-slug }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # `run` revokes it when the agent is done. The default would revoke it as THIS job
          # ends, before `run` has started.
          skip-token-revoke: "true"
          # NARROWED TO WHAT THE CALLING LANE'S AGENT USES (#48, `K-AGENT-46`), below the App's
          # grant. An empty input requests nothing, and a token with every input empty would
          # carry the App's whole grant, so every lane passes its set and
          # `app-token-permissions.test.ts` holds each one to it.
          permission-contents: ${{ inputs.permission-contents }}
          permission-issues: ${{ inputs.permission-issues }}
          permission-pull-requests: ${{ inputs.permission-pull-requests }}
          permission-workflows: ${{ inputs.permission-workflows }}
          permission-actions: ${{ inputs.permission-actions }}

      # HEX, BECAUSE GITHUB DROPS A JOB OUTPUT THAT HOLDS A MASKED VALUE ("Skip output … may
      # contain secret"), and the action masks the token. `-v`, or `od` folds repeated lines
      # into `*`. Nothing prints the value: only `run`'s `secrets:` reads it.
      - name: Seal the token for the agent's job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE AGENT'S JOB, GIVEN THE TOKEN AND NEVER THE KEY (`K-AGENT-49`). `!cancelled()`, not the
  # implicit `success()`: a failed mint still reaches `run`, whose token step then fails and
  # whose `agent-finish` records the run with `token=failure`, as it did when the mint was
  # that job's own step.
  run:
    needs: mint
    if: ${{ !cancelled() }}
    uses: $/.github/workflows/lane-agent-job.yml
    with:
      agent: ${{ inputs.agent }}
      role: ${{ inputs.role }}
      lane: ${{ inputs.lane }}
      arm: ${{ inputs.arm }}
      prompt: ${{ inputs.prompt }}
      claude_args: ${{ inputs.claude_args }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      prompt-cache-ttl: ${{ inputs.prompt-cache-ttl }}
      full-transcript: ${{ inputs.full-transcript }}
      labels: ${{ inputs.labels }}
      issue-number: ${{ inputs.issue-number }}
      pr-number: ${{ inputs.pr-number }}
      ref: ${{ inputs.ref }}
      fetch-depth: ${{ inputs.fetch-depth }}
      database: ${{ inputs.database }}
      browsers: ${{ inputs.browsers }}
      project-setup: ${{ inputs.project-setup }}
      push-probe: ${{ inputs.push-probe }}
      quality-pr-label: ${{ inputs.quality-pr-label }}
      app-slug: ${{ needs.mint.outputs.app-slug }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
      claude-token: ${{ secrets.claude-token }}
