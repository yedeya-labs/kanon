# The caller of Kanon's agent-dispatch-sweep lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Dispatch sweep (Lead)

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "'true' to actually re-dispatch on a dispatch (anything else = dry run)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    uses: yedeya-labs/kanon/.github/workflows/agent-dispatch-sweep.yml@v0.39.0
    with:
      apply: ${{ inputs.apply }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      QA_STORE_BUCKET: ${{ secrets.QA_STORE_BUCKET }}
      QA_STORE_ROLE_ARN: ${{ secrets.QA_STORE_ROLE_ARN }}
