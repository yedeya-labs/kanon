# The deploy lane, once per environment (plan 0010 §4 to §8, step D4). The adopter's deploy
# caller calls it once per declared environment, in order, each call `needs:` the one before, so
# an environment deploys only after the one before it succeeded on the same release. Called with
# the environment, its position and the build the release's run made (`deploy-release.yml`'s
# `build` output, step D5): the role (`production` for the last, `pre-production` for the
# others) is read from the adoption record at the release's commit, never passed in.
#
#   declare → deploy (environment, concurrency, approval) → verdict
#                                                        → record → report → announce → notify
#
# DECLARE (`scripts/deploy-gate.mjs declare`), with `contents: read` alone and no credential: the
# release again, and the adoption record's `## Deploy` list at its commit must hold this
# environment at this position, else `declaration-mismatch`. It outputs the role, and the
# environment the deploy job sets: none under the record's `no-environments` marker (plan 0010
# §13; kanon#890 measured that an empty `environment:` leaves the job without one, so one deploy
# job serves both). And THE HOLD (kanon#894): under either fallback marker, on a `release` run,
# the last environment is `held`, its deploy job skipped, no row written and no issue touched;
# the run's summary says production waits for the Maintainer's dispatch, which `declare` admits
# only when the Maintainer the record's `## People` names started the attempt; `deploy` checks it
# again, for a re-run of the failed jobs. The hold lives here, not in the caller, so the caller
# `kanon init` writes is the same with or without a fallback.
#
# THE DEPLOY JOB sets `environment:`, so GitHub runs it only after the environment's protection
# rules pass, and its OIDC token's subject is `…:environment:<name>`, which each environment's
# cloud role trusts alone (plan 0010 §5). One concurrency group per environment, queued, never
# cancelled mid-run (§6): `cancel-in-progress: false`, `queue: max`. Once it holds its slot and
# its approval, the supersede check refuses, on a release, a commit older than the environment's
# last successful deploy (`superseded`); a dispatch may roll back, and its row says so. Then it
# checks out the release's commit, with no credential persisted, downloads the build's artifact
# by the run-scoped name the `build` input gives (`kanon-deploy-build-<run id>-<attempt>`), and
# checks its contents against the build job's SHA-256 (`scripts/deploy-build.mjs`): an expired,
# missing or different artifact fails the job at the `build` stage, before any hook runs, and
# nothing is rebuilt here (plan 0010 decision 8). Then it runs the adopter's hooks:
# `.github/actions/deploy`, which obtains the environment's credential and deploys the checked
# directory, its `artifact` input, then the optional `.github/actions/smoke-reset`, then
# `.github/actions/smoke` (plan 0013 §6). LIVE, SMOKE FAILED (plan 0013 §7.1): the reset and
# smoke steps continue on error, so the job succeeds when the deploy hook did and GitHub marks the
# deployment `success`; their outcomes are outputs, `verdict` fails the call on either, and the
# next environment's call, which `needs:` this one, doesn't start. The deploy hook's step alone
# receives `KANON_DEPLOY_SECRET`, an environment secret, empty when the environment holds none
# (plan 0010 §7, `K-AGENT-47`). It is an optional secret of this workflow, and the caller maps it
# from `secrets.KANON_DEPLOY_SECRET`: GitHub evaluates that expression in this job's scope, where
# the environment's secret comes first (kanon#1049 measured that an undeclared or unmapped secret
# is empty here). No environment's job runs the build hook.
#
# AFTER (plan 0010 §8): `record` writes this environment's `deploy` row (`scripts/deploy-row.mjs`),
# reading the run's approvals to tell a rejection from a failure (kanon#890), and `report` files,
# comments on or closes this environment's issues (`scripts/deploy-report.mjs`), with no checkout:
# `Deploy to <environment> failed` for a failed deploy, `Smoke check on <environment> failed` for
# a live release whose reset or smoke check failed, which also closes the deploy issue.
#
# THE ANNOUNCEMENT (`K-SHIP-10`; plan 0011 N9, plan 0010 §8; the Owner's decisions of
# 2026-10-15). Each environment announces its own deploy. `announce` (`scripts/announce-deploy.mjs`)
# writes one `deploy` message from the record's outcome: a deploy that landed names the releases
# since the environment's previous successful GitHub deployment (`deployments: read`, nothing
# written back), and a failure is `critical` on production and `warning` elsewhere, linking the run
# and the issue `report` filed. A deploy that landed and failed its smoke check gets the landed
# message, flagged, at the failure's severity (plan 0013 §7.2). A refusal, a rejection or a cancel
# announces nothing. It holds no chat secret, and runs only when the run's commit has a notify hook. `notify` hands the message to
# the adopter's hook (`$/actions/notify`) with `KANON_CHAT_DEPLOY`, an optional secret of this
# workflow, and no other: the one job here that holds it, of the shape
# `tests/unit/helpers/notify-jobs.ts` holds every `notify` job to. A post that fails turns
# `notify` red and leaves every deploy job green, so a failure to announce is never a deploy's.
# `notify` continues on error, so a failed post leaves the environment's call green and the next
# environment deploys (kanon#1048). Never re-run the run to post again: a re-run of `notify`, by
# job or with the failed jobs, re-runs every job after it, the next environment's deploy too.
#
# NO MODEL IN THE DEPLOY PATH (plan 0010 §9): no agent, no Claude credential, no App key or App
# token (`tests/unit/deploy-lane.test.ts`).
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy, as the adoption record's `## Deploy` list names it.
        required: true
        type: string
      position:
        description: The environment's place in the declared list, from 1. The lane refuses a call whose environment isn't at this position.
        required: true
        type: number
      build:
        description: "The build to deploy: `deploy-release.yml`'s `build` output, as the caller's `needs.release.outputs.build`. The lane downloads the artifact it names, which must be this run's, and checks it against its digest."
        required: true
        type: string
    secrets:
      # The `deploy` kind's secret (plan 0011 §3.2), read by the `notify` job alone. Optional: a
      # caller that maps none deploys as before, and `notify` records `skipped` (`no-secret`).
      KANON_CHAT_DEPLOY:
        description: Where the adopter's notify hook posts this environment's deploy announcement. Optional.
        required: false
      # The deploy hook's secret (plan 0010 §7, `K-AGENT-47`), read by the deploy hook's step alone.
      # The caller maps it from `secrets.KANON_DEPLOY_SECRET`, which GitHub evaluates in the deploy
      # job's scope, so it resolves to the environment's secret first, then the repository's.
      # Unmapped, it is empty (kanon#1049). Optional: an environment that needs none holds none.
      KANON_DEPLOY_SECRET:
        description: The deploy hook's secret, the environment's own, which the caller maps by the same name. Optional.
        required: false

# Each job declares its own, and none is granted more than it uses.
permissions: {}

jobs:
  declare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      refusal: ${{ steps.check.outputs.refusal }}
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      published-at: ${{ steps.check.outputs.published-at }}
      role: ${{ steps.check.outputs.role }}
      environment: ${{ steps.check.outputs.environment }}
      fallback: ${{ steps.check.outputs.fallback }}
      held: ${{ steps.check.outputs.held }}
      unauthorized: ${{ steps.check.outputs.unauthorized }}
    steps:
      - uses: $/actions/kanon-path
      - name: Check this environment against the declaration at the release's commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          DISPATCH_RELEASE: ${{ github.event.inputs.release }}
          ENVIRONMENT: ${{ inputs.environment }}
          POSITION: ${{ inputs.position }}
        # The actor checked is whoever started this attempt: the runner's own
        # `GITHUB_TRIGGERING_ACTOR`, else `GITHUB_ACTOR`. The `deploy` job checks it again.
        run: node "$KANON/scripts/deploy-gate.mjs" declare

  deploy:
    name: deploy
    needs: declare
    if: needs.declare.outputs.held == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.declare.outputs.environment }}
    concurrency:
      group: kanon-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      deployments: read
      id-token: write
    outputs:
      started-at: ${{ steps.start.outputs.at }}
      refusal: ${{ steps.supersede.outputs.refusal }}
      unauthorized: ${{ steps.supersede.outputs.unauthorized }}
      redeploy: ${{ steps.supersede.outputs.redeploy }}
      rollback: ${{ steps.supersede.outputs.rollback }}
      build-failed: ${{ steps.build-input.outcome == 'failure' || steps.download.outcome == 'failure' || steps.build-check.outcome == 'failure' }}
      deploy-started-at: ${{ steps.before-deploy.outputs.at }}
      deploy-ended-at: ${{ steps.after-deploy.outputs.at }}
      deploy-outcome: ${{ steps.deploy.outcome }}
      reset-outcome: ${{ steps.reset.outcome }}
      reset-ended-at: ${{ steps.after-reset.outputs.at }}
      smoke-outcome: ${{ steps.smoke.outcome }}
      ended-at: ${{ steps.end.outputs.at }}
    steps:
      - name: Mark the job's start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: $/actions/kanon-path
      # Under a fallback marker, production's Maintainer check, again, for whoever started THIS
      # attempt: a "Re-run failed jobs" re-runs this job with `declare`'s outputs reused. Then the
      # supersede check.
      - name: Refuse a non-Maintainer's production attempt, and an older commit than the last deploy
        id: supersede
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ needs.declare.outputs.sha }}
          FALLBACK: ${{ needs.declare.outputs.fallback }}
          ROLE: ${{ needs.declare.outputs.role }}
        run: node "$KANON/scripts/deploy-gate.mjs" supersede
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.declare.outputs.sha }}
          persist-credentials: false
      # The build every environment deploys, never rebuilt here: this run's artifact, by the name
      # the build job gave it, checked against the build job's digest before any hook runs.
      - name: Read the build
        id: build-input
        env:
          BUILD: ${{ inputs.build }}
        run: node "$KANON/scripts/deploy-build.mjs" input
      - name: Download the build
        id: download
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.build-input.outputs.artifact }}
          path: ${{ runner.temp }}/kanon-deploy-artifact
      # Runs after a failed download too, so an expired artifact fails by name.
      - name: Check the build against its digest
        id: build-check
        if: ${{ !cancelled() && steps.build-input.outcome == 'success' }}
        env:
          ARTIFACT: ${{ steps.build-input.outputs.artifact }}
          DIGEST: ${{ steps.build-input.outputs.digest }}
        run: node "$KANON/scripts/deploy-build.mjs" check
      - name: Mark the deploy's start
        id: before-deploy
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        env:
          KANON_DEPLOY_SECRET: ${{ secrets.KANON_DEPLOY_SECRET }}
        with:
          environment: ${{ inputs.environment }}
          role: ${{ needs.declare.outputs.role }}
          release: ${{ needs.declare.outputs.tag }}
          sha: ${{ needs.declare.outputs.sha }}
          artifact: ${{ steps.build-check.outputs.path }}
          probe: "false"
          environments: ""
      - name: Mark the deploy's end
        id: after-deploy
        if: always() && steps.deploy.outcome == 'success'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # THE RESET AND THE SMOKE CHECK (plan 0013 §6, §7.1): each `continue-on-error`, so once the
      # deploy hook succeeded the job concludes `success` and GitHub marks the deployment `success`
      # (measured, kanon#1166 item 1): the release is live. Their outcomes are output, and the
      # `verdict` job fails the call on either, so the chain stops. The reset hook is optional:
      # absent at the release's commit, its step is skipped and the summary says so. A failed
      # reset skips the smoke check, whose data is then in an unknown state. Both get
      # `KANON_SMOKE_TRIGGER`, `deploy` here, so a hook can tell a deploy's run from a scheduled one.
      - name: Say there is no reset hook
        if: hashFiles('.github/actions/smoke-reset/action.yml') == ''
        run: |
          echo "No reset hook at .github/actions/smoke-reset, so none ran: the smoke check starts from whatever the last run left (docs/lanes.md, \"The deploy lane\")." >> "$GITHUB_STEP_SUMMARY"
      - name: Reset
        id: reset
        if: hashFiles('.github/actions/smoke-reset/action.yml') != ''
        continue-on-error: true
        uses: ./.github/actions/smoke-reset
        env:
          KANON_SMOKE_TRIGGER: deploy
        with:
          environment: ${{ inputs.environment }}
          role: ${{ needs.declare.outputs.role }}
          release: ${{ needs.declare.outputs.tag }}
      - name: Mark the reset's end
        id: after-reset
        if: always() && (steps.reset.outcome == 'success' || steps.reset.outcome == 'failure' || steps.reset.outcome == 'cancelled')
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Smoke
        id: smoke
        if: steps.reset.outcome != 'failure'
        continue-on-error: true
        uses: ./.github/actions/smoke
        env:
          KANON_SMOKE_TRIGGER: deploy
        with:
          environment: ${{ inputs.environment }}
          role: ${{ needs.declare.outputs.role }}
          release: ${{ needs.declare.outputs.tag }}
      - name: Mark the job's end
        id: end
        if: always()
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # THE VERDICT (plan 0013 §7.1): the deploy job succeeds when the deploy hook did, so this job
  # fails the call when the reset or the smoke check failed. A failed job fails the call, and the
  # next environment's call `needs:` this one, so the chain stops before it, as it did when a smoke
  # failure failed the deploy job. No permissions, no checkout, no hook: it reads two outputs.
  verdict:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail the call when the reset or the smoke check failed
        env:
          RESET: ${{ needs.deploy.outputs.reset-outcome }}
          SMOKE: ${{ needs.deploy.outputs.smoke-outcome }}
        run: |
          set -euo pipefail
          if [ "$RESET" = failure ]; then
            echo "::error::The release is live, but the reset hook failed, so the smoke check didn't run. The next environment doesn't start. The smoke issue says how to check it again."
            exit 1
          fi
          if [ "$SMOKE" = failure ]; then
            echo "::error::The release is live, but its smoke check failed. The next environment doesn't start. The smoke issue says how to check it again."
            exit 1
          fi
          echo "The reset (${RESET:-not run}) and the smoke check (${SMOKE:-not run}) didn't fail."

  record:
    needs: [declare, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      written: ${{ steps.row.outputs.written }}
      outcome: ${{ steps.row.outputs.outcome }}
      stage: ${{ steps.row.outputs.stage }}
      refusal: ${{ steps.row.outputs.refusal }}
    steps:
      - uses: $/actions/kanon-path
      - name: Write the row
        id: row
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ENVIRONMENT: ${{ inputs.environment }}
          POSITION: ${{ inputs.position }}
          BUILD: ${{ inputs.build }}
          KANON_WORKFLOW_REF: ${{ job.workflow_ref }}
          KANON_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node "$KANON/scripts/deploy-row.mjs" environment
      - name: Upload the row
        if: steps.row.outputs.written == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kanon-deploy-row-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.position }}
          path: ${{ runner.temp }}/kanon-deploy-row/kanon-deploy-row.json
          retention-days: 90
          if-no-files-found: error

  # This environment's issue: filed or commented on after a failure or a refusal, closed after a
  # success. No checkout.
  report:
    needs: [declare, deploy, record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      # The issue a failure filed or commented on, for the announcement's link; empty otherwise.
      issue: ${{ steps.issue.outputs.issue }}
    steps:
      - uses: $/actions/kanon-path
      - name: File, comment on or close this environment's issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ENVIRONMENT: ${{ inputs.environment }}
          POSITION: ${{ inputs.position }}
          RELEASE: ${{ needs.declare.outputs.tag || github.event.release.tag_name || github.event.inputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$KANON/scripts/deploy-report.mjs" environment

  # THE ANNOUNCEMENT'S MESSAGE (plan 0011 N9): written from the record's outcome, after the report,
  # so a failure links its issue. Never for a held or refused environment, nor in a cancelled run.
  # No chat secret, no write: it reads the releases and this environment's deployments.
  announce:
    needs: [declare, deploy, record, report]
    if: ${{ !cancelled() && needs.declare.outputs.held == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      # `present` or `none`: the `notify` job starts only with a hook (plan 0011 decision 2).
      hook: ${{ steps.hook.outputs.hook }}
      # The message artifact's name, with this job's attempt and the environment's position, which
      # the `notify` job takes as is (plan 0011 §4). Empty when nothing was uploaded.
      message-artifact: ${{ steps.upload.outputs.artifact-id && format('kanon-notify-deploy-announce-{0}-{1}-{2}', inputs.position, github.run_id, github.run_attempt) || '' }}
    steps:
      # The hook's presence, at the run's commit, from a sparse checkout of its directory alone,
      # which runs nothing and keeps no credential.
      - name: Check out the notify hook's directory, to see whether it exists
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/notify
      - name: Is there a notify hook?
        id: hook
        run: |
          set -euo pipefail
          if [ -f .github/actions/notify/action.yml ]; then hook=present; else hook=none; fi
          echo "hook=$hook" >> "$GITHUB_OUTPUT"
          if [ "$hook" = none ]; then
            echo "No notify hook: this deploy is not announced. docs/notifications.md says how to add one." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: $/actions/kanon-path
        if: steps.hook.outputs.hook == 'present'
      - name: Write the deploy message
        id: message
        if: steps.hook.outputs.hook == 'present'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.environment }}
          VERSION: ${{ needs.declare.outputs.tag }}
          SHA: ${{ needs.declare.outputs.sha }}
          ROLE: ${{ needs.declare.outputs.role }}
          # Under `no-environments` GitHub records no deployment, so the range is the release alone (kanon#1038).
          FALLBACK: ${{ needs.declare.outputs.fallback }}
          OUTCOME: ${{ needs.record.outputs.outcome }}
          FAILED_STAGE: ${{ needs.record.outputs.stage }}
          ISSUE: ${{ needs.report.outputs.issue }}
          MESSAGE_PATH: ${{ runner.temp }}/kanon-notify-message/message.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MESSAGE_PATH")"
          node "$KANON/scripts/announce-deploy.mjs"
      - name: Upload the message
        id: upload
        if: steps.message.outputs.message != ''
        uses: actions/upload-artifact@v7
        with:
          name: kanon-notify-deploy-announce-${{ inputs.position }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.message.outputs.message }}
          if-no-files-found: error

  # THE POST (plan 0011 §5, `K-OBS-19`): the adopter's hook, with this kind's secret and no other,
  # a token that reads contents and nothing more. Past an admitting `declare` and with a hook,
  # never in a cancelled run, and after a failed `announce` too, so a message not
  # posted is recorded as `skipped`. Its position keeps its telemetry row's artifact apart from
  # the other environments' in the same run.
  # A failed post never blocks a deploy (kanon#1048, the Owner's decision of 2026-10-20): the job
  # still concludes `failure`, red, for doctor's `notify.failing`, but the environment's call
  # succeeds, so the next environment deploys as it would have. The sandbox's probe measured it.
  notify:
    needs: [declare, announce]
    if: ${{ !cancelled() && needs.declare.outputs.held == 'false' && needs.announce.outputs.hook == 'present' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.notify.outputs.outcome }}
    steps:
      - uses: $/actions/notify
        id: notify
        with:
          kind: deploy
          artifact: ${{ needs.announce.outputs.message-artifact }}
          secret: ${{ secrets.KANON_CHAT_DEPLOY }}
          position: ${{ inputs.position }}
