# Rebase — one conflicting PR's resolution (kanon#279).
#
# CALLED ONLY BY `agent-rebase.yml`, once per matrix entry. Three jobs, for `K-AGENT-49`:
#   • `mint` holds the Author App's private key and runs nothing else: no checkout, no
#     project code, no agent. It mints this PR's narrowed token with `skip-token-revoke` and
#     hands it on hex-encoded, because GitHub drops a job output holding a masked value.
#   • `resolve` is `rebase-agent-job.yml`, which checks out the PR, runs the project's hook
#     and the agent with the token, never the key, and revokes the token as its last step.
#     A called workflow, because its `secrets:` is the one channel that arrives masked.
#   • `implementer-status` holds the key too, after the agent's job, and runs only Kanon's Node
#     and `actions/implementer-status`: it carries the status to the head this entry pushed
#     (#1379), so a PR is stamped when its own entry ends, not when the whole matrix has.
# The lane's own header says what the resolution does.
name: Rebase — one PR

on:
  workflow_call:
    inputs:
      max_turns:
        description: "A turn limit raised for this one dispatched run (its lane's max_turns), passed through. Empty runs the lane's limit."
        required: false
        type: string
        default: ""
      reason:
        description: "Why this dispatched run raises max_turns (its lane's reason), passed through."
        required: false
        type: string
        default: ""
      pr:
        description: The conflicting PR this entry resolves (one of the filter's `prs`).
        required: true
        type: number
      start-head:
        description: The PR's head as the lane's filter read it, before any agent ran (its `heads` record), where the implementer status's chain starts.
        required: false
        type: string
        default: ""
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true
      claude-token:
        required: false
      anthropic-api-key:
        required: false
    outputs:
      # `rebase-agent-job.yml`'s `{ pr, base, heads }`, passed up for the lane's implementer
      # status (#1263).
      checked:
        description: "`{ pr, base, heads }` as JSON, or empty."
        value: ${{ jobs.resolve.outputs.checked }}

# NO `permissions:` BLOCK: the lane's matrix job sets this call's ceiling, and without a block
# here each job gets exactly what that job was given.
jobs:
  # HOLDS THE KEY, AND ONLY THE MINT (`K-AGENT-49`). Nothing else runs here: no checkout, no
  # project code, no agent, so nothing can rewrite the cached action before its post step,
  # which skips the revoke (the agent's job revokes the token when it ends). The token
  # crosses hex-encoded, because GitHub drops a job output holding a masked value.
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      app-slug: ${{ steps.app-token.outputs.app-slug }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint triage-fix App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # The agent's job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          # Narrowed to what this step uses (#48, `K-AGENT-46`): it pushes the merge (which may carry the default branch's workflow changes, so `workflows`), and comments and labels the pull request.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Seal the token for the agent's job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE AGENT'S JOB, GIVEN THE TOKEN AND NEVER THE KEY (`K-AGENT-49`). `!cancelled()`: a failed
  # mint still reaches it, and its finish block records `token=failure`.
  resolve:
    needs: mint
    if: ${{ !cancelled() }}
    uses: $/.github/workflows/rebase-agent-job.yml
    with:
      max_turns: ${{ inputs.max_turns }}
      reason: ${{ inputs.reason }}
      pr: ${{ inputs.pr }}
      app-slug: ${{ needs.mint.outputs.app-slug }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
      claude-token: ${{ secrets.claude-token }}
      anthropic-api-key: ${{ secrets.anthropic-api-key }}

  # THE IMPLEMENTER STATUS IS A CHAIN (plan 0005 §3.3, question 6; step L3). A fixed job after
  # this entry's agent, never the agent: it moves `kanon/role: implementer` to the resolved head
  # only when the head recorded before the agent ran (`start-head`) carried one created by the
  # Implementer's App, and every commit on the first-parent path between them is the App's (the
  # merge's second parent is the default branch). And only to a head the agent's job held, made
  # on the head it fetched, which must be the one recorded before the agent (#1263): `resolve`'s
  # `checked`, which names its pull request. Otherwise it sets none and says why. It never reds
  # the lane. Since L4 the Merger requires the status, and the lane's filter refuses a pull
  # request whose head lacks it (`rebase-lane.mjs`, `ineligible`).
  #
  # IN THIS CALL, PER ENTRY (#1379). After the whole matrix, the stamp waited for every entry and
  # only the last entry's record survived. Here each entry's own job reads its own record, as soon
  # as its agent's job ends. After the write, the action re-delivers a changes-request filed on the
  # head before the status (`actions/implementer-status`).
  #
  # HOLDS THE KEY (`K-AGENT-49`): nothing here but Kanon's Node and the action. No checkout, no
  # project code, no agent (`tests/unit/app-key-isolation.test.ts`).
  implementer-status:
    needs: [resolve]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/actions/kanon-path
      - uses: $/actions/implementer-status
        continue-on-error: true
        with:
          mode: carry
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}
          pr: ${{ inputs.pr }}
          start-head: ${{ inputs.start-head }}
          heads: ${{ fromJson(needs.resolve.outputs.checked || '{}').pr == inputs.pr && fromJson(needs.resolve.outputs.checked || '{}').heads || '' }}
          base: ${{ fromJson(needs.resolve.outputs.checked || '{}').pr == inputs.pr && fromJson(needs.resolve.outputs.checked || '{}').base || '' }}
