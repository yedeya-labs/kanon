# Rebase — one conflicting PR's resolution (kanon#279).
#
# CALLED ONLY BY `agent-rebase.yml`, once per matrix entry. Two jobs, for `K-AGENT-49`:
#   • `mint` holds the Implementer App's private key and runs nothing else: no checkout, no
#     project code, no agent. It mints this PR's narrowed token with `skip-token-revoke` and
#     hands it on hex-encoded, because GitHub drops a job output holding a masked value.
#   • `resolve` is `rebase-agent-job.yml`, which checks out the PR, runs the project's hook
#     and the agent with the token, never the key, and revokes the token as its last step.
#     A called workflow, because its `secrets:` is the one channel that arrives masked.
# The lane's own header says what the resolution does.
name: Rebase — one PR

on:
  workflow_call:
    inputs:
      pr:
        description: The conflicting PR this entry resolves (one of the filter's `prs`).
        required: true
        type: number
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true
      claude-token:
        required: true

# NO `permissions:` BLOCK: the lane's matrix job sets this call's ceiling, and without a block
# here each job gets exactly what that job was given.
jobs:
  # HOLDS THE KEY, AND ONLY THE MINT (`K-AGENT-49`). Nothing else runs here: no checkout, no
  # project code, no agent, so nothing can rewrite the cached action before its post step,
  # which skips the revoke (the agent's job revokes the token when it ends). The token
  # crosses hex-encoded, because GitHub drops a job output holding a masked value.
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
      app-slug: ${{ steps.app-token.outputs.app-slug }}
      # The attempt this token was minted for. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Mint triage-fix App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # The agent's job revokes it when it ends. The default would revoke it as THIS job ends.
          skip-token-revoke: "true"
          # Narrowed to what this step uses (#48, `K-AGENT-46`): it pushes the merge (which may carry the default branch's workflow changes, so `workflows`), and comments and labels the pull request.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Seal the token for the agent's job
        id: seal
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: printf 'sealed=%s\n' "$(printf %s "$TOKEN" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  # THE AGENT'S JOB, GIVEN THE TOKEN AND NEVER THE KEY (`K-AGENT-49`). `!cancelled()`: a failed
  # mint still reaches it, and its finish block records `token=failure`.
  resolve:
    needs: mint
    if: ${{ !cancelled() }}
    uses: $/.github/workflows/rebase-agent-job.yml
    with:
      pr: ${{ inputs.pr }}
      app-slug: ${{ needs.mint.outputs.app-slug }}
      mint-attempt: ${{ needs.mint.outputs.attempt }}
    secrets:
      app-token: ${{ needs.mint.outputs.sealed }}
      claude-token: ${{ secrets.claude-token }}
