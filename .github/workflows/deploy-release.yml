# The deploy lane, once per release (plan 0010 §3 to §8, step D4): the gate, the trust probe, and
# the row and the issue when the run stops before any environment. `deploy.yml` deploys each
# environment, one call per environment.
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S DEPLOY CALLER, `.github/workflows/deploy.yml` in
# the adopter's repository, which `kanon init` writes from the adoption record's `## Deploy`
# list (plan 0010 §4, step D6): one `release` job calling this file with the declared list and
# `targets: ${{ vars.KANON_DEPLOY_TARGETS }}`, then one `deploy-<position>` job per environment
# calling `deploy.yml` with the `release` job's `build` and `targets` outputs, chained by `needs:`. The
# caller holds the triggers and maps no secret into this workflow (`K-AGENT-47`). Each
# `deploy-<position>` job maps `deploy.yml`'s two optional secrets by name: `KANON_CHAT_DEPLOY`,
# and `KANON_DEPLOY_SECRET`, which GitHub evaluates in `deploy.yml`'s job that sets
# `environment:`, so it resolves to the environment's secret first (kanon#1049).
#
# THE CALLER'S TRIGGERS — this lane's contract with it:
#   release:
#     types: [published]        — a stable release and a pre-release alike (decision 4)
#   workflow_dispatch:
#     inputs:
#       release: { type: string, required: true }   — an existing release's tag, to deploy again;
#                                                     dispatched AT that tag (`--ref <tag>`), which
#                                                     the gate requires (#914)
# A release made with the workflow token starts no run, so the deploy lane needs the Releaser
# (plan 0010 §3, decision 3).
#
# THE GATE (`scripts/deploy-gate.mjs gate`) holds no secret and no cloud credential, and refuses,
# by code: a draft or missing release, a tag that moved, or a dispatch run at another ref than its
# release's tag (`draft`, `no-release`); a commit off the default branch (`not-default-branch`);
# a caller list that isn't the adoption record's at that commit, in order
# (`declaration-mismatch`); and a commit whose `ci.yml` push run isn't green, waited for up to
# the record's CI wait, 90 minutes by default (`ci-red`, `ci-timeout`; `K-SHIP-8`). The job's
# limit is a hosted job's, 360 minutes. The gate never waits longer than 345 of them
# (`CI_WAIT_CEILING` in `scripts/deploy-gate.mjs`), whatever the record declares, so a CI that
# never finishes ends in `ci-timeout`, which is filed, not in a cancellation, which files nothing.
#
# THE TRUST PROBE (plan 0010 §5, decision 6). A job outside every environment, with
# `id-token: write`, runs the adopter's deploy hook with `probe: 'true'` and the declared list.
# The hook tries to obtain each environment's cloud credential exactly as it would deploy, from
# role identifiers it can read outside the environments, and writes one word per environment, `refused`, `obtained` or
# `unconfigured`, as JSON to `$RUNNER_TEMP/kanon-deploy-probe.json`. The judge prints the line
# doctor reads, `kanon-deploy-probe/v1 {...}`, and passes only when every environment refused:
# `obtained` fails `trust-unbound`, anything else `probe-unconfigured`. Under the adoption
# record's `no-environments` marker the probe is SKIPPED (the probe decision): every role then
# trusts the release tags' subject, which the probe's own job carries.
#
# THE TARGETS (kanon#1555, the Owner's decision of 2026-11-01). A composite action can't read
# `vars`, and the probe's job has no environment and no secret, so the hook can't find a role held
# outside the tree on its own. The caller can: `kanon init` writes it mapping the repository
# variable `KANON_DEPLOY_TARGETS`, a JSON object naming each environment's role identifier, into
# the `targets` input. The gate job's first step (`scripts/deploy-gate.mjs targets`) reads it
# against the caller's list: unset, its output is empty and the hook is handed nothing, as before;
# set, it must name every listed environment, or the job fails by the variable's name. The probe's
# hook step gets the output as `KANON_DEPLOY_TARGETS`, and this workflow publishes it as its
# `targets` output, which the caller hands each `deploy.yml` call, whose deploy hook step gets its
# environment's own as `KANON_DEPLOY_TARGET`. So every environment deploys with the role the probe
# tried. Environment variables, not inputs, so a hook written before them stays valid. Not a
# secret: a role's identifier names it, its trust condition guards it (plan 0010 §5), and the
# run's log prints it.
#
# THE BUILD (plan 0010 §4, decision 8, step D5). One build, one artifact: the `build` job runs
# after the gate and the probe, when the gate succeeded and the probe either succeeded or was
# skipped under the `no-environments` marker, never after a failed or cancelled probe (its `if:`
# says so: GitHub skips a job whose need was skipped unless its `if:` lets it run). It holds
# `contents: read` alone: no `id-token`, no secret, no environment, so the build's tools and
# dependencies never meet a credential. It checks out the release's commit (the gate's, which on
# a dispatch is the commit the release's tag resolves to), runs the adopter's
# `.github/actions/build` once into `$RUNNER_TEMP/kanon-deploy-artifact/`, and uploads that
# directory as `kanon-deploy-build-<run id>-<attempt>`, kept 35 days, the longest a production
# job may wait for its reviewer. Its `build` output, which this workflow publishes as its own
# `build` output for the caller to hand each `deploy.yml` call, names the artifact and carries
# the SHA-256 of its contents (`scripts/deploy-build.mjs`); every environment checks the
# download against it before its deploy hook runs.
#
# AFTER (plan 0010 §8). A run that stops before any environment (the gate, the probe or the
# build) never starts the environment calls, so `record` writes one `deploy` row for the first
# environment (open-question decision 4), and `report` files on, or comments on, the first
# environment's issue. A probe skipped under the `no-environments` marker is not a stop. A run
# that goes on writes nothing here: each environment's call records and reports its own.
#
# NO MODEL IN THE DEPLOY PATH (plan 0010 §9): no agent, no Claude credential, no App key or App
# token, in either deploy workflow (`tests/unit/deploy-lane.test.ts`).
name: Deploy release

on:
  workflow_call:
    inputs:
      environments:
        description: The declared environments, in deploy order, separated by spaces, exactly as the adoption record's `## Deploy` list names them. The gate refuses any other list.
        required: true
        type: string
      targets:
        description: "Each declared environment's deploy target, the repository variable `KANON_DEPLOY_TARGETS`, which only the caller can read and passes as it is: a JSON object naming each environment's role identifier. The lane hands it to the deploy hook, in the probe and in each environment's job. Not a secret. Optional: empty, the hook is handed none."
        required: false
        default: ""
        type: string
    outputs:
      build:
        description: "The build every environment deploys: a JSON object naming its artifact, `kanon-deploy-build-<run id>-<attempt>`, with the SHA-256 of its contents and the build's duration. The caller hands it to each `deploy.yml` call as its `build` input."
        value: ${{ jobs.build.outputs.build }}
      targets:
        description: "The declared environments' deploy targets, as the gate read them from the `targets` input: one JSON object, or empty when the variable is unset. The caller hands it to each `deploy.yml` call as its `targets` input."
        value: ${{ jobs.gate.outputs.targets }}

# Each job declares its own, and none is granted more than it uses.
permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      refusal: ${{ steps.gate.outputs.refusal }}
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      published-at: ${{ steps.gate.outputs.published-at }}
      fallback: ${{ steps.gate.outputs.fallback }}
      environments: ${{ steps.gate.outputs.environments }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: $/actions/kanon-path
      # First, so a malformed variable fails by name before the gate waits for CI.
      - name: Read each environment's deploy target
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: node "$KANON/scripts/deploy-gate.mjs" targets
      - name: Check the release, its branch, the declaration and CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          DISPATCH_RELEASE: ${{ github.event.inputs.release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: node "$KANON/scripts/deploy-gate.mjs" gate

  # THE TRUST PROBE: the one job here holding `id-token: write`, and no environment, no secret.
  probe:
    needs: gate
    if: needs.gate.outputs.fallback != 'no-environments'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      refusal: ${{ steps.judge.outputs.refusal }}
    steps:
      - id: kanon
        uses: $/actions/kanon-path
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Clear any earlier answer
        run: rm -f "$RUNNER_TEMP/kanon-deploy-probe.json"
      - name: Try each environment's credential from outside it
        uses: ./.github/actions/deploy
        env:
          KANON_DEPLOY_TARGETS: ${{ needs.gate.outputs.targets }}
        with:
          environment: ""
          role: ""
          release: ${{ needs.gate.outputs.tag }}
          sha: ${{ needs.gate.outputs.sha }}
          artifact: ""
          probe: "true"
          environments: ${{ needs.gate.outputs.environments }}
      # Kanon's path from the step's output, not `KANON`: the hook could rewrite `$GITHUB_ENV`.
      - name: Judge the answer
        id: judge
        env:
          KANON_PATH: ${{ steps.kanon.outputs.path }}
          ENVIRONMENTS: ${{ needs.gate.outputs.environments }}
        run: node "$KANON_PATH/scripts/deploy-gate.mjs" probe

  # THE BUILD: no credential, no id-token, no secret, no environment. After the gate and the
  # probe, or the gate alone when the probe was skipped under the `no-environments` marker.
  build:
    needs: [gate, probe]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success'
      && (needs.probe.result == 'success'
      || (needs.probe.result == 'skipped' && needs.gate.outputs.fallback == 'no-environments')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      build: ${{ steps.digest.outputs.build }}
      started-at: ${{ steps.start.outputs.at }}
      ended-at: ${{ steps.end.outputs.at }}
    steps:
      - name: Mark the job's start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: kanon
        uses: $/actions/kanon-path
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Clear the build's directory
        run: rm -rf "$RUNNER_TEMP/kanon-deploy-artifact" && mkdir -p "$RUNNER_TEMP/kanon-deploy-artifact"
      - name: Build what every environment deploys
        uses: ./.github/actions/build
        with:
          release: ${{ needs.gate.outputs.tag }}
          sha: ${{ needs.gate.outputs.sha }}
          output: ${{ runner.temp }}/kanon-deploy-artifact
      # Kanon's path from the step's output, not `KANON`: the hook could rewrite `$GITHUB_ENV`.
      - name: Digest the build
        id: digest
        env:
          KANON_PATH: ${{ steps.kanon.outputs.path }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: node "$KANON_PATH/scripts/deploy-build.mjs" digest
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: kanon-deploy-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kanon-deploy-artifact
          retention-days: 35
          include-hidden-files: true
          if-no-files-found: error
      - name: Mark the job's end
        id: end
        if: always()
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # One row for the first environment, only when the run stopped here.
  record:
    needs: [gate, probe, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      written: ${{ steps.row.outputs.written }}
      outcome: ${{ steps.row.outputs.outcome }}
      stage: ${{ steps.row.outputs.stage }}
      refusal: ${{ steps.row.outputs.refusal }}
    steps:
      - uses: $/actions/kanon-path
      - name: Write the row
        id: row
        env:
          NEEDS: ${{ toJSON(needs) }}
          ENVIRONMENTS: ${{ inputs.environments }}
          KANON_WORKFLOW_REF: ${{ job.workflow_ref }}
          KANON_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: node "$KANON/scripts/deploy-row.mjs" release
      - name: Upload the row
        if: steps.row.outputs.written == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kanon-deploy-row-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: ${{ runner.temp }}/kanon-deploy-row/kanon-deploy-row.json
          retention-days: 90
          if-no-files-found: error

  # The first environment's issue, only when the run stopped here. No checkout.
  report:
    needs: [gate, probe, build, record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: $/actions/kanon-path
      - name: File on the first environment's issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ENVIRONMENTS: ${{ inputs.environments }}
          RELEASE: ${{ needs.gate.outputs.tag || github.event.release.tag_name || github.event.inputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$KANON/scripts/deploy-report.mjs" release
