# QA pipeline — Agent 1 (the Explorer), CODE-READING mode: a scheduled deep audit. A Kanon lane
# (plan 0004, step 11).
#
# The Explorer's second modality, beside the runtime sweep (`agent-explore.yml`): it reads the
# code and the specs and files CONTRACT, CONSUMER and SECURITY bugs a runtime sweep structurally
# cannot see (RA-92, a non-constant-time compare; RA-119, declined payments never persisted). No
# browser and no database: it reads the repository. Its bugs feed the same pipeline as the
# sweep's. The playbook's "Code-reading mode" section says how.
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:` this
# file at an exact Kanon tag and maps the three secrets by name (never `secrets: inherit`).
#
# WHAT IT AUDITS IS THE PROJECT'S (plan 0004 §5, decision 6). The areas come from the stack
# document's `## Code areas` (`K-LAYOUT-17`), read from the checkout by `scripts/code-areas.mjs`:
# the `audit` areas, or the `code` trees, or the whole repository when the project declares
# none. A malformed section fails the audit job by name, before the agent.
#
# ── THE QA STORE, THROUGH THE CONTRACT (plan 0004 §3.2) ──────────────────────────────────
#
#   gate → export (store job) → audit (no credentials) → put (store job)
#                             ↘ delete-export, after the export and the audit, always
#
# The audit widens its coverage from the code-reading ledger, the store's `AREAS` rows. It used
# to query them itself with the cloud CLI, in a job that had assumed the store's role. Now the
# `export` job reads them through the adopter's store hook, as `areas.json`, and hands them to
# the audit job as an artifact kept one day, which a job of its own deletes after the audit.
# The `put` job writes the run's report through the hook. Only those two jobs hold `id-token:
# write`, which the store's role (trusting the default branch's ref) needs; the audit job
# declares no `id-token`, and no job declares an environment (P9's check,
# `tests/unit/helpers/store-jobs.ts`, and the id-token guard, `tests/unit/id-token-guard.test.ts`).
#
# WITHOUT A HOOK, it runs to completion without memory: the export holds only its manifest,
# which says the store is absent, the prompt says so, and `put` is skipped with a notice.
#
# ── THE REPORT: WRITTEN FIRST, STAMPED, RECORDED, THEN JUDGED (RA-504, RA-846) ───────────
# The agent writes `qa-audit-summary.json` on its first turn and re-writes it after each area,
# so a run cut short leaves a PARTIAL report rather than nothing. After the agent, the workflow
# stamps the measured duration, the trigger and the commit, machine-counts `lines_cited`, and
# synthesizes a `no_report` or `report_invalid` row when the agent wrote nothing usable. The
# report then goes to the `put` job as an artifact, and the audit job decides red or green
# AFTER uploading it, so the durable write happens whichever way the run goes.
#
# INERT until: the caller is on the default branch + the Author App installed, with the
# Explorer's row in the App register + these secrets (plan 0001 §8):
#   AUTHOR_APP_ID, AUTHOR_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN
# KANON ROLE: Explorer
# The line above is read by `lane-check` and the token-permission test (plan 0005 §3.5): the
# role this lane mints for, as the Author App's `AUTHOR_APP_*` secrets no longer say. Its row
# in the App register must exist, and this lane's tokens fit inside that role's row.
name: Code audit (Explorer)

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   schedule: "30 7 */3 * *"   — every ~3 days at 07:30 UTC. `*/3` is day-of-month, so the gap
#                                resets at each month boundary, which is fine for an
#                                unattended deep pass.
#   workflow_dispatch          — no inputs
# OPTIONAL SECRET: QA_STORE_BUCKET
# OPTIONAL SECRET: QA_STORE_ROLE_ARN
# The lines above are read by `lane-check` and the requirements file (kanon#433): the QA store's
# secrets, which a caller maps once its repository has a store hook, and may leave out until then.
on:
  workflow_call:
    inputs:
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # THE QA STORE'S COORDINATES (kanon#433): secrets, so the runner masks them in every log of
      # the store job, the store step's own `with:` included. Optional: a repository with no store
      # hook maps nothing, and the store is absent. The store steps below hand them to the
      # `qa-store` block as `secrets`, by name, never the whole `secrets` context.
      QA_STORE_ROLE_ARN:
        required: false
      QA_STORE_BUCKET:
        required: false

concurrency:
  # Never two audits at once: both would read the same ledger and re-read the same areas.
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: agent-code-audit${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). Each job below declares its
# own, so only the store jobs ever hold `id-token: write`, which the caller grants for them, and
# only the delete job holds `actions: write`.
permissions:
  contents: read

jobs:
  # THE MEMBERSHIP GATE (K-AGENT-45, kanon#46), in a job of its own, before any token is minted
  # or the store is read. On the schedule the actor is whoever last changed the cron; on a
  # dispatch, whoever ran it.
  #
  # ONLY THE CALLER'S TWO TRIGGERS. As a called workflow it runs on whatever its caller is
  # called on (Kanon's smoke calls it on pull requests), so every other event starts nothing.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      member: ${{ steps.gate.outputs.member }}
    steps:
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

  # THE STORE JOB THAT READS (plan 0004 §3.2): the code-reading ledger through the adopter's
  # store hook, and nothing else. A failed read is `degraded`, and the export says so; without a
  # hook it says the store is absent.
  export:
    needs: gate
    if: needs.gate.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.store.outputs.artifact-name }}
      artifact-id: ${{ steps.store.outputs.artifact-id }}
      attempt: ${{ steps.store.outputs.attempt }}
    steps:
      - uses: $/actions/qa-store
        id: store
        with:
          operation: export
          variables: ${{ toJSON(vars) }}
          secrets: ${{ format('{{"QA_STORE_ROLE_ARN":{0},"QA_STORE_BUCKET":{1}}}', toJSON(secrets.QA_STORE_ROLE_ARN), toJSON(secrets.QA_STORE_BUCKET)) }}
          kind: audit

  # THE LANE'S RUN, AS A CALLED WORKFLOW (kanon#279, `K-AGENT-49`). `code-audit-run.yml` mints the
  # token in a job that holds the key and runs nothing else, then hands it to the agent's job
  # (`code-audit-agent-job.yml`). Both sit inside this job's scope, so the mint waits
  # with the agent: a token minted before the wait could expire under it.
  audit:
    needs: export
    if: needs.export.outputs.attempt == github.run_attempt
    # NO `id-token` AND NO ENVIRONMENT: this job holds no cloud credentials (plan 0004 P9). The
    # reads are the quality step's and the telemetry step's, with the workflow token: the issues
    # this run filed, and its own start time (`gh run view`).
    permissions:
      contents: read
      issues: read
      actions: read
    uses: $/.github/workflows/code-audit-run.yml
    with:
      artifact-name: ${{ needs.export.outputs.artifact-name }}
    secrets:
      app-id: ${{ secrets.AUTHOR_APP_ID }}
      app-private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  put:
    needs: audit
    # The audit job ran, red or green: never when it was skipped (a refusal, or a partial re-run)
    # or cancelled.
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qa-audit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
      - uses: $/actions/qa-store
        with:
          operation: put
          variables: ${{ toJSON(vars) }}
          secrets: ${{ format('{{"QA_STORE_ROLE_ARN":{0},"QA_STORE_BUCKET":{1}}}', toJSON(secrets.QA_STORE_ROLE_ARN), toJSON(secrets.QA_STORE_BUCKET)) }}
          kind: audit
          report: ${{ runner.temp }}/report/qa-audit-summary.json

  # THE EXPORT'S DELETE JOB (plan 0004 §3.2): the ledger is the adopter's QA data, which anyone
  # who can read the repository could download while the artifact exists. After the audit,
  # whatever happened to it; a delete that fails turns the run red.
  delete-export:
    needs: [export, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: $/actions/qa-store
        with:
          operation: delete-export
          artifact-id: ${{ needs.export.outputs.artifact-id }}
          export-attempt: ${{ needs.export.outputs.attempt }}
          agent-result: ${{ needs.audit.result }}
