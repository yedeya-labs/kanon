# Checks each of Kanon's Apps in the register against its installation (#39, K-AGENT-5).
#
# The register (docs/qa/agent-identities.md, K-LAYOUT-6) is a claim, and a person's token
# can't list an organisation's installations. Each App can read its own, so for each of the
# Author, the Judge and the Releaser the register lists (plan 0005 §3.4: one row per role, an
# App's roles sharing its slug), this mints that App's token and checks, with
# cli/apps-check.mjs: its roles name one slug, the minted slug is that one, the installation
# covers this repository (a warning when it covers all of its owner's), and its permissions
# are exactly the App's in rulebook/agent-permissions.json. Each App's job writes a summary.
#
# Run by hand, after creating or changing an App; it is not a required check. Kanon runs it
# on itself:
#   gh workflow run apps-check.yml -R yedeya-labs/kanon
# and an adopter calls it from a thin caller of its own, pinned to an exact version
# (K-ADOPT-11, kanon#154; docs/apps.md gives the caller), then runs that by hand.
#
# THE SCRIPT IS KANON'S, THE REGISTER IS THE REPOSITORY'S. `kanon-path` puts the Kanon tree
# this workflow came from (the caller's pinned tag) on the runner, with Kanon's Node, so the
# check and the role permissions it compares against are the pinned version's. Only the
# register job checks out the repository, for its register.
#
# Permissions: nothing at the top. Reading the register needs `contents: read` on that one
# job. The check jobs grant nothing: the App token carries its own permissions. Each job
# evaluates only the two secrets of its own App, picked by the App's key, so no job reads
# another App's key, and none inherits secrets. Each secret is named literally, never by a
# computed name, so `kanon doctor` sees exactly which secrets this workflow reads and
# can list any other App secret as stale (#440): a new App adds its line to each of the four. Called, it takes each App's two secrets by their fixed names (plan 0005 §3.5),
# all optional: a caller maps the Apps its register lists, and an App the register lists
# whose secrets are not mapped fails at the mint.
name: apps-check

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AUTHOR_APP_ID:
        required: false
      AUTHOR_APP_PRIVATE_KEY:
        required: false
      JUDGE_APP_ID:
        required: false
      JUDGE_APP_PRIVATE_KEY:
        required: false
      RELEASER_APP_ID:
        required: false
      RELEASER_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  register:
    name: Read the App register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/kanon-path
      - id: apps
        run: node "$KANON/cli/apps-check.mjs" apps >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.app.app }}
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.register.outputs.apps) }}
    steps:
      # Scoped to the owner, not the repository, so an installation that misses this
      # repository still mints, and the check below can say so.
      - name: Mint the App's token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ matrix.app.key == 'author' && secrets.AUTHOR_APP_ID || matrix.app.key == 'judge' && secrets.JUDGE_APP_ID || matrix.app.key == 'releaser' && secrets.RELEASER_APP_ID || '' }}
          private-key: ${{ matrix.app.key == 'author' && secrets.AUTHOR_APP_PRIVATE_KEY || matrix.app.key == 'judge' && secrets.JUDGE_APP_PRIVATE_KEY || matrix.app.key == 'releaser' && secrets.RELEASER_APP_PRIVATE_KEY || '' }}
          owner: ${{ github.repository_owner }}
      - uses: $/actions/kanon-path
      - name: Check the installation
        env:
          APP: ${{ matrix.app.key }}
          ROLES: ${{ join(matrix.app.roles, ',') }}
          REGISTER_SLUG: ${{ matrix.app.slug }}
          REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ matrix.app.key == 'author' && secrets.AUTHOR_APP_ID || matrix.app.key == 'judge' && secrets.JUDGE_APP_ID || matrix.app.key == 'releaser' && secrets.RELEASER_APP_ID || '' }}
          APP_PRIVATE_KEY: ${{ matrix.app.key == 'author' && secrets.AUTHOR_APP_PRIVATE_KEY || matrix.app.key == 'judge' && secrets.JUDGE_APP_PRIVATE_KEY || matrix.app.key == 'releaser' && secrets.RELEASER_APP_PRIVATE_KEY || '' }}
        run: node "$KANON/cli/apps-check.mjs" check
