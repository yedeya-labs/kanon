# Checks every agent App in the register against its installation (#39, K-AGENT-5).
#
# The register (docs/qa/agent-identities.md, K-LAYOUT-6) is a claim, and a person's token
# can't list an organisation's installations. Each App can read its own, so for every role
# the register lists, this mints that role's token and checks, with cli/apps-check.mjs:
# the minted slug is the register's, the installation covers this repository (a warning
# when it covers others, or all), and its permissions are exactly the role's in
# rulebook/agent-permissions.json. Each role's job writes a summary table.
#
# Run by hand, after creating or changing an App; it is not a required check. Kanon runs it
# on itself:
#   gh workflow run apps-check.yml -R yedeya-labs/kanon
# and an adopter calls it from a thin caller of its own, pinned to an exact version
# (K-ADOPT-11, kanon#154; docs/apps.md gives the caller), then runs that by hand.
#
# THE SCRIPT IS KANON'S, THE REGISTER IS THE REPOSITORY'S. `kanon-path` puts the Kanon tree
# this workflow came from (the caller's pinned tag) on the runner, with Kanon's Node, so the
# check and the role permissions it compares against are the pinned version's. Only the
# register job checks out the repository, for its register.
#
# Permissions: nothing at the top. Reading the register needs `contents: read` on that one
# job. The check jobs grant nothing: the App token carries its own permissions. Each job
# names the two secrets of its own role, looked up by the register's role, so no job reads
# another role's key and none inherits secrets. Called, it takes each role's two secrets by
# their fixed names, all optional: a caller maps the roles its register lists, and a role
# the register lists whose secrets are not mapped fails at the mint.
name: apps-check

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      EXPLORER_APP_ID:
        required: false
      EXPLORER_APP_PRIVATE_KEY:
        required: false
      IMPLEMENTER_APP_ID:
        required: false
      IMPLEMENTER_APP_PRIVATE_KEY:
        required: false
      REVIEWER_APP_ID:
        required: false
      REVIEWER_APP_PRIVATE_KEY:
        required: false
      MERGER_APP_ID:
        required: false
      MERGER_APP_PRIVATE_KEY:
        required: false
      LEAD_APP_ID:
        required: false
      LEAD_APP_PRIVATE_KEY:
        required: false
      OVERSEER_APP_ID:
        required: false
      OVERSEER_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  register:
    name: Read the App register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      roles: ${{ steps.roles.outputs.roles }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/actions/kanon-path
      - id: roles
        run: node "$KANON/cli/apps-check.mjs" roles >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.app.role }}
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.register.outputs.roles) }}
    steps:
      # Scoped to the owner, not the repository, so an installation that misses this
      # repository still mints, and the check below can say so.
      - name: Mint the role's App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets[format('{0}_APP_ID', matrix.app.secret)] }}
          private-key: ${{ secrets[format('{0}_APP_PRIVATE_KEY', matrix.app.secret)] }}
          owner: ${{ github.repository_owner }}
      - uses: $/actions/kanon-path
      - name: Check the installation
        env:
          ROLE: ${{ matrix.app.key }}
          REGISTER_SLUG: ${{ matrix.app.slug }}
          REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ secrets[format('{0}_APP_ID', matrix.app.secret)] }}
          APP_PRIVATE_KEY: ${{ secrets[format('{0}_APP_PRIVATE_KEY', matrix.app.secret)] }}
        run: node "$KANON/cli/apps-check.mjs" check
