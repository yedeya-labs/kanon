# Kanon resolves a merge conflict on the Implementer's own pull request (kanon#448).
#
# A trigger-only caller of Kanon's rebase lane, written by `kanon init` exactly as an adopter's
# is (docs/lanes.md). It is named `rebase.yml` because `agent-rebase.yml` is the lane itself
# (K-LAYOUT-18's exception for Kanon's own tree, as for review.yml and implement.yml), which the
# adoption record waives by name.
#
# IT CALLS KANON'S LAST RELEASE, NEVER `$/` (ADR 0011's bootstrap), like implement.yml: through
# `$/`, a branch could change the lane that resolves its own conflict.
#
# WHY KANON RUNS IT. The `kanon/role: implementer` status is bound to the head the Implementer's
# run pushed (#324), and the revise lane and the Merger require it. A person's rebase or merge
# gives the pull request a head without it, so the pull request leaves the Implementer's chain
# and is a person's to finish (#438). This lane resolves the conflict as the Author App, by a
# merge commit, and a fixed job after its agent's carries the status to the head it pushed.
#
# WHEN IT RUNS ON KANON: AFTER EVERY MERGE. Kanon merges through a merge queue, and the CI run on
# the queue's push names `github-merge-queue[bot]`, which the lane's gate turns away (#79). So the
# lane also starts on a merged pull request (`pull_request_target` closed on `main`, kanon#484,
# #512), judged by the member who queued it (`merged_by`); it reads nothing of that pull request.
# The cron is a sporadic floor (#397). A conflict on an Implementer pull request can still be
# resolved at once by dispatching the lane for it (`gh workflow run rebase.yml -R
# yedeya-labs/kanon -f pr_number=N`), never by rebasing it by hand, which takes the pull request
# out of the Implementer's chain.
#
# The secrets: as implement.yml, mapped by name, never inherited.
name: Rebase (Implementer)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A merged pull request: through a merge queue, the CI run on a merge is the queue's, which
  # the lane's gate turns away. The lane reads nothing of the pull request (docs/lanes.md).
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "A single PR to consider (blank = every open PR)"
        required: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  rebase:
    uses: yedeya-labs/kanon/.github/workflows/agent-rebase.yml@v0.37.0
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
