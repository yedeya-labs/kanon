# Calls Kanon's lane workflows, and runs `lane-check` on a fixture adopter, with no model call
# (plan 0001 §4, steps 2 and 3).
#
# WHAT IT PROVES. GitHub resolves and validates every reusable workflow a run calls before it
# starts a job: each lane through `$/`, the spine each lane calls through `$/`, the inputs
# and secrets each call passes against what the called file declares, and the permissions
# each called file asks for against what its caller grants. A mistake in any of those fails
# this run at startup. `$/` resolves to this repository at the running commit, so every PR
# validates its own lanes.
#
# WHAT IT CANNOT PROVE. A lane's agent job mints an App token and calls the model, and a
# smoke run has no App and must not spend anything. So each lane is called with events that
# its own admission rules turn away: on pull_request, merge_group and push no lane admits
# the event, and the implement-revise filter, which runs on everything but a label event,
# is refused by its membership gate (no lane acts on these events) before any API call. The merge-reconcile filter admits only a merged pull
# request, and the implement lane's crash recovery runs only after its agent job failed. The
# review lane's filter starts only on a CI completion, a review label or a dispatch, and
# refuses any other pull_request event at its membership gate; verify-acs starts only on
# `qa:verify` or a dispatch. The brief lane starts only on a dispatch, the split lane only
# on `qa:needs-split` or a dispatch, and the rebase lane only on a CI completion, its
# schedule or a dispatch. The Merger starts only on a review, a CI completion, its schedule
# or a dispatch, and the reconciler only on its schedule, a closed issue or pull request, or a
# dispatch. The two digests, the dispatch sweep, the code audit and the Overseer start only on
# their schedule or a dispatch, and so does the Explorer's sweep. The jobs that would
# mint and run are skipped. The model
# call is proven by the reference adopter's live run after each upgrade.
#
# The secrets are mapped by their fixed names to a secret that does not exist: nothing that
# reads them runs. Every lane input is optional, and these events have none, so the one input
# passed is `smoke`.
#
# WHY `smoke`. Each lane holds a concurrency group that serialises its real runs, and many are
# one group for the whole repository (`agent-code-audit`, `agent-explore`, ...). GitHub keeps
# one pending run per group, and a newer one cancels it. Without `smoke`, this workflow's calls
# joined the same groups as the lanes' real runs, from the lane callers on the default
# branch: a smoke run waited behind a real one, the next PR's smoke replaced it in the queue,
# and the cancelled lane turned this check red (seen on `code-audit`). Per-PR groups were
# shared too: a smoke run on PR 7 joined the real review or merge group of PR 7. With `smoke`
# each lane appends `-smoke-<run id>` to its group, so a smoke run shares a group with no
# other run, and a real run's group is the same as it was.
#
# On merge_group (K-MERGE-7) it runs the same jobs under the same job name, so it can be a
# required check without stalling the queue. It reads nothing from the pull request.
name: Agent lanes smoke

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
    uses: $/.github/workflows/agent-triage.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  implement-revise:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: read
    uses: $/.github/workflows/agent-implement-revise.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  implement:
    # The ceiling covers the crash recovery's job-level grants, which GitHub checks against
    # this job's grant before the run starts, although the job never runs here.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: $/.github/workflows/agent-implement.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  merge-reconcile:
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/agent-merge-reconcile.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      JUDGE_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  lead-revise:
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: $/.github/workflows/agent-lead-revise.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  review:
    permissions:
      contents: read
      pull-requests: write
      actions: read
      issues: read
    uses: $/.github/workflows/agent-review.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      JUDGE_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  verify-acs:
    permissions:
      contents: read
      issues: read
    uses: $/.github/workflows/agent-verify-acs.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  lead:
    permissions:
      contents: read
    uses: $/.github/workflows/agent-lead.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  lead-split:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: $/.github/workflows/agent-lead-split.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  rebase:
    # The ceiling covers the filter's job-level grants, as for the implement lane.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    uses: $/.github/workflows/agent-rebase.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  merge:
    # The Merger runs no model, so it takes no Claude token (plan 0004 step 7).
    permissions:
      contents: read
    uses: $/.github/workflows/agent-merge.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      JUDGE_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}

  lead-reconcile:
    # The reconciler runs no model either (plan 0004 step 8).
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: $/.github/workflows/agent-lead-reconcile.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}

  project-digest:
    # The digests run as no App: the Claude token, and the webhook they post to (plan 0004
    # step 10).
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: $/.github/workflows/agent-project-digest.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}
      DIGEST_WEBHOOK: ${{ secrets.KANON_SMOKE_UNSET }}

  weekly-digest:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: $/.github/workflows/agent-weekly-digest.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}
      DIGEST_WEBHOOK: ${{ secrets.KANON_SMOKE_UNSET }}

  explore:
    # A store-coupled lane (plan 0004 step 12). `id-token: write` is for its store jobs alone:
    # GitHub refuses to start a called job that asks for more than its caller grants.
    permissions:
      contents: read
      issues: read
      actions: read
      id-token: write
    uses: $/.github/workflows/agent-explore.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  dispatch-sweep:
    # No model either (plan 0004 step 9). `id-token: write` is for the lane's store job alone:
    # GitHub refuses to start a called job that asks for more than its caller grants.
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/agent-dispatch-sweep.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}

  code-audit:
    # A store-coupled lane (plan 0004 step 11). `id-token: write` is for its store jobs alone,
    # and `actions: write` for the export's delete job alone: GitHub refuses to start a called
    # job that asks for more than its caller grants.
    permissions:
      contents: read
      issues: read
      actions: write
      id-token: write
    uses: $/.github/workflows/agent-code-audit.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  overseer:
    # A store-coupled lane (plan 0004 step 13). `id-token: write` is for its store job alone,
    # and `actions: write` for the export's delete job alone: GitHub refuses to start a called
    # job that asks for more than its caller grants.
    permissions:
      contents: read
      issues: read
      actions: write
      id-token: write
    uses: $/.github/workflows/agent-overseer.yml
    with:
      smoke: agent-lanes-smoke
    secrets:
      AUTHOR_APP_ID: ${{ secrets.KANON_SMOKE_UNSET }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.KANON_SMOKE_UNSET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.KANON_SMOKE_UNSET }}

  smoke:
    name: Agent lanes smoke
    needs: [triage, implement, implement-revise, lead-revise, merge-reconcile, review, verify-acs, lead, lead-split, rebase, merge, lead-reconcile, project-digest, weekly-digest, explore, dispatch-sweep, code-audit, overseer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check every lane resolved, and turned the event away without failing
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | length == 18 and all(.value.result == "success" or .value.result == "skipped")'

      # For the fixture adopter only. lane-check itself comes from `$/`.
      - uses: actions/checkout@v7

      # THE MEMBERSHIP GATE'S ONE LIVE CALL (kanon#46). No lane above reaches its gate with a
      # label event, so this runs the gate on one: a label applied by `octocat`, who is not
      # a collaborator. It proves the permission lookup works with the workflow token and
      # this workflow's `contents: read` (the endpoint needs only Metadata read, which
      # every workflow token holds), and that a refusal is a clean `member=false`.
      - uses: $/actions/kanon-path
      - name: Check the membership gate refuses a non-member's label, with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '{"action":"labeled","sender":{"login":"octocat"}}' > "$RUNNER_TEMP/gate-event.json"
          : > "$RUNNER_TEMP/gate-output"
          GITHUB_EVENT_NAME=issues GITHUB_EVENT_PATH="$RUNNER_TEMP/gate-event.json" \
            GITHUB_OUTPUT="$RUNNER_TEMP/gate-output" GITHUB_STEP_SUMMARY="$RUNNER_TEMP/gate-summary" \
            node "$KANON/scripts/lane-gate.mjs"
          cat "$RUNNER_TEMP/gate-summary"
          grep -qx 'member=false' "$RUNNER_TEMP/gate-output"

      # lane-check reads the repository it runs in, so the fixture adopter replaces this
      # checkout's `.github/` and `docs/` in the runner's workspace (never in the repository).
      - name: Lay the fixture adopter over the workspace
        run: |
          rm -rf .github docs
          cp -R tests/fixtures/lane-check/adopter/. .

      - name: Check the fixture adopter's lane callers
        uses: $/actions/lane-check
