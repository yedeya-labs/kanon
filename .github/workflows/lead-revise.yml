# The caller of Kanon's agent-lead-revise lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Lead (Lead) — revise

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Brief PR to revise"
        required: true
      reset:
        description: "Clear the round cap for this run. Use when the developer has ANSWERED the brief's open decisions — that is a new mandate, not a third iteration of a disagreement. Authorises exactly one revision."
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  revise:
    uses: yedeya-labs/kanon/.github/workflows/agent-lead-revise.yml@v0.40.2
    with:
      pr_number: ${{ inputs.pr_number }}
      reset: ${{ inputs.reset }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
