# QA pipeline — Agent 1 (the Explorer), TELEMETRY mode: a weekly read of the hosted telemetry's
# aggregate. A Kanon lane (plan 0004, step 14; decision 13).
#
# The Explorer's third modality, beside the runtime sweep (`agent-explore.yml`) and the code audit
# (`agent-code-audit.yml`): it reads what Kanon's aggregate function answers, and nothing else, and
# looks for anomalies the fixed rules of kanon#41 would miss: a failure the same Kanon version
# causes at several adopters, a stage that has started failing, a cost that moved. It files what
# it finds under the Explorer's filing gate (`K-AGENT-9`), and "nothing to file" is a good run.
#
# WHAT IT READS IS THE AGGREGATE, NEVER A ROW (plan 0002 §6.1). The function answers three things:
# `cross_adopter` cells, each combining at least three adopters that did not declare their own
# figures; `own` cells, the figures of each adopter that declared them publishable, under the
# label it chose; and `signals`, the last week's failures by lane, reason, stage, Kanon error and
# Kanon version, with how many adopters each affected and no cost or run count. No key, no
# repository, no run. Anything else in its answer refuses the whole read.
#
# ANY REPOSITORY WHOSE TELEMETRY REGISTER ENTRY SETS `aggregate_invoker` CAN INSTALL IT
# (docs/telemetry.md). That creates the role `kanon-telemetry-<key>-aggregates`, trusted for the
# repository's default-branch ref, which may call the function's URL and nothing else. The lane
# reads the URL from the repository variable `KANON_AGGREGATE_URL` (the stack's `AggregateUrl`
# output) and the role's ARN from the secret `KANON_AGGREGATE_ROLE` (its `AggregateInvokerRole<id>`
# output), which the caller maps by name (the Owner's decision on kanon#471). Without both, it
# says so and stops after the gate, green: an adopter who hasn't asked for a role has nothing to
# call.
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:` this
# file at an exact Kanon tag and maps the four secrets by name (never `secrets: inherit`).
#
# ── WHO HOLDS WHAT ───────────────────────────────────────────────────────────────────────
#
#   gate → aggregate (id-token, the invoker role) → explore (the agent, reads only) → file or draft
#
# - `aggregate` IS THE ONLY JOB WITH `id-token: write`. It assumes the invoker role through
#   GitHub's OIDC token, calls the function's URL with a SigV4-signed `GET`
#   (`scripts/aggregate-read.mjs`), checks the answer, and uploads it as an artifact kept one
#   day. Its steps are exactly Kanon's path, the masking step, the credentials, the read and
#   the upload: the id-token guard (`tests/unit/helpers/store-jobs.ts`) allows it by that shape,
#   as it allows the QA store's jobs and the telemetry collector, and nothing else of this file.
#   It declares no environment, which would replace the ref in its token's subject.
# - `explore` RUNS THE AGENT, WITH NO CLOUD CREDENTIALS. Its agent job declares no `id-token`
#   (plan 0004 P9's check) and downloads the aggregate into the workspace. Its token is the
#   Explorer's, narrowed to read the tree and issues: it files nothing. It writes its findings to
#   `qa-telemetry-findings.json`, which the job uploads.
# - `file` FILES, WITH NO AGENT. On a fresh runner that checks out nothing, it downloads the
#   aggregate and the findings, mints the Explorer's filing token, and runs
#   `scripts/telemetry-file.mjs`: each finding must rest on entries of the aggregate, by their
#   identifying fields; its prose may quote no figure, and nothing shaped like an adopter key;
#   the step renders the figures itself, from the aggregate. A finding that fails is refused by
#   name. So a steered agent can change what it says, never which figures an issue quotes.
#
# WHERE ITS FINDINGS GO (the Owner's decision on kanon#471, as the Overseer's do: plan 0004
# decision 12, kanon#426). Every finding is about Kanon's lanes, so it goes by the adoption
# record's `Upstream findings:` choice under `## Choices` (`K-LAYOUT-10`), which the `gate` job
# reads from the default branch before any agent runs and hands to the `file` job. `filed here`
# files each finding in this repository; anything else, the default, is `drafted`: the checked
# finding, rendered exactly as it would be filed, goes into the run's summary, and nothing is
# filed or minted. Nothing is ever filed in another repository.
#
# WHAT THE LOG SHOWS (kanon#433). The role's ARN holds the AWS account id, and a public
# repository's run logs are public, so it is a secret, which GitHub masks wherever it appears.
# The URL is no credential and stays a variable, the only one the lane reads, never
# `toJSON(vars)`. The `aggregate` job's masking step registers the URL, and the account id inside
# the ARN, as masks before any other step names them, so the read's `env:` prints `***`. What
# still prints is the URL, once per run, in the masking step's own `env:`, which is printed before
# the step can mask anything.
#
# The schedule is a suggestion; the aggregate's signals cover the last 7 days (`signal_days`), so
# a weekly run sees each failure once.
#
# INERT until: the caller is on the default branch, the Explorer's App installed with a row in
# the App register, `KANON_AGGREGATE_URL` set, and these secrets (plan 0001 §8):
#   AUTHOR_APP_ID, AUTHOR_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN, KANON_AGGREGATE_ROLE
# KANON ROLE: Explorer
# The line above is read by `lane-check` and the token-permission test (plan 0005 §3.5): the
# role this lane mints for, as the Author App's `AUTHOR_APP_*` secrets no longer say. Its row
# in the App register must exist, and this lane's tokens fit inside that role's row.
name: Explore the telemetry (Explorer)

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   schedule: "30 6 * * 2"     — weekly, Tuesday 06:30 UTC
#   workflow_dispatch          — no inputs; from the default branch, as the invoker role trusts
on:
  workflow_call:
    inputs:
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # The aggregate invoker role's ARN (the stack's `AggregateInvokerRole<id>` output). Not
      # required: a repository without a role maps it to a secret it doesn't have, and the lane
      # says so and stops after its gate.
      KANON_AGGREGATE_ROLE:
        required: false

concurrency:
  # Never two at once: both would file from the same aggregate.
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: agent-explore-telemetry${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). Each job below declares its
# own, so only the `aggregate` job ever holds `id-token: write`, which the caller grants for it.
permissions:
  contents: read

jobs:
  # THE MEMBERSHIP GATE (K-AGENT-45, kanon#46), in a job of its own, before any token is minted
  # or the function is called. ONLY THE CALLER'S TWO TRIGGERS: as a called workflow it runs on
  # whatever its caller is called on (Kanon's smoke calls it on pull requests).
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      member: ${{ steps.gate.outputs.member }}
      configured: ${{ steps.configured.outputs.configured }}
      upstream: ${{ steps.upstream.outputs.upstream }}
    steps:
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"
      # IS THERE A FUNCTION TO CALL? A job's `if:` can't read a secret, so this step says whether
      # both the URL and the role are set, and prints neither.
      - name: Is the aggregate function configured?
        id: configured
        if: steps.gate.outputs.member == 'true'
        env:
          URL: ${{ vars.KANON_AGGREGATE_URL }}
          ROLE: ${{ secrets.KANON_AGGREGATE_ROLE }}
        run: |
          if [ -n "$URL" ] && [ -n "$ROLE" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      # WHERE FINDINGS GO (`K-LAYOUT-10`, kanon#426): the adoption record's `Upstream findings:`
      # choice, read from the default branch (`K-MERGE-17`) here, before any agent runs, and
      # handed to the `file` job as this job's output, which the agent's job can't write. A
      # malformed record stops the run here, by name, before anything is spent.
      - name: Where do findings go?
        id: upstream
        if: steps.configured.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream="$(node "$KANON/scripts/upstream-findings.mjs")"
          printf 'upstream=%s\n' "$upstream" >> "$GITHUB_OUTPUT"

  # NOTHING TO CALL: the repository has no aggregate URL or invoker role, or a dispatch ran from
  # another branch, whose ref the role doesn't trust. Said, and green.
  unconfigured:
    needs: gate
    if: >-
      needs.gate.outputs.member == 'true'
      && (needs.gate.outputs.configured != 'true'
        || (github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say why the aggregate isn't read
        run: |
          echo "::notice title=explore-telemetry::The aggregate is not read: the KANON_AGGREGATE_URL variable or the KANON_AGGREGATE_ROLE secret is not set, or this dispatch ran from a branch other than the default, which the invoker role does not trust. See docs/telemetry.md (The aggregate function)."
          echo "Telemetry Explorer **skipped**: the aggregate function's URL or invoker role is not set, or the run is not on the default branch." >> "$GITHUB_STEP_SUMMARY"

  # THE ONE JOB THAT HOLDS `id-token: write` (see the header). Its steps are fixed: the id-token
  # guard allows this job by its exact shape, so a step added here turns the guard red.
  aggregate:
    needs: gate
    if: >-
      needs.gate.outputs.member == 'true'
      && needs.gate.outputs.configured == 'true'
      && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    outputs:
      empty: ${{ steps.read.outputs.empty }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      # The attempt that uploaded the aggregate. A partial re-run reuses this job's outputs.
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: $/actions/kanon-path
      # MASKED FIRST (kanon#433): every later step's header then prints `***` for the URL and the
      # account id. The role's ARN is a secret, masked already. This step's own `env:` is printed
      # before it runs, so the URL appears here, once.
      - name: Mask the aggregate function's URL and the account id
        env:
          URL: ${{ vars.KANON_AGGREGATE_URL }}
          ROLE: ${{ secrets.KANON_AGGREGATE_ROLE }}
        run: node "$KANON/scripts/aggregate-mask.mjs"
      # The STS call goes to Frankfurt, where the hosted store lives: the account's region policy
      # denies every other region.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.KANON_AGGREGATE_ROLE }}
          aws-region: eu-central-1
          role-session-name: kanon-explore-telemetry
      - name: Read the aggregate
        id: read
        env:
          KANON_AGGREGATE_URL: ${{ vars.KANON_AGGREGATE_URL }}
          OUT: ${{ runner.temp }}/aggregate
        run: node "$KANON/scripts/aggregate-read.mjs"
      # One day: the agent's job and the filing job read it within the run.
      - name: Upload the aggregate for the agent and the filing step
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: kanon-telemetry-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate/aggregate.json
          retention-days: 1
          if-no-files-found: error

  # THE LANE'S RUN, AS A CALLED WORKFLOW (kanon#279, `K-AGENT-49`). `explore-telemetry-run.yml`
  # mints the token in a job that holds the key and runs nothing else, then hands it to the
  # agent's job (`explore-telemetry-agent-job.yml`). Only when there is something to look at:
  # an aggregate with no cell and no signal spends no model run.
  explore:
    needs: aggregate
    if: needs.aggregate.outputs.empty == 'false' && needs.aggregate.outputs.attempt == github.run_attempt
    # NO `id-token` AND NO ENVIRONMENT: this job holds no cloud credentials (plan 0004 P9). The
    # reads are the finish block's, with the workflow token: its own run, and issues.
    permissions:
      contents: read
      issues: read
      actions: read
    uses: $/.github/workflows/explore-telemetry-run.yml
    with:
      artifact-name: kanon-telemetry-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      app-id: ${{ secrets.AUTHOR_APP_ID }}
      app-private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  file:
    needs: [gate, aggregate, explore]
    # AN EXPLICIT STATUS FUNCTION AND THE PARENT'S RESULT (kanon#261): the explore job is green
    # whatever the agent concluded, because the agent step continues on error.
    if: ${{ !cancelled() && needs.explore.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing on the workflow token: the downloads read this run's artifacts with the runner's
    # own token, and every write is the filing App token's.
    permissions: {}
    steps:
      # A PARTIAL RE-RUN (kanon#286): "Re-run failed jobs" after a failed `file` re-runs this job
      # but not the explore job, whose report is an earlier attempt's.
      - name: Refuse a report from an earlier attempt
        env:
          REPORT_ATTEMPT: ${{ needs.explore.outputs.report-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$REPORT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error title=explore-telemetry::this is attempt $RUN_ATTEMPT, but the agent's report is from attempt ${REPORT_ATTEMPT:-unknown}. Nothing was filed on this attempt. Use \"Re-run all jobs\", not \"Re-run failed jobs\": only a new run reads a new aggregate."
            exit 1
          fi

      - uses: $/actions/kanon-path
        id: kanon

      # THE SAME AGGREGATE THE AGENT READ, from the read job's artifact: the agent's job can't
      # write it, so the check below judges the findings against what the function answered.
      - name: Download the aggregate
        uses: actions/download-artifact@v8
        with:
          name: kanon-telemetry-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate

      - name: Download the agent's findings
        if: needs.explore.outputs.report-artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          name: qa-telemetry-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report

      # THE FILING TOKEN, minted in this job, which runs no agent, and only when the repository
      # files its findings itself: a draft needs none.
      - name: Mint the Explorer's filing token
        id: file-token
        if: needs.gate.outputs.upstream == 'filed here'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
          permission-issues: write

      # THE CHECK, AND THE FILING OR THE DRAFTS (see the header). No report, or an unparseable
      # one, files nothing and reds the job: the run was lost. A refused finding reds it too,
      # after the others are filed or drafted.
      - name: Check the findings against the aggregate, and file or draft them
        env:
          GH_TOKEN: ${{ steps.file-token.outputs.token }}
          AGENT_OUTCOME: ${{ needs.explore.outputs.agent-outcome }}
          REPORT_PATH: ${{ runner.temp }}/report/qa-telemetry-findings.json
          AGGREGATE_PATH: ${{ runner.temp }}/aggregate/aggregate.json
          KANON: ${{ steps.kanon.outputs.path }}
          # The gate job's reading of the record, never anything the agent wrote.
          UPSTREAM: ${{ needs.gate.outputs.upstream }}
        run: node "$KANON/scripts/telemetry-file.mjs"
