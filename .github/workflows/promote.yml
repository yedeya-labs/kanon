# The promotion (plan 0009 §3, step S5): Kanon's newest candidate, `candidate-vX.Y.Z`, becomes the
# stable release `vX.Y.Z` on the same commit once its gates pass. Kanon's own operation, not a lane
# and not part of the reusable release workflow: adopters' releases are untouched.
#
# Daily at 06:00 UTC (Owner decision 2: candidates are cut on Monday, so after the 72-hour soak
# the earliest promotion is Thursday's run), and on dispatch:
#   - `hold`: read and report the gates, promote nothing. The Owner holds a candidate this way,
#     or by disabling the workflow (Owner decision 3);
#   - `urgent` with a `reason` (plan 0009 §7): skips the soak and the six-day spacing, asks that a
#     review run at the candidate succeeded, and writes the reason into the stable Release's
#     notes. `urgent` without a reason is refused.
# No input overrides a gate: `urgent` doesn't skip the end-to-end gate, the fifth (plan 0012
# §8.2, decision 12), whose evidence in the summary names the Reporter's `kanon-e2e` check run
# and the harness's red issue whenever it holds a candidate.
#
# `scripts/promote.mjs check` reads the gates with this job's read-only token and writes each
# one's verdict and evidence to the step summary, so a held promotion says which gate held it.
# Only when it decides to promote is the Releaser's token minted, narrowed to Contents write, and
# `scripts/promote.mjs apply` creates the tag on the candidate's commit, publishes its Release as
# latest and moves `v0`, as the Releaser: the one bypass actor of the `v*` tag ruleset (plan 0008
# J6), as release.yml creates release tags and moves the major tag with the same App (#782).
# Then, when the release is the latest, it opens `docs: point the docs at vX.Y.Z` as the Releaser:
# the README's install command and the docs' `uses:` lines follow the stable channel, which only
# this workflow moves (`scripts/doc-pins.mjs`; CI's check fails a reference to an untagged release).
#
# Last, `scripts/promote.mjs notify` tells the Owner of a held promotion (#1441): a candidate past
# its soak that a gate holds gets one issue, `Promotion held: <candidate>`, assigned to whoever
# merged its pin pull request, rewritten by each run, commented on only when the gates holding it
# change, and closed once the candidate is promoted. A hold reports as a green run, so without it
# a held candidate reached nobody (0.42.0 waited a week).
#
# The default branch only: the lane callers whose pins and runs the gates read are the default
# branch's.
name: Promote

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      hold:
        description: Read and report the gates, and promote nothing
        type: boolean
        default: false
      urgent:
        description: Skip the soak and the six-day spacing (plan 0009 §7); needs a reason
        type: boolean
        default: false
      reason:
        description: Why the promotion is urgent; goes into the stable Release's notes
        type: string
        default: ""

permissions: {}

concurrency:
  group: kanon-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the newest candidate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads only: the tags, the candidate's package.json and Release (`contents`), the pull
    # requests it contains and the pin pull request (`pull-requests`), the open bugs (`issues`),
    # the lane callers' runs and jobs (`actions`) and their failed jobs' annotations (`checks`),
    # and the Reporter's `kanon-e2e` check runs on the candidate's commit (`checks`). The harness
    # run a check run links is in a public repository, read with the same token.
    # `issues: write` is the held issue's alone (the notify step); the check reads issues with it.
    # The promotion's writes use the Releaser's token, minted below.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HOLD: ${{ inputs.hold }}
          URGENT: ${{ inputs.urgent }}
          REASON: ${{ inputs.reason }}
          PLAN: ${{ runner.temp }}/promotion.json
          OUTCOME: ${{ runner.temp }}/outcome.json
        run: node scripts/promote.mjs check
      # THE RELEASER'S TOKEN (plan 0005 §3.1, ADR 0013), only to promote, narrowed to Contents
      # write, for the tag, the Release, the major tag and the docs' branch and commit, Pull
      # requests write, for the docs' pull request, and Workflows write. The stable tag and the
      # major tag point at the candidate's commit, whose `.github/workflows` differ from the default
      # branch's head and from the major tag's current target, though the commit itself changes
      # none; GitHub refused the first promotion's tag without it ("Resource not accessible by
      # integration", run 40641153349). The exact rule GitHub applies isn't confirmed, so keep the
      # grant even when a candidate's own diff touches no workflow. Kanon's adoption record declares
      # it for the Releaser (`K-AGENT-3`). A step `if:` can't read
      # `secrets`, and the Releaser is required here, so a missing secret fails the mint by name.
      - name: Mint the Releaser's token
        id: releaser
        if: steps.gates.outputs.decision == 'promote'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Tag, publish and move the major tag
        id: apply
        if: steps.gates.outputs.decision == 'promote'
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          PLAN: ${{ runner.temp }}/promotion.json
        run: node scripts/promote.mjs apply
      # The pin job's pattern (release-please.yml): the branch starts at this run's commit, the
      # commit is made through the API so GitHub signs it as the Releaser and the `dco` check
      # exempts it, and a pull request that already exists is left alone. The Owner merges it.
      # If this step fails, the docs still name the previous stable release, which CI accepts;
      # run `node scripts/doc-pins.mjs move vX.Y.Z` by hand.
      - name: Open the pull request that points the docs at the new release
        if: steps.gates.outputs.decision == 'promote'
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          PLAN: ${{ runner.temp }}/promotion.json
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="$(jq -r .tag "$PLAN")"
          if [[ "$(jq -r .latest "$PLAN")" != true ]]; then
            echo "$tag is not the latest release: the docs stay on the newer one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/doc-pins.mjs move "$tag" > "$RUNNER_TEMP/docs-moved"
          files=()
          while IFS= read -r f; do if [[ -n "$f" ]]; then files+=("$f"); fi; done < "$RUNNER_TEMP/docs-moved"
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "The docs already name $tag: nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="docs: point the docs at $tag"
          branch="kanon/docs-$tag"
          existing="$(gh pr list -R "$REPO" --head "$branch" --state all --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "The docs pull request for $tag already exists: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$REPO/git/matching-refs/heads/$branch" --jq '.[].ref' | grep -qx "refs/heads/$branch"; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" > /dev/null
          fi
          for f in "${files[@]}"; do
            jq -n --arg path "$f" --rawfile text "$f" '{path: $path, contents: ($text | @base64)}'
          done | jq -s . > "$RUNNER_TEMP/docs-additions.json"
          jq -n --arg repo "$REPO" --arg branch "$branch" --arg head "$SHA" --arg headline "$title" \
            --slurpfile additions "$RUNNER_TEMP/docs-additions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $headline}, fileChanges: {additions: $additions[0]}}}}' > "$RUNNER_TEMP/docs-commit.json"
          gh api graphql --input "$RUNNER_TEMP/docs-commit.json" --jq .data.createCommitOnBranch.commit.oid
          body="Points the README's install command and every \`uses:\` line in the docs at \`$tag\`, the stable release this run promoted, with \`scripts/doc-pins.mjs move\`. A reader copies them from the default branch, so they follow the stable channel, never a candidate."
          url="$(gh pr create -R "$REPO" --base "$BASE" --head "$branch" --title "$title" --body "$body")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
      # Runs after a failed docs step too: the promotion itself is done, and its issue closes.
      - name: Tell the Owner of a held promotion
        if: ${{ !cancelled() && steps.gates.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ runner.temp }}/outcome.json
          APPLIED: ${{ steps.apply.outcome }}
        run: node scripts/promote.mjs notify
