# QA pipeline — Agent 5 (the Lead), MODE: split. RA-1781. A Kanon lane (plan 0001, step 5).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers (`issues: [labeled]` and a `workflow_dispatch` taking `issue`), the
# `permissions:` ceiling, and one job that `uses:` this file at an exact Kanon tag, passes
# `issue` through, and maps the three secrets below by name (never `secrets: inherit`).
# The `github` context in a called workflow is the caller's, so the label check, the
# concurrency group and the gate read the triggering event exactly as they did when this
# file held the triggers itself.
#
# Proposes splitting ONE project issue that is too big for a single implementer run,
# as a PR against its brief. It files nothing, dispatches nothing and closes nothing
# itself: the PR is reviewed like any brief PR, and merging it is what changes the
# decomposition.
#
# ── THE GAP THIS CLOSES ─────────────────────────────────────────────────────
# An implementer run that hits its turn or budget cap leaves no PR, no branch and no
# comment, and a re-run hits the same cap: RA-1694 spent two ~35-minute, ~$21-notional
# runs proving it. `classify-agent-result.mjs` names that verdict `exhausted`, and the
# crash job (RA-2312) and the dispatch sweep stop re-dispatching it. Until this lane, the
# only place it could go was a human doing the decomposition the Lead exists to do.
#
# ── WHY A BRIEF EDIT, NOT FILED CHILDREN ─────────────────────────────────────
# The brief is the decomposition of record, and every other agent reads it. Filing
# children directly would leave the brief disagreeing with the filed issues — the drift
# AGENTS.md warns about throughout. So the children are brief items, the reconciler
# files them after the merge exactly as it files any other item, and `brief-guard`
# checks the new `Depends on:` edges.
#
# ── WHY THE PARENT IS CLOSED, NOT ADOPTED ───────────────────────────────────
# The reconciler never rewrites a filed issue's body, and the implementer builds to the
# BODY. A child that adopted the parent (`**Closes #N**` on its metadata line) would
# therefore be dispatched with the parent's oversized criteria and exhaust again. So the
# PR body carries `Closes #N.` — merging it closes the parent — and every child is filed
# fresh from its own brief item.
#
# ── ONE SPLIT PER LINEAGE ───────────────────────────────────────────────────
# Each child's brief item carries `<!-- qa:split-of #N -->` on a line of its own, which
# the file arm copies into the filed body. A child that exhausts again is routed to
# `qa:needs-info` by `split-lineage.mjs`, never back here, and the gate below refuses
# one that arrives anyway.
#
# ── HOW IT STARTS ───────────────────────────────────────────────────────────
# `issues: labeled` with `qa:needs-split` — a human, the dispatch sweep on the Lead App
# token, or the implement lane's crash job on the Implementer's App token. The crash job
# used to add its label on the DEFAULT token, which raises no event, and start this
# workflow by `workflow_dispatch` instead; the membership gate refuses that dispatch, whose
# actor is `github-actions[bot]` (K-AGENT-45), so it now labels as the App (plan 0001
# decision 21). A dispatch by hand still works. Both can arrive for
# one issue; the per-issue concurrency group (on the JOB, so a label event that only
# reaches a skipped job never joins it and cannot displace a pending run) holds the
# second until the first finishes, and the gate then finds its open PR and skips.
#
# RE-DELIVERY IS THE RECONCILER'S (RA-2406). A run that dies leaves the issue labelled with
# no split PR. `lead-reconcile`'s hourly tick re-adds `qa:needs-split` on the App token
# ONCE (`splitRecovery`), which is a fresh `labeled` event here; a second dead delivery,
# or a split PR closed unmerged, moves the issue to `qa:needs-info` for a human. The gate
# below still decides every delivery, so a pre-standard brief is refused, never split.
#
# INERT until: the caller is on the default branch + the Lead's App installed + these
# secrets (plan 0001 §8):
#   LEAD_APP_ID, LEAD_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN
name: Lead — split

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   issues: [labeled]
#   workflow_dispatch   — input `issue` (required: the oversized issue, carrying qa:needs-split)
on:
  workflow_call:
    # The caller's `workflow_dispatch` input, passed through. Empty on the label trigger,
    # which carries no inputs, so it is not required here.
    inputs:
      issue:
        description: The oversized issue to split (it must carry qa:needs-split)
        required: false
        type: string
        default: ""
    secrets:
      LEAD_APP_ID:
        required: true
      LEAD_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). The caller's job holds the
# ceiling and must grant at least this, or the run fails to start; `lane-check` fails a
# caller that grants less.
permissions:
  contents: read
  # The gate's refusal moves the issue to `qa:needs-info` with a comment, on this token.
  issues: write
  # The gate asks whether a split PR is already open on this issue's branch.
  pull-requests: read

jobs:
  # THE MEMBERSHIP GATE, in a job of its own: the split job's first steps are a checkout
  # and the split-lineage gate, and the membership gate must come before both. It holds no
  # concurrency group, so the split job's per-issue group still covers the lineage gate and
  # the agent together.
  filter:
    # Every label event in the repo reaches this workflow; only the one label starts it.
    # A job-level `if` concludes the others `skipped` rather than `success`.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'qa:needs-split'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      member: ${{ steps.gate.outputs.member }}
    steps:
      # THE MEMBERSHIP GATE COMES FIRST (K-AGENT-45, kanon#46), before any token is minted:
      # this lane acts only when the event's actor is a member or a registered agent App.
      # `scripts/lane-gate.mjs` says who the actor is for each event; a refusal leaves
      # `member=false`, a notice and a step-summary line, and every later step and job skips.
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

  split:
    needs: filter
    if: needs.filter.outputs.member == 'true'
    # Never two splits of one issue at once: both would branch from the same brief and
    # open rival PRs. JOB-level, after the `if`: every label event on the issue starts
    # this workflow, and at workflow level each would join the group and could replace
    # a pending real run.
    concurrency:
      group: agent-lead-split-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336). A split reads one brief and one issue and edits one file;
    # the brief lane's 100 minutes is the ceiling of the same agent doing more.
    timeout-minutes: 60
    steps:
      # Checked out on the default token first: the gate needs the script and the brief
      # file, and a skipped or refused run must cost no minted token.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The scripts are Kanon's, read from the action cache at the tag the caller pinned (plan
      # 0001 §3); the brief and the issue are the adopter's, from the checkout above.
      - uses: $/actions/kanon-path

      - name: Should this issue be split?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          APPLY: "1"
        run: node "$KANON/scripts/split-lineage.mjs" gate

      - name: Mint lead App token
        id: app-token
        if: steps.gate.outputs.act == 'split'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LEAD_APP_ID }}
          private-key: ${{ secrets.LEAD_APP_PRIVATE_KEY }}

      # Re-checkout on the App token, so the push authenticates as the Lead — the default
      # token's pushes raise no events, and the PR must reach the Reviewer.
      - uses: actions/checkout@v7
        if: steps.gate.outputs.act == 'split'
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # THE AGENT-LANE BLOCKS (RA-2658). This lane keeps its ONE job and calls the shared
      # composite actions (`agent-setup`, `agent-run`, `agent-finish`, RA-2666) around its own
      # gate and post-check, rather than handing its job to `agent-lane.yml`: the per-issue
      # concurrency group above must cover the gate AND the agent together, and a reusable
      # workflow would split them into separate jobs, each acquiring the group on its own.
      # Every block call carries the gate, as every step after it always has. They are `$/`
      # references (RA-2697), read from Kanon at the tag the caller pinned, so the agent's
      # `git checkout -B <branch> origin/main` cannot change the copy the finish block runs.
      #
      # THE PROJECT-SETUP HOOK (RA-2694), as the spine calls it: the presence check (copied
      # verbatim from `agent-lane.yml`, bar the gate) and then the hook, after the checkout
      # and before `agent-setup`. This lane installs and has no database and no browser.
      - name: Check the project-setup hook is present
        id: hook
        if: steps.gate.outputs.act == 'split'
        run: |
          if [ ! -f .github/actions/project-setup/action.yml ]; then
            echo "::error title=project-setup hook missing::This lane runs the project's setup from .github/actions/project-setup/action.yml, and the checked-out tree ($(git rev-parse --short HEAD)) has none. A branch cut before the hook existed (RA-2694) must be rebased onto the default branch."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/project-setup
        if: steps.gate.outputs.act == 'split'
        with:
          lane: lead-split
          install: "true"
          database: "false"
          browsers: "false"
          issue-number: ${{ github.event.issue.number || inputs.issue }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          github-token: ${{ steps.app-token.outputs.token }}

      # A missing grant must be a red run with a readable message, never a 403 discovered
      # after the reasoning has been paid for — `push-probe` is the brief lane's probe,
      # moved into the spine by RA-2609 and into this block by RA-2666. It still follows the App-token checkout, whose
      # persisted credential it pushes with, and precedes the agent.
      - uses: $/actions/agent-setup
        if: steps.gate.outputs.act == 'split'
        with:
          arm: lead split agent
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          push-probe: "true"

      - uses: $/actions/agent-run
        id: agent
        if: steps.gate.outputs.act == 'split'
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.app-token.outputs.token }}
          prompt: |
            You are the Lead (Agent 5), in SPLIT mode (RA-1781). You produce ONE
            artifact — a PR that splits one item of an approved project brief into
            smaller items. You do NOT file, dispatch, implement, merge or close any issue
            yourself. Read docs/agentic-lead-engineer.md §5 (§5.7 is the brief format),
            AGENTS.md, and docs/projects/_template.md before you start.

            THE ISSUE: #${{ github.event.issue.number || inputs.issue }}
            ITS PROJECT: #${{ steps.gate.outputs.project }} — the brief is
            docs/projects/${{ steps.gate.outputs.project }}.md
            YOUR BRANCH: ${{ steps.gate.outputs.branch }}

            WHY YOU ARE HERE. This issue's implementer run hit its turn or budget cap and
            produced nothing. A re-run hits the same cap, so it is TOO BIG FOR ONE RUN, and
            the fix is a smaller decomposition — not sharper wording of the same scope.
            Read the issue and every comment on it (`gh issue view <n> --comments`): the
            capped run's crash note, any rulings a human gave, and any bail the
            implementer left are what tell you where the size came from.

            1. FIND THE ITEM. In the brief's Decomposition, the `### Issue X — Title`
               whose title is this issue's title, or whose `**Milestone:**` metadata line
               names `**Closes #<this issue>**`. If there is none, or more than one, STOP:
               comment on the issue saying what you found, move it from `qa:needs-split`
               to `qa:needs-info`, and open no PR.

            2. REPLACE IT WITH 2–4 CHILDREN, keyed from the parent — `### Issue X1 — …`,
               `### Issue X2 — …`. Draw the seams where the CODE forces them (what stops
               compiling, what one migration must carry together), not where the prose
               reads as separable; say in the PR which seam each boundary follows. Aim
               each child well under the implementer's typical run: one surface, one
               migration at most, a handful of criteria. Each child:
               - copies the parent's `**Milestone:**` and `**Labels:**` onto its own
                 metadata line, and carries NO `**Closes #N**`. The parent is CLOSED by
                 your PR, not adopted: the reconciler never rewrites a filed body, so a
                 child adopting the parent would be dispatched with the parent's
                 oversized criteria and hit the cap again.
               - has, after the metadata lines and a blank line, this line ON ITS OWN:
                 <!-- qa:split-of #${{ github.event.issue.number || inputs.issue }} -->
                 It is copied into the filed issue and it is how the pipeline knows a
                 split was already tried: a child that exhausts again goes to a human,
                 never back here. Omitting it lets a bad split recurse.
               - carries forward every ruling from the parent's thread that applies to
                 it, in its body — the parent is closed, so its comments stop being read.
               - cites its acceptance criteria as `[PREFIX-N]` ids leading their bullets.
                 Every id the parent cited lands in exactly ONE child. A new id comes only
                 from `node "$KANON/scripts/spec-ids.mjs" --apply`.

            3. RE-POINT THE EDGES. Every `**Depends on:** Issue X` anywhere in the brief
               must name the child that actually carries the dependency; order the
               children with `**Depends on:**` among themselves where one needs another.

            4. CHANGE NOTHING ELSE in the brief. A split is one of the two sanctioned
               post-approval edits (docs/agentic-lead-engineer.md §5.3, which states that
               an approved brief is otherwise immutable, and that the six pre-standard
               briefs are excluded — the gate never sends you one); a wider edit is a new
               brief, not a split.

            5. VERIFY before you push, and fix until both are clean:
               - `node "$KANON/scripts/brief-guard.mjs"`
               - `node -e "import(process.env.KANON + '/scripts/lead-reconcile.mjs').then(({parseProposed})=>{const p=parseProposed(require('fs').readFileSync('docs/projects/${{ steps.gate.outputs.project }}.md','utf8'));console.log(JSON.stringify({items:p.map(i=>i.key+' '+i.title),residue:p.residue?.length??0,dropped:p.flatMap(i=>[...(i.droppedCloses??[]),...(i.droppedLabels??[]),...(i.droppedDeps??[]),...(i.droppedLines??[])])},null,1))})"`
                 — expect every child listed, `residue: 0`, and nothing dropped.

            6. BRANCH FRESH FROM MAIN: `git checkout -B ${{ steps.gate.outputs.branch }} origin/main`.
               A branch of that name may already exist on origin from an earlier split
               whose PR was closed unmerged (the gate only runs when no split PR is
               OPEN); it is dead, so push over it with `git push --force origin HEAD`.
               OPEN ONE PR from branch `${{ steps.gate.outputs.branch }}`, titled
               `docs(projects): split #<issue> into <keys>` (e.g. "split #1694 into C1, C2
               and C3"). The FIRST paragraph of the PR body is exactly
               `Closes #<issue>.` (plain text, no backticks around it — merging must close
               the parent). Then: why it exhausted, the table of children (key, title,
               depends on, criteria), and which seam each boundary follows. Label the PR
               `review:please` so the Reviewer reviews it. Do NOT milestone the PR (AGENTS.md:
               issues only). NEVER merge. Leave `qa:needs-split` on the issue: merging
               the PR closes it.

            7. Comment on the issue with the PR link.

            ALWAYS leave a comment on the issue before you finish — the PR link, or why
            you stopped. Never end with no output.
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 80
            --max-budget-usd 35
            --fallback-model claude-opus-5-5
            --allowedTools Read,Edit,Write,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections

      # NO SILENT ABSENCE. A green run with no split PR would read exactly like success,
      # while the issue sits labelled with nothing replacing it.
      - name: Did a split PR open?
        if: steps.gate.outputs.act == 'split'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.gate.outputs.branch }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          n=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq 'length')
          pr=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          # Every child the PR adds must carry its lineage marker (the Reviewer, RA-2407).
          if [ -n "$pr" ]; then PR="$pr" node "$KANON/scripts/split-lineage.mjs" check-pr || true; fi
          # Re-read the label: an agent that could not find the item moves the issue to
          # qa:needs-info on purpose, and that is a hand-off, not a silent failure.
          still=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | index("qa:needs-split") != null')
          if [ "$n" != "0" ]; then
            echo "split PR open on $BRANCH"
          elif [ "$still" = "true" ]; then
            echo "::warning title=agent-lead-split::#$ISSUE: the split run finished with no open PR on $BRANCH — the issue still carries qa:needs-split with nothing replacing it. Read the agent's comment on the issue."
          else
            echo "no PR, and the issue left qa:needs-split — the agent handed it on (read its comment)"
          fi

      # THE HOOK GOES BACK (RA-2694), for its toolchain's post step — copied verbatim from
      # `agent-lane.yml`, which says why.
      - name: Put the project-setup hook back for its post steps
        if: always() && steps.gate.outputs.act == 'split' && steps.hook.outputs.sha != ''
        env:
          SHA: ${{ steps.hook.outputs.sha }}
        run: |
          if git checkout "$SHA" -- .github/actions/project-setup 2>/dev/null; then
            echo "project-setup hook put back from $SHA"
          else
            echo "::warning title=agent-lane::could not put the project-setup hook back from $SHA; its post steps may fail"
          fi

      # WHY A RED RUN WENT RED (RA-1408), and what the run cost (RA-1485). `always()` AND the
      # gate: a run that declined to act invoked no agent and must not write a
      # `not-reached` row. The classifier keys on `job-status`, the job-level `failure()`
      # the block cannot evaluate from inside itself. NEVER FAILS THE CALLER — see the
      # contract in `agent-telemetry`'s header and `docs/observability.md` §8 (RA-1553).
      - uses: $/actions/agent-finish
        id: finish
        if: always() && steps.gate.outputs.act == 'split'
        continue-on-error: true
        with:
          arm: lead split agent
          agent: lead-split
          job-status: ${{ job.status }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 80
            --max-budget-usd 35
            --fallback-model claude-opus-5-5
            --allowedTools Read,Edit,Write,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections
          execution_file: ${{ steps.agent.outputs.execution_file }}
          issue-number: ${{ github.event.issue.number || inputs.issue }}
          started-at: ${{ steps.agent.outputs.started-at }}
          github-token: ${{ steps.app-token.outputs.token }}
