# Kanon's DCO check (ADR 0010), run the way an adopter runs it: pinned to an exact Kanon
# release (K-ADOPT-11), which Dependabot bumps.
#
# The check that judges a PR runs Kanon's LAST release, never this PR's copy through `$/`
# (#47). Through `$/` a PR that weakened the check would be judged by the weakened check
# and pass itself. This is ADR 0011's bootstrap applied to a check's code, as K-MERGE-17
# applies it to a check's inputs: the stable release judges the next one. A change to
# actions/dco therefore judges PRs one release after it merges. This PR's own copy still
# runs, as a test rather than as the judge, in judging-actions-smoke.yml.
#
# The action reads the PR's commits through the API, so nothing is checked out.
# `pull-requests: read` lets the workflow token list the commits; `contents: read` is
# what a private repository also needs for them.
#
# On merge_group (K-MERGE-7) the check passes without checking anything, under the same
# job name, because a required check must report on the queue's branch or the queue
# waits for it. A merge group carries no pull request, so there are no PR commits to
# list, and none is needed: a PR can only be queued once this check passes, and pushing
# to a queued PR removes it from the queue, so the commits that were checked are exactly
# the commits that merge. The queue's own commits on its temporary branch are GitHub's,
# not a contributor's, so there is nothing there to sign off. CI runs the real test of
# the combined code. The job runs and passes rather than being skipped by a job-level
# `if`, so the queue's check doesn't rest on how GitHub scores a skipped required check.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Signed-off commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Already checked on the pull request
        if: github.event_name == 'merge_group'
        run: echo "Merge group. Each queued PR's commits passed this check before it could be queued."
      - uses: yedeya-labs/kanon/actions/dco@v0.27.0
        if: github.event_name == 'pull_request'
