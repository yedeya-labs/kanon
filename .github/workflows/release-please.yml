# Kanon's releases (K-SHIP-7), through its own reusable release workflow, by `$/`.
# `$/` resolves to the commit being released, so Kanon is always the first repository to
# release with a change to it. Adopters call the same workflow pinned to an
# exact version instead: see docs/release.md.
#
# It was the last `./` reference (plan 0001 §4) until a job-level `$/` call to a reusable
# workflow ran green on main: the agent lanes smoke, at the merge of the shared lane
# workflow (#35).
#
# The writes are granted here, on the calling job only: a reusable workflow can use no
# more than its caller grants.
#
# A completed check run starts it too, for the pin job alone (plan 0012 §8.1, its step E11): the
# end-to-end harness's Reporter completes `kanon-e2e` on a candidate's commit hours after the
# push that cut it, and only then may Kanon's pins move. On that event the release is skipped.
name: Release

on:
  push:
    branches: [main]
  check_run:
    types: [completed]

permissions: {}

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/release.yml
    # The Releaser App (plan 0005 L5): it opens the release PR, so CI runs on it, and is the
    # ruleset's only bypass. Mapped by name, never inherited; unset, the workflow token.
    secrets:
      RELEASER_APP_ID: ${{ secrets.RELEASER_APP_ID }}
      RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

  # THE PIN JOB (plan 0009 §6, its step S4): Kanon runs each candidate on itself the day it is
  # cut. It is Kanon's, not the reusable workflow's: it moves Kanon's own pins to Kanon's own
  # candidates, and teaches no check about Kanon. Three jobs: `candidate` says which candidate
  # this push cut, if any, `gate` reads the end-to-end gate on it, and `pins` opens the pull
  # request once that gate passes.
  #
  # Which push cut a candidate. The reusable release workflow declares no outputs, so this caller
  # can't read release-please's (`release_created`, `tag_name`, `sha`), and release-please has no
  # output that says "pre-release" anyway. So `candidate` reads what the release leaves on
  # GitHub: the version the manifest records at the pushed commit, the tag
  # `candidate-v<version>`, and its Release. Only a push whose commit that tag names, with a
  # Release that is a pre-release, is a candidate's creation. A plain release (`vX.Y.Z`) and
  # every other push leave `tag` empty, and `pins` is skipped. A read that fails fails the job
  # (K-PRIN-10), so an outage never reads as "no candidate".
  #
  # On a completed `kanon-e2e` check run that concluded `success` and names the Reporter's App
  # id (`REPORTER_APP_ID` in scripts/promote.mjs), it reads the same at the check run's commit
  # instead: a check run on any commit but a candidate's finds none. Every other check run skips
  # it, and so everything after it. The `if:` only spares runs: `gate` reads the check run again.
  candidate:
    name: Find the candidate this push cut
    needs: release
    if: >-
      !cancelled() && (needs.release.result == 'success' || (github.event_name == 'check_run'
      && github.event.check_run.name == 'kanon-e2e' && github.event.check_run.conclusion == 'success'
      && github.event.check_run.app.id == 5349415))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the candidate this push cut
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          none() {
            echo "No candidate: $1. Kanon's pins stay where they are." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          version="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/.release-please-manifest.json?ref=$SHA" --jq '.["."]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || none "the manifest's version at $SHA, '$version', is not X.Y.Z"
          tag="candidate-v$version"
          found="$(gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          grep -qx "refs/tags/$tag" <<< "$found" || none "no tag $tag"
          commit="$(gh api "repos/$REPO/commits/$tag" --jq .sha)"
          [[ "$commit" == "$SHA" ]] || none "$tag names $commit, not this push's $SHA"
          pre="$(gh api "repos/$REPO/releases?per_page=30" --jq ".[] | select(.tag_name == \"$tag\") | .prerelease")"
          [[ "$pre" == "true" ]] || none "$tag has no pre-release Release"
          echo "Candidate $tag, cut at $SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # THE END-TO-END GATE (plan 0012 §8.1, decision 2, its step E11): Kanon's pins move only to a
  # candidate the end-to-end harness passed, so the soak's 72 hours start on one. `promote.mjs
  # gate` reads the gate the promotion reads, the fifth one (§8.2), and nothing else, with this
  # job's read-only token: the Reporter's `kanon-e2e` check run on the candidate's commit, and the
  # harness run it links, whose repository is public. On the push that cuts a candidate it holds,
  # since the harness hasn't run yet; the Reporter's completed check run starts this workflow
  # again, and `pins` runs then. There is no override: a red gate holds until a new candidate.
  gate:
    name: Read the end-to-end gate
    needs: candidate
    # A status function, or GitHub's implicit success() skips this on a check run, where
    # `release` is skipped (kanon#261).
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.candidate.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the end-to-end gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: node scripts/promote.mjs gate

  # Opens `ci(deps): run Kanon on candidate vX.Y.Z` as the Releaser, with the edit
  # `scripts/move-pins.mjs` makes at the triggering commit: every `yedeya-labs/kanon` pin under
  # `.github/` and the plugin's `ref` in `.claude/settings.json`. The Owner merges it, and its
  # merge starts the candidate's soak. When the candidate's own `lane-check` fails on the moved
  # callers, `scripts/pin-lane-check.mjs` lists each one, and the pull request opens as a draft
  # with that list in its body (kanon#1074): the job moves the pins only, and a person makes the
  # caller changes on its branch.
  #
  # It runs only once `gate` passes (plan 0012 E11), and opens nothing when its pull request
  # already exists, so the push and the check run that each start it never open two. It works at
  # `github.sha`, the triggering commit and never another ref, since it holds the Releaser's key
  # (K-AGENT-49): on a push, the pushed commit, the candidate's; on a check run, the default
  # branch's head, which holds the candidate's commit and what merged after it.
  #
  # The Releaser's token is minted after the edit, and is required: the pull request must be the
  # Releaser's so CI runs on it. Its commit is made through the API with no author of its own,
  # so GitHub signs it as the Releaser and the `dco` check exempts it, as it does the release
  # PR's commits. It changes workflow files, so the token asks for Workflows write too.
  pins:
    name: Open the pin pull request
    needs: [candidate, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.candidate.outputs.tag != '' && needs.gate.outputs.pass == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: kanon-pins
      cancel-in-progress: false
    steps:
      # The triggering commit: the pushed one, the candidate's, on a push; the default branch's
      # head on a check run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Move every pin to the candidate
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/move-pins.mjs "$TAG" > "$RUNNER_TEMP/moved"
          git --no-pager diff --stat
      # The candidate's own lane-check on the moved tree, as CI's `Lane check` will run it on the
      # pull request (kanon#1074). A caller the candidate's lanes need changed is listed in
      # `callers.md`, which the next step puts in a draft's body; the job never edits it.
      - name: Check the moved callers with the candidate's lane-check
        id: callers
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          set -uo pipefail
          status=0
          node scripts/pin-lane-check.mjs "$TAG" > "$RUNNER_TEMP/callers.md" || status=$?
          case "$status" in
            0) echo "The candidate's lane-check passes on the moved callers." >> "$GITHUB_STEP_SUMMARY" ;;
            1)
              # A crash before the script prints (a module that fails to load) still opens a draft.
              if [[ ! -s "$RUNNER_TEMP/callers.md" ]]; then
                echo "- pin-lane-check exited 1 and named no problem: read the pin job's log" > "$RUNNER_TEMP/callers.md"
              fi
              {
                echo "The candidate's lane-check fails on the moved callers, so the pin pull request opens as a draft. Each caller needs:"
                echo
                cat "$RUNNER_TEMP/callers.md"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=pin job::Kanon's callers need a change for $TAG: the pin pull request opens as a draft, with the list in its body and this run's summary."
              ;;
            *) exit "$status" ;;
          esac
      - name: Mint the Releaser's token
        id: releaser
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open the pull request as the Releaser
        id: open
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#candidate-v}"
          title="ci(deps): run Kanon on candidate v$version"
          branch="kanon/pins-$TAG"
          files=()
          while IFS= read -r f; do if [[ -n "$f" ]]; then files+=("$f"); fi; done < "$RUNNER_TEMP/moved"
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Every pin already names $TAG: nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh pr list -R "$REPO" --head "$branch" --state all --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "The pin pull request for $TAG already exists: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The branch starts at the commit this run checked out (on a check run, the default
          # branch's head); one left by a failed run is reset.
          if gh api "repos/$REPO/git/matching-refs/heads/$branch" --jq '.[].ref' | grep -qx "refs/heads/$branch"; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" > /dev/null
          fi
          for f in "${files[@]}"; do
            jq -n --arg path "$f" --rawfile text "$f" '{path: $path, contents: ($text | @base64)}'
          done | jq -s . > "$RUNNER_TEMP/additions.json"
          jq -n --arg repo "$REPO" --arg branch "$branch" --arg head "$SHA" --arg headline "$title" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $headline}, fileChanges: {additions: $additions[0]}}}}' > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid
          body="Moves every Kanon pin under \`.github/\`, and the plugin's \`ref\` in \`.claude/settings.json\`, to the candidate \`$TAG\`, with \`scripts/move-pins.mjs\` (plan 0009 §6, step S4). Kanon runs each candidate on itself before it is promoted; this pull request's merge starts the candidate's 72-hour soak."
          draft=()
          if [[ -s "$RUNNER_TEMP/callers.md" ]]; then
            draft=(--draft)
            body+=$'\n\n'"**Kanon's callers need a change first.** The candidate's \`lane-check\`, which the pin job ran on the moved tree, reports what CI's \`Lane check\` will fail on here:"$'\n\n'"$(cat "$RUNNER_TEMP/callers.md")"$'\n\n'"Make each change on this branch, as \`kanon init\` at \`$TAG\` writes the caller, then mark it ready for review."
          fi
          url="$(gh pr create -R "$REPO" --base "$BASE" --head "$branch" --title "$title" --body "$body" "${draft[@]}")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
