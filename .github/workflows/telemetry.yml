# Kanon collects its own telemetry rows into the hosted store (plan 0002 S7 and S9).
#
# A trigger-only caller of Kanon's collector, written exactly as an adopter writes one
# (docs/telemetry.md, "Collect the rows"). It is named `telemetry.yml` because
# `telemetry-collect.yml` is the collector itself.
#
# IT CALLS KANON'S LAST RELEASE, NEVER `$/` (ADR 0011's bootstrap, as review.yml does). The job
# mints the token the store admits Kanon's rows with, so the code that holds it is a released
# version.
# Dependabot's `kanon` group proposes each release here with the other pins
# (.github/dependabot.yml, ADR 0011), and `lane-check` (in CI) holds every Kanon reference to
# one version.
#
# HOURLY AT MINUTE 40, the collector's contract (plan 0002 §1.2). It touches no database: the
# store is on-demand DynamoDB behind a function, so a sweep wakes nothing that scales to zero.
# The schedule was held back until the pins reached a release that ships the collector, since
# GitHub resolves a called workflow before it reads any job's `if:`; v0.27.0 does (kanon#304).
#
# ITS CREDENTIAL IS GITHUB'S OIDC TOKEN (plan 0008 §2.1, step J5). It passes no variable and no
# secret: the hosted store's URL is the collector's own constant, published from v0.40.2, and
# the store checks the token's claims. The SigV4 path's `url:` and `writer-role:` inputs went when
# the pin reached v0.40.2 (plan 0008 §9 step 4): from v0.40.0 the collector refuses either without
# `audience`, which names a self-hosted store (#842).
#
# THE DISPATCH INPUTS, passed through: `window_minutes`, `erase: yes` (erase this repository's rows
# and registration, send nothing) and `register: yes` (register again after an erasure), as
# docs/telemetry.md's caller has them.
name: Telemetry

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: >-
          Force an exact sweep span, in minutes. Leave empty to sweep back to the last
          successful sweep, which is what recovers dropped schedules.
        required: false
        default: ""
      erase:
        description: Erase this repository's rows and registration from the store, and send nothing.
        type: choice
        options: ["no", "yes"]
        default: "no"
      register:
        description: Register this repository again after an erasure.
        type: choice
        options: ["no", "yes"]
        default: "no"

# The ceiling for the collector: it reads the artifacts and runs, and the adoption record's
# upstream-findings level (plan 0006 F4), and its collect job mints the OIDC token each request to
# the store carries. It reads the pull requests and issues its work-item rows are derived from
# (plan 0003 M4).
# Nothing else is granted.
permissions:
  actions: read
  contents: read
  id-token: write
  issues: read
  pull-requests: read

jobs:
  collect:
    uses: yedeya-labs/kanon/.github/workflows/telemetry-collect.yml@candidate-v0.43.0
    with:
      window_minutes: ${{ inputs.window_minutes }}
      erase: ${{ inputs.erase }}
      register: ${{ inputs.register }}
