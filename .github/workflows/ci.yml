# Kanon's own checks on every pull request: lint, type-check and unit tests.
#
# It also runs on merge_group (K-MERGE-7). The merge queue tests each queued PR on top of
# main and whatever is ahead of it in the queue, and this is the check that makes that
# test mean something: it runs the full suite on the combined commit. Without the
# trigger, a required check never reports on the queue's branch and queued PRs wait
# until they time out.
#
# It also runs `lane-check` on Kanon itself (plan 0001 step 4b), now that Kanon calls its own
# review lane (review.yml). Like the DCO and PR-title checks, it runs Kanon's LAST release,
# never `$/` (ADR 0011, #47): this is a required check, so a PR must not bring the check that
# passes it. Released lane-check also reads the lanes at that release, which is the version
# the caller pins, and fails unless every Kanon reference in .github/ names that one version.
#
# It runs actionlint over .github/ through .github/scripts/actionlint.sh (#77), a pinned,
# checksum-verified binary behind a shim that reads `$/` as `./`, which actionlint can't parse
# yet. The shim is what makes it check each `$/` call's inputs against the action's own
# `action.yml`; without it, those calls are parse errors and their inputs go unchecked.
#
# Read-only on purpose. This workflow needs nothing but the code, so it gets nothing else.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: yedeya-labs/kanon/actions/lane-check@v0.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the pinned actionlint
        id: actionlint-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/kanon-actionlint
          key: actionlint-1.7.12-${{ runner.os }}-${{ runner.arch }}
      - name: actionlint (workflows and action inputs)
        id: actionlint
        run: bash .github/scripts/actionlint.sh
      - name: Save the pinned actionlint
        if: ${{ !cancelled() && steps.actionlint-cache.outputs.cache-hit != 'true' && steps.actionlint.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/kanon-actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
