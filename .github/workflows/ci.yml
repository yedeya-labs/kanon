# Kanon's own checks on every pull request: lint, type-check and unit tests.
#
# It also runs on merge_group (K-MERGE-7). The merge queue tests each queued PR on top of
# main and whatever is ahead of it in the queue, and this is the check that makes that
# test mean something: it runs the full suite on the combined commit. Without the
# trigger, a required check never reports on the queue's branch and queued PRs wait
# until they time out.
#
# It also runs `lane-check` on Kanon itself (plan 0001 step 4b), now that Kanon calls its own
# review lane (review.yml). Like the DCO and PR-title checks, it runs Kanon's LAST release,
# never `$/` (ADR 0011, #47): this is a required check, so a PR must not bring the check that
# passes it. Released lane-check also reads the lanes at that release, which is the version
# the caller pins, and fails unless every Kanon reference in .github/ names that one version.
# It is a job of its own, `Lane check`, as the action's README gives it to adopters: that is
# the status check the `main` ruleset requires (K-ADOPT-1 step 8, which `kanon doctor` checks
# by name), and the action leaves Kanon's Node on the PATH for the rest of its job.
#
# It runs actionlint over .github/ through .github/scripts/actionlint.sh (#77), a pinned,
# checksum-verified binary behind a shim that reads `$/` as `./`, which actionlint can't parse
# yet. The shim is what makes it check each `$/` call's inputs against the action's own
# `action.yml`; without it, those calls are parse errors and their inputs go unchecked.
#
# The `citation-guard` job runs scripts/citation-guard.mjs over Kanon's own docs/, rulebook/ and
# READMEs (#377, #388, K-SELF-3): every `file:line` there must resolve, and point at what its
# sentence names. The globs are passed with `--path`, as any adopter passes its own, and
# citation-shift.yml passes the same list (tests/unit/workflows.test.ts holds the two equal). It is
# meant to be a required check, so it judges with the script at the PR's BASE commit, never the
# PR's own copy (#47), as public-text.yml does: a PR that weakened the guard must not be judged
# by the weakened guard. The PR's copy is tested by tests/library/citation-guard.test.ts. It
# runs on merge_group under the same job name, against the queue's base, so the queue gets a
# result. Its sibling, `citation-shift`, is advisory and runs in citation-shift.yml.
#
# Read-only on purpose. This workflow needs nothing but the code, so it gets nothing else.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    name: Lane check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: yedeya-labs/kanon/actions/lane-check@v0.30.0

  checks:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the pinned actionlint
        id: actionlint-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/kanon-actionlint
          key: actionlint-1.7.12-${{ runner.os }}-${{ runner.arch }}
      - name: actionlint (workflows and action inputs)
        id: actionlint
        run: bash .github/scripts/actionlint.sh
      - name: Save the pinned actionlint
        if: ${{ !cancelled() && steps.actionlint-cache.outputs.cache-hit != 'true' && steps.actionlint.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/kanon-actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  citation-guard:
    name: Citation guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The judge: the base's scripts/, beside the tree it reads. The guard reads `git ls-files`
      # in the working directory, so it runs from the PR's checkout, and this nested, untracked
      # copy is not part of what it reads.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .citation-guard-base
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: citation-guard (the base's copy)
        run: node .citation-guard-base/scripts/citation-guard.mjs --path 'docs/**/*.md' --path 'rulebook/**/*.md' --path README.md --path 'actions/*/README.md'
