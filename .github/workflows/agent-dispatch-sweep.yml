# QA pipeline — the dispatch sweep (RA-912), across BOTH agent lanes (RA-1336). A Kanon lane
# (plan 0004, step 9).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:` this
# file at an exact Kanon tag, passes `apply` through, and maps the Lead's two secrets by name
# (never `secrets: inherit`). The `github` context in a called workflow is the caller's, so the
# lane reads the triggering event exactly as it did when this file held the triggers itself.
#
# `agent-implement.yml` and `agent-triage.yml` both fire on `issues: [labeled]`, and that event
# is the ONLY thing that starts the Implementer in either mode. An event-driven system cannot
# recover from an event that never arrived, so three failures are invisible: the run that
# never happened, the question a person answered that nothing re-fired, and the issue the agent
# finished but nobody closed. The lane table lives in `scripts/dispatch-sweep.mjs`; this
# workflow runs it.
#
# This is a RECONCILER, not a trigger: it re-derives state from GitHub on a timer rather than
# depending on the event. It holds NO state: its own past actions are recovered by counting
# the marker comments it left.
#
# IDENTITY: THE AUTHOR APP, MINTED FOR THE LEAD. It cannot be the workflow token, because
# events that token raises never start another workflow, so a sweep using it could re-label
# and start nothing. The Implementer it watches mints from the same App, so the same login:
# its comments are told from the agent's by their Lead role marker and the sweep's marker
# (plan 0005 §3.3, `isSweepComment`), not by login.
#
# ── ITS COST ROWS: THE STORE FIRST, RUN ARTIFACTS WITHOUT ONE (plan 0004 §3.3, decision 3) ──
# The sweep charges a re-dispatch attempt per marker comment it left, which counts DISPATCHES,
# not runs that happened. So it reads 14 days of the two lanes' cost rows to see which
# dispatches never reached the model, and which issue's latest run hit its cap (RA-1517,
# RA-1781).
#   - WITH A STORE HOOK (`.github/actions/qa-store/action.yml`), the `store` job reads them
#     through the hook's `cost-rows` operation, the one job holding `id-token: write`, and hands
#     them to the sweep as job outputs. The sweep's own job holds no cloud credentials: an
#     explicit `permissions:` without `id-token` (`K-OBS-13`'s rule, P9, and the id-token guard).
#   - WITHOUT ONE, the store job says the store is absent, and the sweep reads the lanes' run
#     artifacts instead (`scripts/lib/telemetry-artifacts.mjs`, P7). Those cover only as far
#     back as the repository keeps artifacts, and the summary says so when that is less than
#     the window (`artifactRetentionNote`).
#   - A READ THAT FAILS fails CLOSED, as it always has: every dispatch is charged, and the
#     summary's first line says so (RA-2706).
#
# SOFT SKIP WITHOUT THE AUTHOR APP. Until its secrets exist, the lane skips with a
# `::warning::` instead of going red: a daily red run for a known-pending one-time setup is
# alarm fatigue. The trade is that a secret deleted later also soft-skips; the annotation and
# the step summary are the signal, and the stalled issues the sweep is not reconciling are the
# backstop.
#
# SAFE BY DEFAULT: a dispatch is a DRY RUN unless `apply` is ticked; the scheduled run applies,
# which is the point of it existing.
#
# NO MODEL. Every step runs a library script, `gh` or the store block, so this lane takes no
# Claude token and writes no telemetry row.
#
# INERT until: the caller is on the default branch + the Author App installed, with the
# Lead's row in the App register + these secrets (plan 0001 §8):
#   AUTHOR_APP_ID, AUTHOR_APP_PRIVATE_KEY
# The Author App (the Lead's) needs `Issues: write`, `Pull requests: read` and `Actions: read`
# (the run that triggered each telemetry row, and the run artifacts without a store).
# KANON ROLE: Lead
# The line above is read by `lane-check` and the token-permission test (plan 0005 §3.5): the
# role this lane mints for, as the Author App's `AUTHOR_APP_*` secrets no longer say. Its row
# in the App register must exist, and this lane's tokens fit inside that role's row.
name: Lead (Lead) — dispatch sweep

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   schedule: "40 4 * * *"   — daily, clear of the other agent crons. Daily rather than hourly
#                              because the cost that matters is the subscription quota each
#                              re-dispatch spends on a full Implementer run.
#   workflow_dispatch        — input `apply` (boolean, default false: a dry run)
# OPTIONAL SECRET: QA_STORE_BUCKET
# OPTIONAL SECRET: QA_STORE_ROLE_ARN
# The lines above are read by `lane-check` and the requirements file (kanon#433): the QA store's
# secrets, which a caller maps once its repository has a store hook, and may leave out until then.
on:
  workflow_call:
    # The caller's `workflow_dispatch` input, passed through. Empty on the schedule, so it is
    # a STRING: a caller passes `${{ inputs.apply }}`, which a boolean input refuses as `''`.
    inputs:
      apply:
        description: "'true' to actually re-dispatch on a dispatch (anything else = dry run)"
        required: false
        type: string
        default: ""
    # NOT REQUIRED, so a caller whose secrets don't exist yet reaches the soft skip below
    # instead of failing to start. `lane-check` still holds the caller to mapping both.
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      AUTHOR_APP_ID:
        required: false
      AUTHOR_APP_PRIVATE_KEY:
        required: false
      # THE QA STORE'S COORDINATES (kanon#433): secrets, so the runner masks them in every log of
      # the store job, the store step's own `with:` included. Optional: a repository with no store
      # hook maps nothing, and the store is absent. The store steps below hand them to the
      # `qa-store` block as `secrets`, by name, never the whole `secrets` context.
      QA_STORE_ROLE_ARN:
        required: false
      QA_STORE_BUCKET:
        required: false

concurrency:
  # Never two sweeps at once: both would derive the same world and re-dispatch one issue twice.
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: agent-dispatch-sweep${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). Each job below declares its
# own, so only the store job ever holds `id-token: write`, which the caller grants for it.
permissions:
  contents: read

jobs:
  gate:
    # ONLY THE CALLER'S TWO TRIGGERS. As a called workflow this lane runs on whatever its
    # caller is called on (Kanon's smoke calls it on pull requests).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      member: ${{ steps.gate.outputs.member }}
      ready: ${{ steps.app.outputs.ready }}
    steps:
      # THE MEMBERSHIP GATE COMES FIRST (K-AGENT-45, kanon#46), before any token is minted: on
      # the schedule the actor is whoever last changed it, on a dispatch whoever ran it. A
      # refusal leaves `member=false`, and the store and sweep jobs skip.
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

      # Secrets cannot be read in a job-level `if`, so the soft skip is a step whose output the
      # later jobs read.
      - name: Is the Author App configured?
        id: app
        if: steps.gate.outputs.member == 'true'
        env:
          APP_ID: ${{ secrets.AUTHOR_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning title=agent-dispatch-sweep::AUTHOR_APP_ID is unset: the Author App (the Lead's) is not set up, so the sweep is skipping. See docs/lanes.md (The dispatch sweep)."
            echo "Dispatch sweep **skipped**: the Author App (the Lead's) is not configured (\`AUTHOR_APP_ID\` unset)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # THE STORE JOB (plan 0004 §3.2): the two lanes' cost rows through the adopter's store hook,
  # and nothing else. It holds the store's credentials, so it runs the `qa-store` block alone
  # (`tests/unit/helpers/store-jobs.ts`). Without a hook each step says the store is absent and
  # `present` is 'false', on which the sweep reads run artifacts. A read that fails is
  # `degraded`: its rows output carries the error, and the sweep charges every dispatch.
  #
  # ONE STEP PER TELEMETRY AGENT, named as `dispatch-sweep.mjs`'s `LANES` name them
  # (`telemetryAgent`); `dispatch-sweep-lane.test.ts` holds the two lists together. The window
  # is the sweep's, 14 days (`UNREACHED_WINDOW_DAYS`).
  store:
    needs: gate
    if: needs.gate.outputs.member == 'true' && needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      present: ${{ steps.implementer.outputs.present }}
      implementer: ${{ steps.implementer.outputs.rows }}
      triage-fix: ${{ steps.triage-fix.outputs.rows }}
    steps:
      - uses: $/actions/qa-store
        id: implementer
        with:
          operation: cost-rows
          variables: ${{ toJSON(vars) }}
          secrets: ${{ format('{{"QA_STORE_ROLE_ARN":{0},"QA_STORE_BUCKET":{1}}}', toJSON(secrets.QA_STORE_ROLE_ARN), toJSON(secrets.QA_STORE_BUCKET)) }}
          kind: implementer
          days: "14"
      - uses: $/actions/qa-store
        id: triage-fix
        with:
          operation: cost-rows
          variables: ${{ toJSON(vars) }}
          secrets: ${{ format('{{"QA_STORE_ROLE_ARN":{0},"QA_STORE_BUCKET":{1}}}', toJSON(secrets.QA_STORE_ROLE_ARN), toJSON(secrets.QA_STORE_BUCKET)) }}
          kind: triage-fix
          days: "14"

  sweep:
    needs: [gate, store]
    # `!cancelled()`, so a store job that FAILED still sweeps, charging every dispatch and
    # saying so, as a failed store read always has. The gate's verdict and the soft skip are
    # still required: a refused or skipped gate skips the sweep.
    if: ${{ !cancelled() && needs.gate.outputs.member == 'true' && needs.gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336). Sized at ~3x the longest real run measured on the reference
    # adopter, so it never truncates work.
    timeout-minutes: 20
    # NO `id-token` AND NO ENVIRONMENT: this job holds no cloud credentials (plan 0004 step 9).
    permissions:
      contents: read
    steps:
      - uses: $/actions/kanon-path

      # The App register (`docs/qa/agent-identities.md`, `K-LAYOUT-6`) is read from the
      # checkout: `SWEEP_LOGIN` and the Implementer's login come from it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mint lead App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
          # Narrowed to what the sweep uses (`K-AGENT-46`): it comments on, labels and
          # re-labels issues, and takes `gate-candidate` off a decided one (`issues`), lists
          # the open pull requests that close them (`pull-requests`), and reads the run behind
          # each cost row, and the run artifacts without a store (`actions`).
          permission-issues: write
          permission-pull-requests: read
          permission-actions: read

      # The one mechanical check on the identity constant (RA-918). A wrong App NAME is
      # otherwise silent and expensive: the login never matches, `isSweep` falls back to the
      # marker alone, and an unknown login counts as a person, so a markerless sweep comment
      # reads as a reply and reaches re-dispatch. `app-slug` is what GitHub derives the
      # comment author's login from, so this compares the constant with the identity minted.
      - name: Assert the minted App is the one the script expects
        env:
          MINTED_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          EXPECTED=$(node -e "import(process.env.KANON + '/scripts/dispatch-sweep.mjs').then(m => console.log(m.SWEEP_LOGIN))")
          if [ "$MINTED_SLUG" != "$EXPECTED" ]; then
            echo "::error title=agent-dispatch-sweep::App slug mismatch — minted '$MINTED_SLUG', the script expects '$EXPECTED'. Rename the App to produce the expected slug, or correct the Lead row's App slug in docs/qa/agent-identities.md, which SWEEP_LOGIN is read from (RA-2701). Left disagreeing, the sweep's identity check is silently off."
            exit 1
          fi
          echo "App slug \`$MINTED_SLUG\` matches SWEEP_LOGIN." >> "$GITHUB_STEP_SUMMARY"

      # No `npm ci`: the script uses only Node's built-in modules and `gh`.
      - name: Reconcile open agent:implement and qa:needs-triage issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The schedule is the automation and applies; a dispatch is a dry run unless ticked.
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply == 'true') && '1' || '' }}
          # Where the cost rows come from (`costRowsSource`): the store job's result and whether
          # the repository has a hook, then each telemetry agent's rows from the hook.
          QA_STORE_RESULT: ${{ needs.store.result }}
          QA_STORE_PRESENT: ${{ needs.store.outputs.present }}
          QA_STORE_COST_ROWS_IMPLEMENTER: ${{ needs.store.outputs.implementer }}
          QA_STORE_COST_ROWS_TRIAGE_FIX: ${{ needs.store.outputs.triage-fix }}
        run: node "$KANON/scripts/dispatch-sweep.mjs"

      # THE GATE-CANDIDATE EXIT (`K-WORK-10`, kanon#171). Not a dispatch, but the same kind of
      # job: an issue-hygiene reconcile on a timer, needing `issues: write` and the Lead's App,
      # which this job already holds, so it rides this schedule rather than adding one. It only
      # removes `gate-candidate` from an issue the Stakeholder already decided: placed on a
      # roadmap milestone, or labelled `gate:declined`. `!cancelled()`: a sweep that failed on
      # the step above is no reason to leave a decided candidate in the Stakeholder's queue.
      - name: Retire gate-candidate on decided issues
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY: ${{ (github.event_name == 'schedule' || inputs.apply == 'true') && '1' || '' }}
        run: node "$KANON/scripts/gate-candidate-exit.mjs"
