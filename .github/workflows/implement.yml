# Kanon builds its own issues with the Implementer (ADR 0011, stage 2).
#
# A trigger-only caller of Kanon's implement lane, written exactly as an adopter writes one
# (docs/lanes.md). It is named `implement.yml` because `agent-implement.yml` is the lane
# itself (K-LAYOUT-18's exception for Kanon's own tree, as for review.yml).
#
# IT CALLS KANON'S LAST RELEASE, NEVER `$/` (ADR 0011's bootstrap). Through `$/` an issue's
# own branch could change the lane that builds it. Dependabot's `kanon` group proposes each
# release here (.github/dependabot.yml, ADR 0011), and `lane-check` (in CI) holds every Kanon
# reference to one version.
#
# It starts on an `agent:implement` label or a dispatch, from a member only: the lane's first
# job is its membership gate (K-AGENT-45), and an issue a stranger filed is never built until
# a member labels it. Any other label skips the run before a token is minted.
#
# THE AUTHOR APP EXISTS (2026-10-05), SO A LABEL NOW RUNS THE MODEL. Don't label an
# issue `agent:implement` until the pin below includes #234: before it, the lane's commits are
# authored `claude[bot]` with no sign-off and fail `dco`. ADR 0011 lists the remaining steps.
#
# The secrets: AUTHOR_APP_ID and AUTHOR_APP_PRIVATE_KEY (the Author App, whose Implementer row is in
# docs/qa/agent-identities.md) and CLAUDE_CODE_OAUTH_TOKEN, mapped by name, never inherited.
name: Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true

# The ceiling for the whole lane: the implement job narrows it to `contents: read`, and the
# crash recovery uses the rest on the default token (its marker comment and label edit, the
# open-PR read, and its own run's start time).
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  implement:
    uses: yedeya-labs/kanon/.github/workflows/agent-implement.yml@v0.38.0
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
