# Verify ACs — the agent's job
#
# The agent's job of `agent-verify-acs.yml`, moved here unchanged apart from its token (kanon#279).
#
# CALLED ONLY BY `verify-acs-run.yml`, beside the job that mints this lane's token. The App's private
# key never enters this job (`K-AGENT-49`): the token arrives hex-encoded as the `app-token`
# secret. `Receive the App token` sits where the mint step was, so the token exists in this job
# from the same point as before, and `Revoke the App token` is the last step. Every other step
# is the lane's, as it was; what it read from the lane's earlier jobs (`needs.*.outputs`) and
# the lane's inputs arrives as inputs of the same name. The lane's header says what the job
# does, and `tests/unit/app-key-isolation.test.ts` holds its token steps to the spine's.
#
# WHAT THE AGENT CAN STILL REACH HERE: the token it was always given, for at most the hour it
# lives, and the Claude token. Rewriting a cached action in this job reaches only those.
name: Verify ACs — the agent's job

on:
  workflow_call:
    inputs:
      project:
        description: "The caller's `project`, passed through: the project tracking-issue number."
        required: false
        type: string
        default: ""
      ref:
        description: "The caller's `ref`, passed through: the tag or SHA to verify."
        required: false
        type: string
        default: ""
      app-slug:
        description: The minted App's slug, from the lane's `mint` job.
        required: true
        type: string
      mint-attempt:
        description: >-
          The run attempt the lane's `mint` job minted the token for. A partial re-run
          ("Re-run failed jobs") reuses that job's outputs, so a token from an earlier
          attempt, which that attempt revoked, is refused by name.
        required: true
        type: string
    secrets:
      app-token:
        description: >-
          The lane's App token, hex-encoded by its `mint` job (a job output holding a masked
          value is dropped). Arrives masked, as every secret does.
        required: true
      claude-token:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336). Actions' default cap is 360m, so a wedged agent
    # burned six hours and left its issue looking mid-flight. Sized at ~3x the
    # longest real run measured on this workflow, so it never truncates work.
    timeout-minutes: 45
    steps:
      # WHEN THE JOB STARTED, for the telemetry row's `timed_out` (plan 0003 §5.1). First, so
      # it is as close to the job's start as a step can be.
      - name: Record when the job started
        id: job
        run: echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BEFORE CHECKOUT, because `ref` decides what gets checked out. On a dispatch the
      # inputs are authoritative; on a label event they are recovered from the QA issue
      # body, which states both — "Verify project #961 on staging" and "The work is
      # deployed in `v0.48.9`".
      #
      # Failing loudly on an unresolvable project is deliberate: the alternative is a
      # job that runs `verify-acs.mjs ""` and reports nothing, which reads as "the
      # project has no criteria" — a green run that verified nothing, which is the one
      # outcome phase 5 exists to prevent.
      - name: Resolve the project and ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_REF: ${{ inputs.ref }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_PROJECT" ]; then
            PROJECT="$DISPATCH_PROJECT"; REF="$DISPATCH_REF"
          else
            BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            PROJECT="$(printf '%s' "$BODY" | sed -n 's/.*[Vv]erify project #\([0-9][0-9]*\).*/\1/p' | head -1)"
            REF="$(printf '%s' "$BODY" | sed -n 's/.*deployed in `\([^`]*\)`.*/\1/p' | head -1)"
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error title=agent-verify-acs::Could not resolve the project from issue #$ISSUE. A QA issue's body must say \"Verify project #<n>\"; without it there is nothing to verify and a green run would claim otherwise."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Verifying project #$PROJECT at \`${REF:-the default branch}\`." >> "$GITHUB_STEP_SUMMARY"

      # The BRIEF must come from the ref under test, not from HEAD: verifying a
      # tag's code against a newer brief's criteria would judge the release by
      # acceptance criteria it never had.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ steps.resolve.outputs.ref || github.ref }}
          fetch-depth: 0

      - name: Say what is being verified, before verifying it
        env:
          REQUESTED: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          {
            echo "| Verifying | |"
            echo "|---|---|"
            echo "| requested ref | \`${REQUESTED:-（default branch）}\` |"
            echo "| resolved to | \`${TAG:-$SHA}\` |"
            # An explicit branch. `${TAG:-x}` is NOT an else for `${TAG:+y}` — it
            # returns $TAG when TAG is set, so the two together printed the tag
            # twice, garbling the one line that says whether this is what the
            # reference environment runs.
            if [ -n "$TAG" ]; then
              echo "| tagged release | \`$TAG\` |"
            else
              echo "| tagged release | **no** — this is not a released commit, so it is not what the reference environment runs |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The scripts are Kanon's, read from the action cache at the tag the caller pinned (plan
      # 0001 §3); the brief and the tests they run are the ref's, from the checkout above.
      # BEFORE the hook, so the project's own toolchain still wins the PATH for its tests, and
      # read from this step's OUTPUT after it, which the hook cannot rewrite as it can
      # `$GITHUB_ENV` (kanon#110).
      - uses: $/actions/kanon-path
        id: kanon

      # THE AGENT-LANE BLOCKS, CALLED DIRECTLY (RA-2661). This lane cannot hand its job to
      # `agent-lane.yml`: the criteria run below must share the agent's workspace and
      # database, and a reusable workflow takes no steps from its caller. So it keeps its
      # own job and calls `agent-setup`, `agent-run` and `agent-finish` around its own
      # steps (the reference adopter's pipeline doc, §6). They are `$/` references (RA-2697): read
      # from the commit that defined this workflow, never from the release tag checked out
      # above, so nothing loads them into the tag's tree and nothing takes them out again.
      #
      # THE PROJECT-SETUP HOOK, FROM THE COMMIT THAT DEFINED THIS LANE (RA-2694, RA-2697). Every
      # other lane reads the hook from its checkout, but this one checks out the ref under
      # test — usually a release tag, and a tag cut before the hook existed has none, which
      # would make every verification of an older release fail. So the hook is loaded from
      # `github.sha` (`fetch-depth: 0` makes it readable whatever was checked out), taken
      # back out before the criteria run, and put back after the agent for its post steps.
      # The commit is recorded for that last step, as the spine's presence check records the
      # one it read from.
      #
      # THIS LOAD OUTLIVES THE BLOCKS' (RA-2697), and it is the hook's own, not a copy of
      # theirs. The blocks moved to `$/` because they are the pipeline's code; the hook is the
      # project's, so it stays a `./` reference, and the only tree a `./` reference can read
      # is the workspace. A `$/` hook would load from the action cache with no step here at
      # all, but only while this lane lives in the repository that holds the hook: once Kanon
      # ships the lane (plan 0001 step 4), `$/` names Kanon, and an older tag would be back to
      # having no hook. Loading it from the defining commit works in both places: in a called
      # workflow `github.sha` is the CALLER's commit, which is the adopter's, with its hook.
      - name: Load the project-setup hook from the commit that defined this lane
        id: hook
        env:
          SHA: ${{ github.sha }}
        run: |
          if ! git checkout "$SHA" -- .github/actions/project-setup; then
            echo "::error title=project-setup hook missing::This lane runs the project's setup from .github/actions/project-setup/action.yml, and $SHA, the commit that defined it, has none."
            echo "kanon-error=hook_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # THE PROJECT'S DATABASE, AS IT DECLARES IT (kanon#18; `agent-lane.yml`'s header). Read
      # from the commit that defined this lane, as the hook is, and for the same reason: the
      # tag under test may predate the declaration. Before the hook, which starts it.
      - uses: $/actions/test-database
        id: database
        with:
          from: ${{ steps.hook.outputs.sha }}

      # The toolchain, `npm ci`, `db:init` and Chromium — the four setup steps this lane ran
      # here before, now the hook's. Against the ref under test: the install and the schema
      # are the tag's own. Chromium's installer is read from `github.sha`, as it was.
      - uses: ./.github/actions/project-setup
        id: project
        with:
          lane: verify-acs
          install: "true"
          database: ${{ steps.database.outputs.database }}
          browsers: "true"

      # `app-slug` IS EMPTY ON PURPOSE: the block reads it only for the push probe, and this
      # lane makes none — so its App token is still minted where it always was, immediately
      # before the agent, after the criteria run.
      - uses: $/actions/agent-setup
        id: setup
        with:
          arm: acceptance-criteria agent
          app-slug: ""
          # The role by name, since there is no slug to look it up by: the Explorer's agent
          # posts as the Explorer App, so its posts open with its header and role marker
          # (plan 0005 §3.3), which `explorerQaComments` will require at L4.
          role: Explorer

      # THE CRITERIA RUN SEES THE REF UNDER TEST, BYTE FOR BYTE. The load above put the
      # defining commit's copy of the hook into the tree, and a project's criteria can be
      # cited by tests that READ `.github/actions/` — a pipeline project's are. Left in
      # place, those tests would judge the tag against `main`'s hook (or, at a tag cut
      # before the hook existed, against files the tag never had). So the tree goes back to
      # exactly what was checked out before anything is verified, and stays that way for
      # the agent: the blocks are `$/` references, which never touch the tree (RA-2697).
      - name: Put the ref under test back exactly as it is, before the criteria run
        run: git restore --source=HEAD --staged --worktree -- .github/actions/project-setup

      # Deterministic producer -> JSON. `continue-on-error` because a FAILING
      # acceptance criterion is the finding, not a broken job: the whole point is
      # to report it, and a hard exit here would leave the Explorer nothing to read.
      - name: Resolve and run the project's acceptance criteria
        id: verify
        continue-on-error: true
        env:
          PROJECT: ${{ steps.resolve.outputs.project }}
          KANON: ${{ steps.kanon.outputs.path }}
        run: |
          set -uo pipefail
          node "$KANON/scripts/verify-acs.mjs" "$PROJECT" --run --json=qa-verify-acs.json | tee -a "$GITHUB_STEP_SUMMARY"

      # NOT swallowed. No artifact means the producer died before writing one, and
      # that is a broken job — reporting "nothing to verify" would be the exact
      # silent-absence this phase exists to avoid, on the artifact that closes a
      # project.
      - name: The artifact must exist
        run: |
          set -euo pipefail
          if [ ! -f qa-verify-acs.json ]; then
            echo "::error title=agent-verify-acs::verify-acs.mjs wrote no artifact — it failed before reporting. This is NOT 'no criteria to verify'."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: qa-verify-acs-${{ steps.resolve.outputs.project }}
          path: qa-verify-acs.json
          if-no-files-found: error

      # THE TOKEN, RECEIVED WHERE IT WAS MINTED (kanon#279, `K-AGENT-49`): `verify-acs-run.yml`'s `mint` job
      # holds the key and mints it; this step decodes and masks it, and the job never sees the key.
      - name: Receive the App token
        id: app-token
        env:
          SEALED: ${{ secrets.app-token }}
          APP_SLUG: ${{ inputs.app-slug }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$'; then
            echo "::error title=app-token::no App token arrived from this lane's mint job; see that job's log for why the mint failed."
            exit 1
          fi
          if [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error title=app-token::this is attempt $RUN_ATTEMPT, but the App token was minted for attempt $MINT_ATTEMPT and revoked when that attempt ended. Use \"Re-run all jobs\", not \"Re-run failed jobs\": the token is minted in a job of its own, and only re-running it mints a fresh one."
            exit 1
          fi
          # Decoded with printf and sed alone, so the step needs nothing the runner may lack.
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          {
            echo "token=$TOKEN"
            echo "app-slug=$APP_SLUG"
          } >> "$GITHUB_OUTPUT"

      # CREATE-BEFORE-APPLY (plan 0005 §5.3, `K-WORK-12`): each label this lane's agent may
      # apply and the repository lacks is created first, with the taxonomy's colour and
      # description, on the agent's own token. A name outside `rulebook/labels.json` fails
      # here by name; an unreadable list or a failed create only warns.
      - name: Create the lane's labels the repository lacks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          KANON: ${{ steps.kanon.outputs.path }}
        run: node "$KANON/scripts/ensure-labels.mjs" agent:explorer qa:needs-triage qa:verify bug signal:spec-violation sev:critical sev:high sev:medium sev:low

      - uses: $/actions/agent-run
        id: agent
        env:
          KANON: ${{ steps.kanon.outputs.path }}
        with:
          prompt: |
            You are the Explorer (Agent 1), in TARGETED-INVARIANT mode for
            project #${{ steps.resolve.outputs.project }}. First read docs/qa/explorer-playbook.md.

            Kanon's `scripts/verify-acs.mjs` has ALREADY RUN. Its results are in
            `qa-verify-acs.json`. Do NOT run it yourself and do NOT run the tier sweep.

            Read that file. Each entry is one acceptance criterion with a status:

              passed            its citing tests ran and passed
              failed            a citing test ran and FAILED
              not-run           a citing test exists but produced no test result here
                                (not executed, or it could not start — e.g. no database)
              unverifiable      no test cites it at all
              mentioned         the brief mentions the ID but did not declare it
              not-an-invariant  no spec declares the ID — a typo or a deletion

            FILE ONE FINDING PER FAILED CRITERION, and nothing for any other status.
            `unverifiable` and `not-run` are NOT findings against the project — they
            are gaps in evidence, and the report already states them. Filing them as
            bugs would send an implementer after work nobody asked for.

            Each finding's body MUST end with this line, and nothing after it:

                <!-- qa:project ${{ steps.resolve.outputs.project }} -->

            That is what makes it a project issue the reconciler will pick up and
            dispatch (RA-1066). Position matters: the marker must be the LAST non-empty
            line, because a document that merely QUOTES it is not a member.

            Each finding's body MUST ALSO contain, verbatim and with its parentheses,
            the text `(targeted-invariant mode)` — the environment field below carries
            it. `lead-reconcile.mjs` reads it to know the finding is this project's own
            work (a failed acceptance criterion), which holds the project open; the
            general sweep uses the same `signal:*` label, so without it the finding is
            read as carried out (RA-1783).

            Before filing, SEARCH open issues for the same criterion and comment on
            the match instead of filing a duplicate. Dedup on the invariant ID: the
            dedup signature is `<ID>::spec-violation::<citing test file>`.

            Follow the playbook's "Targeted-invariant mode" section for the body: the
            area/route field is the invariant ID and its citing test file, the evidence
            is the failing test's name and assertion from the report, and the
            environment is "local build of `<ref>` (targeted-invariant mode) — NOT
            a deployment". Never name the reference environment: nothing here touched a
            deployment.

            Labels: bug, agent:explorer, qa:needs-triage, signal:spec-violation, and a
            sev:* you can justify from the evidence. Milestone: Product Backlog — never a
            roadmap milestone such as the launch gate, which is not a bucket (K-WORK-5).

            COMMENT ON THE QA ISSUE WHEN YOU FINISH, and the comment MUST contain
            this line on its own:

                <!-- qa:verified -->

            That marker is how the reconciler counts verification rounds. It must be
            present even when everything passed and even when you filed nothing —
            without it the two-round bound never binds and you are dispatched again
            every hour, forever (RA-1088). Find the QA issue with:
              gh issue list --repo ${{ github.repository }} --label qa:verify --state open \
                --search "\"qa:project ${{ steps.resolve.outputs.project }}\"" --json number,body \
                --jq "[.[] | select(.body | test(\"<!-- qa:project ${{ steps.resolve.outputs.project }} -->\"))] | .[0].number // empty"

            CLOSE THAT ISSUE ONLY IF EVERY CRITERION PASSED. A `failed`,
            `unverifiable` or `not-run` criterion means the project is not verified;
            leave it open, and the reconciler will re-dispatch you when a finding is
            fixed and deployed.

            SAY WHAT YOU EXAMINED, not only what you filed. Your final message must
            report: the ref verified and whether it was a tagged release, the count
            in every status above, and what you filed or deduped. A run that files
            nothing because everything passed and a run that files nothing because
            nothing was verifiable are DIFFERENT outcomes and must not read alike.

            DO NOT edit code. DO NOT promote a `[seed]` invariant to `[confirmed]` —
            promotion is a human act, and no agent on a project performs one.
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --max-budget-usd 25
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections
          claude-token: ${{ secrets.claude-token }}
          github-token: ${{ steps.app-token.outputs.token }}

      # THE HOOK GOES BACK (RA-2694), for its toolchain's post step — copied verbatim from
      # `agent-lane.yml`, which says why.
      - name: Put the project-setup hook back for its post steps
        if: always() && steps.hook.outputs.sha != ''
        env:
          SHA: ${{ steps.hook.outputs.sha }}
        run: |
          if git checkout "$SHA" -- .github/actions/project-setup 2>/dev/null; then
            echo "project-setup hook put back from $SHA"
          else
            echo "::warning title=agent-lane::could not put the project-setup hook back from $SHA; its post steps may fail"
          fi

      # Explain a red run (RA-1408) and record what it cost (RA-1485), in the finish block.
      # `always()` because a run that FAILED is the one you most want explained and
      # measured; `continue-on-error` because nothing here may red a good agent run
      # (docs/observability.md §8). The classifier speaks only when `job-status` is
      # `failure` — the job-level `failure()` the block cannot evaluate from inside itself.
      # The SAME `claude_args` as the run, so the cost row records the configuration that ran.
      - uses: $/actions/agent-finish
        id: finish
        if: always()
        continue-on-error: true
        with:
          arm: acceptance-criteria agent
          agent: verify-acs
          job-status: ${{ job.status }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --max-budget-usd 25
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections
          execution_file: ${{ steps.agent.outputs.execution_file }}
          started-at: ${{ steps.agent.outputs.started-at }}
          github-token: ${{ steps.app-token.outputs.token }}
          # The version-2 telemetry row (plan 0002 §2.6): this lane's name and each stage's
          # step CONCLUSION in the lane's own order, never a step's name or log.
          lane: verify-acs
          stages: >-
            checkout=${{ steps.checkout.conclusion }}
            hook=${{ steps.hook.conclusion != 'success' && steps.hook.conclusion || steps.project.conclusion }}
            setup=${{ steps.setup.conclusion }}
            token=${{ steps.app-token.conclusion }}
            agent=${{ steps.agent.conclusion }}
          job-started-at: ${{ steps.job.outputs.started-at }}
          timeout-minutes: "45"  # the job's own, held to it by tests/unit/telemetry-schema.test.ts
          kanon-error: ${{ steps.hook.outputs.kanon-error || steps.setup.outputs.kanon-error }}

      # THE TOKEN DIES WITH THE JOB (`K-AGENT-49`). Last, after every step that uses it. It is
      # decoded from the secret again rather than read from `Receive the App token`, so a run that
      # ended before that step (a decline, a failed gate) still revokes the token its mint job
      # minted. Revoking needs only the token itself, never the key. Never reds the run: an
      # earlier attempt's token was revoked by that attempt, and one that expired is refused.
      - name: Revoke the App token
        if: always()
        env:
          SEALED: ${{ secrets.app-token }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          API_URL: ${{ github.api_url }}
        run: |
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$' || [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "No App token of this attempt to revoke"
            exit 0
          fi
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/installation/token" || true)"
          if [ "$STATUS" = "204" ]; then echo "App token revoked"; else echo "::warning title=app-token::the App token could not be revoked (HTTP ${STATUS:-none}); it expires within the hour"; fi
