# The caller of Kanon's agent-merge-reconcile lane, written by `kanon init` (docs/lanes.md). The triggers are yours;
# the rest is the lane's, and `lane-check` holds this file to it.
name: Merge Reconcile (Reviewer)

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to reconcile"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  reconcile:
    uses: yedeya-labs/kanon/.github/workflows/agent-merge-reconcile.yml@candidate-v0.42.0
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      JUDGE_APP_ID: ${{ secrets.JUDGE_APP_ID }}
      JUDGE_APP_PRIVATE_KEY: ${{ secrets.JUDGE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
