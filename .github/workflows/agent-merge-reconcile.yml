# QA pipeline — merge-reconciliation (audit 7, finding 1, proposal 3). A Kanon lane (plan 0001,
# step 3).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:`
# this file at an exact Kanon tag, passes `pr_number` through, and maps the three secrets
# by name (never `secrets: inherit`). The `github` context in a called workflow is the
# caller's, so the filter reads the triggering event exactly as it did when this file held
# the triggers itself.
#
# Closes the fold-in leak. The reviewer playbook promises a fallback `follow-up`
# issue when a fold-in suggestion (or a CHANGES_REQUESTED finding) isn't applied
# before merge — but nothing re-triggers the reviewer once the PR merges, so that
# fallback structurally can't fire (leaked RA-244, RA-254, and RA-293, whose reviews
# landed 3–4 min AFTER the merge). This workflow is that re-trigger.
#
# Fires on BOTH: a PR merging, and a review that lands on an ALREADY-merged PR
# (the RA-293 race). It re-reads the latest review, checks the merged code + issue
# tracker, and files the fallback follow-up for anything actionable that is both
# un-applied and un-tracked.
#
# Identity: the Judge App, minted for the Reviewer — this IS the reviewer's promised fallback.
# Proposes only — never fixes/merges/reopens/closes.
#
# INERT until: the caller is on the default branch + the Judge App installed, with the
# Reviewer's row in the App register + these secrets (plan 0001 §8):
#   JUDGE_APP_ID, JUDGE_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY
# KANON ROLE: Reviewer
# The line above is read by `lane-check` and the token-permission test (plan 0005 §3.5): the
# role this lane mints for, as the Judge App's `JUDGE_APP_*` secrets no longer say. Its row
# in the App register must exist, and this lane's tokens fit inside that role's row.
# ONE OF SECRETS: CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY
# The line above is read by `lane-check` and the requirements file (plan 0009 §10): the Claude
# credential, the subscription token or an Anthropic API key. A caller maps exactly one, and
# `agent-run` refuses both or neither, by name, before the agent starts.
# CALLER NAME: Merge Reconcile (Reviewer)
# CALLER JOB: reconcile
# The # lines above are read by `lane-check`, `kanon init` and doctor (kanon#728). GitHub reports a
# called lane's checks under its caller's name, and its calling job's id (`<job id> / <job>`),
# and `merge-gate.mjs` tells this lane's checks from the rest by them (`REVIEW_EVENT_CHECKS` in
# `scripts/lib/protocol-spellings.mjs`, which a test holds these lines to): under another name or job id
# the Merger waits on them. A caller that differs is a `::warning` until the Kanon release
# `FAILS_FROM` names in `actions/lane-check/caller-names.mjs`, and a failure from it.
name: Merge Reconcile (Reviewer)

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   pull_request: [closed]
#   pull_request_review: [submitted]
#   workflow_dispatch             — input `pr_number` (required)
on:
  workflow_call:
    # The caller's `workflow_dispatch` input, passed through. Empty on the other two
    # triggers, which carry no inputs, so it is not required here.
    inputs:
      pr_number:
        description: Merged PR number to reconcile
        required: false
        type: string
        default: ""
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      JUDGE_APP_ID:
        required: true
      JUDGE_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

concurrency:
  # Per-PR, and DON'T cancel in progress: a merge-close run and a later
  # review-submitted run may surface different findings, so let them queue.
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: qa-merge-reconcile-${{ github.event.pull_request.number || inputs.pr_number }}${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false
  # EVERY PENDING RUN IS KEPT (kanon#552, as the rebase lane since kanon#537). A run joins
  # this group before any job-level `if:` can skip it, and under the default `queue: single`
  # an arrival cancels the group's one pending run. Here the runs that only skip come from every
  # review submitted on a pull request that is still open, and a pull request closed unmerged.
  # `queue: max` keeps up to 100 pending, in order, and a skip-only run drains in seconds. GitHub
  # refuses it with `cancel-in-progress: true`, which this lane never sets.
  queue: max

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). The caller's job holds the
# ceiling and must grant at least this, or the run fails to start; `lane-check` fails a
# caller that grants less.
permissions:
  contents: read
  # The filter job reads PR merged-state + reviews with the default github.token
  # via `gh pr view --json mergedAt,reviews` (a GraphQL PR read). A permissions
  # block sets every unlisted scope to `none`, so this is required — without it
  # `pull-requests: none` makes that read 403, the `|| true` swallows it, and the
  # gate skips every run (the reconciler would be permanently inert). The reconcile
  # job's Issues:write comes from the reviewer App token, not from here.
  pull-requests: read

jobs:
  # Cheap gate: authoritative merged-state + has-reviews check via `gh`. The PR
  # object on a `pull_request_review` payload doesn't reliably carry `merged`, so
  # every path that DECIDES TO RECONCILE defers to this `gh` read rather than to the
  # event payload. Since RA-2596 the payload is read for the opposite purpose — to prove
  # there is nothing to reconcile before a runner starts. See the `if:` below.
  filter:
    # ── A NO-OP MUST NOT COST A BILLED MINUTE (RA-2596) ──────────────────────────
    #
    # `pull_request_review` is repo-wide, and Actions rounds every job UP to a whole
    # minute, so a two-second `filter` step costs a full minute exactly as a
    # sixty-second one does. Measured Sept 1-27 2026: this job ran 1,105 times for
    # 1,106 billed minutes, 755 of them review events, against 278 reconciles. The
    # vast majority were a runner started to learn something the payload had already
    # said. `agent-implement-revise.yml` skips 1,186 runs for free through its own
    # job-level `if:`; this is the same move.
    #
    # IT SKIPS ONLY ON POSITIVE EVIDENCE, so it cannot make this arm inert. `state` is
    # read to prove the PR is OPEN — the one payload the step below ALWAYS declines
    # ("PR not merged — the normal review flow owns it") — and never to decide that a
    # reconcile is warranted. An absent or unexpected `state` is not `'open'`, so the
    # job runs and the `gh` read decides, exactly as before. `merged` is deliberately
    # NOT consulted: it is one of the fields the simple PR object on this event omits,
    # which is what the comment above is about.
    #
    # THE RA-293 RACE SURVIVES, which matters because it is why this workflow exists: a
    # review landing 3-4 minutes AFTER the merge carries `state: closed` and still
    # runs. The INVERSE race — a review seconds BEFORE the merge, so its payload says
    # `open` — is covered by the `pull_request: closed` arm, whose run reads EVERY
    # review on the PR rather than only the triggering one.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_review'
          && github.event.pull_request.state != 'open')
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336). Actions' default cap is 360m, so a wedged agent
    # burned six hours and left its issue looking mid-flight. Sized at ~3x the
    # longest real run measured on this workflow, so it never truncates work.
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      # THE MEMBERSHIP GATE COMES FIRST (K-AGENT-45, kanon#46), before any token is minted:
      # this lane acts only when the event's actor is a member or a registered agent App.
      # `scripts/lane-gate.mjs` says who the actor is for each event; a refusal leaves
      # `member=false`, a notice and a step-summary line, and every later step and job skips.
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"
      - name: Decide whether to reconcile
        if: steps.gate.outputs.member == 'true'
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          skip() { echo "run=false" >> "$GITHUB_OUTPUT"; echo "→ skip ($1)"; exit 0; }
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          STATE="$(gh pr view "$PR" --repo "$REPO" --json mergedAt,reviews,headRefOid 2>/dev/null || true)"
          [ -z "$STATE" ] && skip "could not read PR $PR"
          MERGED="$(printf '%s' "$STATE" | jq -r '.mergedAt // empty')"
          [ -z "$MERGED" ] && skip "PR not merged — the normal review flow owns it"
          NREVIEWS="$(printf '%s' "$STATE" | jq '.reviews | length')"
          [ "$NREVIEWS" = "0" ] && skip "merged PR has no reviews to reconcile"

          # NOTHING DECLARED OPEN, NOTHING TO RECONCILE (kanon#177). About 4 in 5 runs of this
          # lane filed nothing (reference adopter, 242 runs over three weeks), each a full
          # model pass re-reading reviews to conclude what the Reviewer already knew. The
          # review prompt has him end every verdict with `<!-- qa:open-items N -->`: the
          # actionable items raised, this round or carried over, that are neither applied
          # nor filed. When every review on the PR is a Reviewer verdict, and the latest was
          # read on the merged head and declares 0, the model is not run, and the step summary
          # names the verdict that decided it. The latest decides: its count includes what
          # earlier rounds left neither applied nor filed.
          #
          # IT FAILS OPEN, and the decision is `scripts/merge-reconcile-gate.mjs`'s, which
          # says each case: a review that is not the Reviewer's (a person's, another App's,
          # the Judge App's without the Reviewer's role marker), no Reviewer verdict, a
          # latest Reviewer verdict with no marker, a garbled one or a count above 0, a commit
          # after it, an unknown head or Reviewer, or an unreadable answer all run
          # the model as before. The Reviewer's login is the App register's, read from the
          # default branch (`K-LAYOUT-6`) so a PR cannot choose whose count is trusted; an
          # unreadable register leaves it unknown, which runs the model. A review landing
          # after the merge re-runs this step on its own event, so it is read by the same rule.
          REGISTER="$(gh api "repos/$REPO/contents/docs/qa/agent-identities.md" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)"
          GATE="$(printf '%s' "$STATE" | REGISTER="$REGISTER" node "$KANON/scripts/merge-reconcile-gate.mjs" 2>/dev/null || true)"
          WHY="$(printf '%s' "$GATE" | jq -r '.why // empty' 2>/dev/null || true)"
          if [ "$(printf '%s' "$GATE" | jq -r '.skip == true' 2>/dev/null || true)" = "true" ]; then
            printf '%s\n' "$GATE" | jq -r '.summary' >> "$GITHUB_STEP_SUMMARY"
            skip "$WHY"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "→ reconcile PR $PR ($NREVIEWS reviews; ${WHY:-the open-items gate gave no answer})"

  # THE LANE'S RUN, AS A CALLED WORKFLOW (kanon#279, `K-AGENT-49`). `merge-reconcile-run.yml` mints the
  # token in a job that holds the key and runs nothing else, then hands it to the agent's job
  # (`merge-reconcile-agent-job.yml`). Both sit inside this job's scope, so the mint waits
  # with the agent: a token minted before the wait could expire under it.
  reconcile:
    needs: filter
    if: needs.filter.outputs.run == 'true'
    uses: $/.github/workflows/merge-reconcile-run.yml
    with:
      pr: ${{ needs.filter.outputs.pr }}
    secrets:
      app-id: ${{ secrets.JUDGE_APP_ID }}
      app-private-key: ${{ secrets.JUDGE_APP_PRIVATE_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
