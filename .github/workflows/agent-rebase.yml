# QA pipeline — Agent 2 (the Implementer), MODE: resolve-conflict. RA-2150. A Kanon lane
# (plan 0001, step 5).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:`
# this file at an exact Kanon tag, passes `pr_number` through, and maps the three secrets
# by name (never `secrets: inherit`). The `github` context in a called workflow is the
# caller's, so the filter reads the finished CI run exactly as it did when this file held
# the triggers itself.
#
# Resolves the merge conflict on a pipeline PR, so that CI and revise — both
# `pull_request`-triggered, and undispatched while a PR conflicts — and the review that
# follows CI can resume. (Review's LABEL trigger is `pull_request_target` since RA-2299 and
# does fire on a conflicting PR, but its run defers without CI on the head; RA-2302.)
#
# ── WHY NOT A LABEL, AND WHY NOT A SCRIPT ───────────────────────────────────
# Both were tried and both are recorded in Kanon's `scripts/rebase-lane.mjs` header. In
# short: GitHub dispatches no `pull_request` event for a conflicting PR (RA-1722), so the
# label churn every other re-delivery here uses cannot reach these PRs at all; and
# `git merge` has already auto-resolved everything resolvable, so what remains is by
# definition a judgement and a script cannot make it (RA-2164's review measured this).
#
# ── THE TRIGGER IS THE EVENT THAT CREATES THE CONDITION ─────────────────────
# A merge to `main` is the only thing that makes an already-open PR conflict, and CI
# completing on `main` is how this repo observes one (`agent-merge.yml` measured that
# trigger at 12-37x/day). Through a MERGE QUEUE that run is the queue's push, whose actor is
# `github-merge-queue[bot]`, which the gate turns away (kanon#79); `merge_group` fires before
# `main` moves. So the caller also starts the lane on the merged pull request itself
# (`pull_request_target` `closed` on `main`, kanon#484), judged by `merged_by`, the member
# who merged or queued it. Without a queue a merge starts both; the second run finds the
# first one's attempt markers and hands the agent nothing new. The cron is a FLOOR: the only
# states it adds are ones no `main` merge caused, such as a human clearing `needs:human`.
#
# ── WHY `pull_request_target` IS SAFE HERE (kanon#484) ──────────────────────
# It runs with the base's secrets on any pull request, a fork's included, so the lane takes
# nothing from the closed pull request but the fact of its merge and who merged it:
#   · the filter admits a `closed` event only when `merged` is true and the base is the
#     default branch, and the gate judges `merged_by` alone and refuses an unmerged close,
#     so a fork's author closing their own pull request starts nothing;
#   · no step reads the pull request's head, title, body or branch. Every checkout here and
#     in `rebase-agent-job.yml` takes no `ref`, which on this event is the default branch;
#     the PRs it resolves come from its own `gh pr list` of open PRs, each the Implementer
#     App's and carrying its status (`rebase-lane.mjs`, `ineligible`), never the closed one;
#   · the workflow that runs is the caller on the default branch and this lane at the
#     caller's pinned tag; the pull request can change neither.
#
# ── COST ────────────────────────────────────────────────────────────────────
# The FILTER job is a `gh pr list` and exits in seconds; it opens no database
# connection, so its schedule wakes no database. An agent session runs
# only when a PR actually conflicts AND has not been attempted on that head — measured
# population: 2 PRs have ever reached the un-startable state. `MAX_PER_RUN` caps a bad
# day at three sessions.
#
# INERT until: the caller is on the default branch + the Author App installed, with the
# Implementer's row in the App register + these secrets (plan 0001 §8):
#   AUTHOR_APP_ID, AUTHOR_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN
# KANON ROLE: Implementer
# The line above is read by `lane-check` and the token-permission test (plan 0005 §3.5): the
# role this lane mints for, as the Author App's `AUTHOR_APP_*` secrets no longer say. Its row
# in the App register must exist, and this lane's tokens fit inside that role's row.
name: Rebase lane (Implementer)

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   workflow_run: CI, [completed], branches [main]
#   pull_request_target: [closed], branches [main]   — a merged pull request (kanon#484)
#   schedule: "17 5 * * *"   — the daily floor; clear of every other agent cron
#   workflow_dispatch        — input `pr_number` (optional: a single PR; blank = every open PR)
on:
  workflow_call:
    # The caller's `workflow_dispatch` input, passed through. Empty on the other triggers,
    # and blank means every open PR, so it is not required here.
    inputs:
      pr_number:
        description: A single PR to consider (blank = every open PR)
        required: false
        type: string
        default: ""
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  # One global lane, never cancelled: cancelling mid-resolution leaves a branch with a
  # half-finished merge and an attempt marker already posted.
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: qa-rebase-lane${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). The caller's job holds the
# ceiling and must grant at least this and the jobs' own blocks below, or the run fails to
# start; `lane-check` fails a caller that grants less.
permissions:
  contents: read # the App token carries the real write scope

jobs:
  # CHEAP GATE, on the default token. A `main` merge that conflicts with nothing — the
  # overwhelmingly common case — costs one `gh pr list` and stops here, before any App
  # token, database or agent session exists.
  filter:
    # A CANCELLED CI run on `main` is a superseded one and the push that superseded it
    # fires its own. A skipped job bills ~no Actions minutes, which matters because a
    # third of `main`'s CI runs are cancelled.
    #
    # AND ONLY THE CALLER'S FOUR TRIGGERS. When this file held its triggers, no other event
    # could reach it; as a called workflow it runs on whatever its caller is called on, so
    # the job names them (Kanon's smoke calls it on pull requests, which must not reach the
    # PR-listing script with a token). A `pull_request_target` only as a merge into the
    # default branch: an unmerged close, and a merge into another branch (a stacked pull
    # request's base, which its author can write), skip here, whatever the caller's filter.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion != 'cancelled')
      || (github.event_name == 'pull_request_target'
        && github.event.action == 'closed'
        && github.event.pull_request.merged == true
        && github.event.pull_request.base.ref == github.event.repository.default_branch)
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A JOB BLOCK REPLACES THE WORKFLOW BLOCK WHOLESALE — it does not merge into it —
    # so the workflow-level `contents: read` above leaves every other scope at `none`
    # for this job unless it is restated here. `scripts/rebase-lane.mjs` reads PRs on
    # `github.token`, and a missing scope does NOT error: `gh` prints the 403 body to
    # STDOUT, so the value reads as DATA and the matrix below would be fed an error
    # message (RA-956, RA-1013, RA-1087, RA-1090). The reference adopter's `permissions-guard.mjs`
    # catches exactly this, and caught it here.
    # `actions: read` for the RA-2519 retry: `rebase-lane.mjs` reads a failed attempt's
    # jobs (`repos/{repo}/actions/runs/{id}/jobs`) to learn whether it died of its cause.
    # Denied, the read is "unknown" and nothing is retried — the pre-RA-2519 behaviour —
    # so a missing scope here fails quiet, which is why it is stated rather than assumed.
    # `statuses: read` for the implementer-status chain (plan 0005 §3.3, step L4):
    # `rebase-lane.mjs` refuses a conflicting PR whose head lacks the Author App's
    # `kanon/role: implementer` status, and an unread list refuses too.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      member: ${{ steps.gate.outputs.member }}
      prs: ${{ steps.decide.outputs.prs }}
      heads: ${{ steps.heads.outputs.heads }}
    steps:
      # THE MEMBERSHIP GATE COMES FIRST (K-AGENT-45, kanon#46), before any token is minted:
      # this lane acts only when the event's actor is a member or a registered agent App.
      # `scripts/lane-gate.mjs` says who the actor is for each event — on a finished CI run,
      # whoever pushed the commit it ran on; on a merged pull request, whoever merged or
      # queued it; on the schedule, whoever last changed it — and
      # a refusal leaves `member=false`, a notice and a step-summary line, and every later
      # step and job skips.
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.member == 'true'

      - name: Which conflicting PRs is this lane's to resolve?
        id: decide
        if: steps.gate.outputs.member == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # stdout is the machine half (a JSON array of PR numbers), stderr the report.
          PRS="$(node "$KANON/scripts/rebase-lane.mjs" ${PR:+--pr "$PR"})"
          # NOT SWALLOWED. `set -e` plus the assignment fails the step on a denied read,
          # and an empty answer is not an empty array — reading one as "nothing to do"
          # would leave every conflicting PR unresolved, silently and green.
          if [ -z "$PRS" ]; then
            echo "::error title=agent-rebase::the lane printed no decision at all. Refusing to read that as \"no PR conflicts\"."
            exit 1
          fi
          # AND IT MUST BE AN ARRAY. The failure this guards is the one above's sibling:
          # a denied scope makes `gh` print a 403 BODY to stdout, which is non-empty, so
          # the emptiness check passes and `fromJson` downstream receives prose. Assert
          # the shape rather than trusting that a value arrived.
          if ! printf '%s' "$PRS" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error title=agent-rebase::the lane printed something that is not a JSON array: $PRS"
            exit 1
          fi
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"

      # EACH PR'S HEAD BEFORE THE AGENT RUNS (plan 0005 §3.3, step L3): where the implementer
      # status's chain must start for `implementer-status` to carry it to the resolved head. In
      # this job because no agent has run yet. `continue-on-error`: a failed read must not stop
      # the lane, and the status job then carries nothing and says why.
      - name: Record each PR's head before the agent runs
        id: heads
        if: steps.gate.outputs.member == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.decide.outputs.prs }}
        run: |
          set -euo pipefail
          heads='{}'
          for pr in $(jq -r '.[]' <<<"$PRS"); do
            sha="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            heads="$(jq -c --arg pr "$pr" --arg sha "$sha" '. + {($pr): $sha}' <<<"$heads")"
          done
          echo "heads=$heads" >> "$GITHUB_OUTPUT"

  # ONE PR'S RESOLUTION PER MATRIX ENTRY, AS A CALLED WORKFLOW (kanon#279, `K-AGENT-49`).
  # `rebase-run.yml` mints this PR's token in a job that holds the key and runs nothing else,
  # then hands it to the agent's job (`rebase-agent-job.yml`). Per entry, not once for the
  # run: entries run one at a time for up to 90 minutes each, and a token lives an hour, so
  # a token minted once would expire under the second PR. A matrix job's outputs keep only
  # one entry's value, so the mint cannot be a matrix job of this file either.
  resolve:
    needs: filter
    # The gate's verdict FIRST: a refused event leaves `prs` empty, and `'' != '[]'` is
    # true, so without it the matrix would be handed nothing to parse.
    if: needs.filter.outputs.member == 'true' && needs.filter.outputs.prs != '[]'
    strategy:
      # ONE AT A TIME. Each is a full agent session, and a `main` merge that conflicts
      # with several PRs at once is exactly when a bad resolution would be repeated
      # before anyone read the first.
      max-parallel: 1
      # `fail-fast: false` — one PR whose conflict the agent cannot settle must not
      # cancel the resolution of an unrelated one.
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.filter.outputs.prs) }}
    # THE DEFAULT TOKEN'S SCOPE FOR THE FINISH BLOCK (RA-2659). `agent-finish` hands
    # `pr-number` to `agent-telemetry`, which reads the PR's diff size with `github.token`.
    # Under the workflow-level `contents: read` alone that read 403s and the row records
    # the size as unknown — silently, since the step swallows it. The App token carries
    # every write this job makes; this grants the default token one read and nothing else.
    # `tests/unit/direct-block-lane.test.ts` holds every block-calling job that passes a PR to it.
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/rebase-run.yml
    with:
      pr: ${{ matrix.pr }}
    secrets:
      app-id: ${{ secrets.AUTHOR_APP_ID }}
      app-private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # THE IMPLEMENTER STATUS IS A CHAIN (plan 0005 §3.3, question 6; step L3). A fixed job after
  # the agent's, never the agent, one per PR the lane resolved: it moves `kanon/role:
  # implementer` to the resolved head only when the head recorded before the agent ran carried
  # one created by the Implementer's App, and every commit on the first-parent path between
  # them is the App's (the merge's second parent is the default branch). Otherwise it sets
  # none and says why. It never reds the lane. Since L4 the Merger requires the status, and this
  # lane's filter refuses a pull request whose head lacks it (`rebase-lane.mjs`, `ineligible`).
  implementer-status:
    needs: [filter, resolve]
    if: ${{ !cancelled() && needs.filter.outputs.member == 'true' && needs.filter.outputs.prs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.filter.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/actions/kanon-path
      - uses: $/actions/implementer-status
        continue-on-error: true
        with:
          mode: carry
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          app-private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
          pr: ${{ matrix.pr }}
          start-head: ${{ fromJson(needs.filter.outputs.heads || '{}')[format('{0}', matrix.pr)] }}
