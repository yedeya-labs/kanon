# Kanon's release mechanism (K-SHIP-7), as a reusable workflow. Every adopter releases
# the same way by calling it from a thin workflow on push to its main branch, pinned to
# an exact Kanon version (K-ADOPT-11). Kanon calls it itself, by local path, from
# release-please.yml. Adopter usage and the one-time settings: docs/release.md.
#
# What it does, in order:
#   1. Guard (K-SHIP-3). Fails unless the calling repository squash-merges only, with the
#      PR title as the commit subject and the PR body as its message. A merge commit's
#      subject ("Merge pull request #2 ...") is not a conventional commit, so
#      release-please can't version it: on 2026-09-29 Kanon's first PR merged that way.
#   2. release-please v5, with the calling repository's own release-please-config.json
#      and .release-please-manifest.json. Every merge updates the release PR; merging
#      the release PR tags vX.Y.Z and publishes the GitHub Release.
#   3. If release-please fails, says whether GitHub refused to let Actions open the
#      release PR, and names the two settings that allow it, organisation first.
#   4. After a release, creates or moves the major tag (v0, later v1, ...) to the
#      released commit. Adopters still pin an exact version; the major tag is a
#      convenience, not the supported form.
#   5. Guard (#73). Fails, and comments on the release PR, when the open release PR
#      changes anything but version strings outside the changelog, the manifest and the
#      files its release type owns (`node`: package.json and package-lock.json; `simple`:
#      its version file, version.txt by default; `python`: changelog.json). The release type
#      is the adopter's, for its language; unset, it is release-please's default, `node`.
#      In its `extra-files`, and in any other file it
#      modifies, only a line whose sole change is a version may differ, and it may add,
#      remove or rename no file. Release PRs run no CI and merge through the admin
#      bypass, so on 0.10.0 a release PR built from stale `extra-files` reverted #67's
#      documentation (db99870) and nothing noticed.
#
# No inputs, no secrets, by ADR 0002 ("standardise, don't parameterise"). Each candidate
# was checked and rejected:
#   - config and manifest paths: fixed file names at the repository root, the same in
#     every adopter, so a guard can find them without reading a setting;
#   - the release branch: release-please targets the repository's default branch, which
#     is where the caller's push trigger fires;
#   - release type, package name, changelog sections: already per-repository, in the
#     adopter's own release-please-config.json, which is data this workflow reads;
#   - a token: the workflow's own token is the only one until a release App exists.
# The calling repository is the only thing that differs, and GitHub already supplies it.
#
# Permissions. The calling job grants exactly contents: write and pull-requests: write,
# and the job below asks for no more. The guard's read of the repository settings rides
# on contents: write: measured on 2026-09-30, GET /repos/{owner}/{repo} returns the
# merge-settings fields to a workflow token only when it can push. With metadata or
# contents: read alone they come back null or absent, and the guard then fails closed,
# saying it could not read them, instead of passing.
#
# The guard and the failure explanation are inline scripts (shell: node {0}) rather than
# a composite action, because a reusable workflow can't reach its own repository's files
# at its own ref: `uses: ./...` resolves against the caller's checkout, `uses:` takes no
# expressions, so an action pinned here would name a hard-coded tag (the previous
# release, or none yet), and an adopter's token can't check out Kanon while it is
# private. Inline, the guard is in the same file as the job, at the ref the adopter
# pinned, by construction. The unit tests run these exact scripts against fixtures.
#
# Known limits, all accepted while Kanon has no release App:
#   - a PR opened with the workflow token triggers no workflows, so the release PR runs
#     no CI. It may change only the changelog, the version, the manifest and the version
#     strings in the `extra-files`, which step 5 checks;
#   - releases pool into the release PR, which a human merges, so during bootstrap a
#     merge doesn't produce a release by itself, as K-SHIP-7 asks;
#   - the release tag, pushed with the same token, triggers no tag-driven workflow.
name: Release

on:
  workflow_call:

permissions: {}

jobs:
  release:
    name: Release PR, tag and major tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: kanon-release
      cancel-in-progress: false
    steps:
      - name: Check the merge settings (K-SHIP-3)
        id: merge-settings
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');

          const repo = process.env.GITHUB_REPOSITORY;
          const expected = {
            allow_squash_merge: true,
            allow_merge_commit: false,
            allow_rebase_merge: false,
            squash_merge_commit_title: 'PR_TITLE',
            squash_merge_commit_message: 'PR_BODY',
          };
          const fix =
            `Settings -> General -> Pull Requests: allow squash merging only, with "Pull request title and description" as the default commit message. Or:\n` +
            `  gh api -X PATCH repos/${repo} -F allow_squash_merge=true -F allow_merge_commit=false -F allow_rebase_merge=false -f squash_merge_commit_title=PR_TITLE -f squash_merge_commit_message=PR_BODY`;
          const fail = (title, detail) => {
            console.log(`::error title=${title}::${detail.split('\n')[0]}`);
            console.error(detail);
            process.exit(1);
          };

          let settings;
          try {
            settings = JSON.parse(execFileSync('gh', ['api', `repos/${repo}`], { encoding: 'utf8' }));
          } catch (error) {
            fail('Merge settings unreadable', `The merge-settings guard could not read repos/${repo}: ${String(error.message).trim()}`);
          }

          const missing = Object.keys(expected).filter((key) => settings[key] === undefined || settings[key] === null);
          if (missing.length > 0) {
            fail(
              'Merge settings unreadable',
              `The merge-settings guard could not read ${missing.join(', ')} from repos/${repo}, so it can't tell whether this repository squash-merges with the PR title and body (K-SHIP-3).\n` +
                'GitHub returns these fields to a workflow token only when it can push: grant contents: write to the job that calls the release workflow.',
            );
          }

          const wrong = Object.entries(expected).filter(([key, value]) => settings[key] !== value);
          if (wrong.length > 0) {
            fail(
              'Merge settings break releases',
              `This repository's merge settings break releases (K-SHIP-3): release-please versions only squash commits whose subject is the PR title.\n` +
                wrong.map(([key, value]) => `  ${key} is ${JSON.stringify(settings[key])}, must be ${JSON.stringify(value)}`).join('\n') +
                `\nFix: ${fix}`,
            );
          }

          console.log(`Merge settings OK: squash only, with the PR title as subject and the PR body as message.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `started=${new Date().toISOString()}\n`);

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Explain a failed release
        if: failure() && steps.release.conclusion == 'failure'
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.merge-settings.outputs.started }}
        run: |
          const { execFileSync } = require('node:child_process');

          const repo = process.env.GITHUB_REPOSITORY;
          const org = process.env.GITHUB_REPOSITORY_OWNER;
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));

          // release-please pushes its release branch before it opens the release PR. So a
          // release branch updated during this run with no open PR means GitHub refused
          // to let the workflow token open one.
          let refused = false;
          try {
            const since = Date.parse(process.env.STARTED ?? '') - 2 * 60 * 1000;
            const open = new Set(api(`repos/${repo}/pulls?state=open&per_page=100`).map((pr) => pr.head.ref));
            for (const ref of api(`repos/${repo}/git/matching-refs/heads/release-please--`)) {
              if (open.has(ref.ref.replace('refs/heads/', ''))) continue;
              const date = Date.parse(api(`repos/${repo}/commits/${ref.object.sha}`).commit.committer.date);
              if (date >= since) refused = true;
            }
          } catch (error) {
            console.error(`Could not diagnose the failure: ${String(error.message).trim()}`);
          }

          const settings =
            'Turn on "Allow GitHub Actions to create and approve pull requests" in both places, organisation first:\n' +
            `  1. Organisation ${org}: Settings -> Actions -> General -> Workflow permissions. While it is off there, the repository's checkbox is greyed out.\n` +
            `     gh api -X PUT orgs/${org}/actions/permissions/workflow -F can_approve_pull_request_reviews=true\n` +
            `  2. Repository ${repo}: Settings -> Actions -> General -> Workflow permissions.\n` +
            `     gh api -X PUT repos/${repo}/actions/permissions/workflow -F can_approve_pull_request_reviews=true\n` +
            'Then re-run this workflow.';
          if (refused) {
            console.log('::error title=GitHub Actions may not create pull requests::release-please pushed its release branch, but GitHub refused to let this workflow open the release PR.');
            console.error(`release-please pushed its release branch, but GitHub refused to let this workflow open the release PR.\n${settings}`);
          } else {
            console.log('::error title=release-please failed::release-please failed; its log is in the step above.');
            console.error(`release-please failed; its log is in the step above.\nIf that log says "GitHub Actions is not permitted to create or approve pull requests":\n${settings}`);
          }
          process.exit(1);

      - name: Move the major tag to the released commit
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v$MAJOR"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          fi
          echo "Moved $TAG to $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a release PR that changes more than version strings
        id: release-pr-guard
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          const { execFileSync } = require('node:child_process');
          const { posix } = require('node:path');
          const { mkdtempSync, writeFileSync } = require('node:fs');
          const { tmpdir } = require('node:os');

          const repo = process.env.GITHUB_REPOSITORY;
          const gh = (args) => execFileSync('gh', args, { encoding: 'utf8' });
          const api = (path) => JSON.parse(gh(['api', path]));
          const pages = (path) => JSON.parse(gh(['api', '--paginate', '--slurp', path])).flat();

          // release-please's generic updater rewrites the version on a line and nothing else,
          // so a line that differs once every version on it is blanked out is not its work.
          const SEMVER = /\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/g;
          const blank = (line) => line.replace(SEMVER, '<version>');
          const at = (pkg, file) => posix.normalize(file.startsWith('/') ? file.slice(1) : posix.join(pkg, file));
          // Per release type, the files the guard doesn't read, because release-please may
          // change more than a version on a line there: `node`'s package.json and lockfile, and
          // the changelog.json `python` updates when one exists. `simple`'s version file is
          // added below, because its config can rename it. Kept to the types docs/release.md
          // offers; any other type gets the version-only rule everywhere.
          const WHOLE_FILES = {
            node: ['package.json', 'package-lock.json'],
            python: ['changelog.json'],
            go: [],
            rust: [],
            simple: [],
          };

          // The changed lines of one file's patch that are not a version-string change.
          const offending = (patch) => {
            const bad = [];
            let removed = [];
            let added = [];
            const flush = () => {
              for (let i = 0; i < Math.max(removed.length, added.length); i++) {
                const was = removed[i];
                const now = added[i];
                if (was === undefined || now === undefined || blank(was) !== blank(now)) {
                  if (was !== undefined) bad.push(`-${was}`);
                  if (now !== undefined) bad.push(`+${now}`);
                }
              }
              removed = [];
              added = [];
            };
            for (const line of patch.split('\n')) {
              if (line.startsWith('\\')) continue;
              if (line.startsWith('-')) {
                if (added.length > 0) flush();
                removed.push(line.slice(1));
              } else if (line.startsWith('+')) added.push(line.slice(1));
              else flush();
            }
            flush();
            return bad;
          };

          const releasePrs = pages(`repos/${repo}/pulls?state=open&per_page=100`).filter(
            (pr) => pr.head.ref.startsWith('release-please--') && pr.head.repo?.full_name === repo,
          );
          if (releasePrs.length === 0) {
            console.log('No open release PR to check.');
            process.exit(0);
          }

          let failed = false;
          for (const pr of releasePrs) {
            const raw = api(`repos/${repo}/contents/release-please-config.json?ref=${pr.head.sha}`);
            const config = JSON.parse(Buffer.from(raw.content, 'base64').toString('utf8'));
            const versionFiles = new Set(['.release-please-manifest.json']);
            const extraFiles = new Set();
            for (const [path, pkg] of Object.entries(config.packages ?? {})) {
              versionFiles.add(at(path, pkg['changelog-path'] ?? config['changelog-path'] ?? 'CHANGELOG.md'));
              // The files release-please rewrites wholesale for the package's release type,
              // which the version-only rule below can't judge. release-please's own default
              // type is `node`, so an unset type is read as `node`. Every other release type's
              // version files (pyproject.toml, Cargo.toml, Cargo.lock, __init__.py, ...) are
              // held to the version-only rule, so Kanon names no language's files beyond these.
              const type = pkg['release-type'] ?? config['release-type'] ?? 'node';
              for (const file of WHOLE_FILES[type] ?? []) versionFiles.add(at(path, file));
              // `simple` keeps its version in `version-file`, version.txt unless the config names another.
              if (type === 'simple') versionFiles.add(at(path, pkg['version-file'] ?? config['version-file'] ?? 'version.txt'));
              for (const entry of [...(config['extra-files'] ?? []), ...(pkg['extra-files'] ?? [])]) {
                extraFiles.add(at(path, typeof entry === 'string' ? entry : entry.path));
              }
            }

            const problems = [];
            for (const file of pages(`repos/${repo}/pulls/${pr.number}/files?per_page=100`)) {
              if (versionFiles.has(file.filename)) continue;
              // Any other modified file is held to the same version-only rule as the
              // `extra-files`, so a release type's own version files (pyproject.toml,
              // Cargo.toml, pom.xml, ...) pass without Kanon naming each one, and the workflow
              // stays language-agnostic. A file added, removed or renamed is never a version
              // string's change.
              if (file.status !== 'modified') {
                problems.push(`${file.filename}: ${file.status}${extraFiles.has(file.filename) ? '' : ', and it is not in extra-files'}`);
              }
              else if (typeof file.patch !== 'string') problems.push(`${file.filename}: its diff is too large for GitHub to return, so it can't be checked`);
              else for (const line of offending(file.patch)) problems.push(`${file.filename}: ${line}`);
            }

            if (problems.length === 0) {
              console.log(`Release PR #${pr.number} changes only version strings outside the changelog and the version files.`);
              continue;
            }
            failed = true;
            const shown = problems.slice(0, 60);
            const more = problems.length > shown.length ? `\n…and ${problems.length - shown.length} more.` : '';
            const marker = `<!-- kanon-release-pr-guard ${pr.head.sha} -->`;
            const body =
              `${marker}\n**This release PR is stale: merging it would revert changes on \`${pr.base.ref}\`.** ` +
              `Outside ${[...versionFiles].sort().map((f) => `\`${f}\``).join(', ')}, a release PR may change only version strings, and this one changes more:\n\n` +
              '````diff\n' + shown.join('\n') + more + '\n````\n\n' +
              `Don't merge it. Close it and delete its branch, \`${pr.head.ref}\`, and the next push to \`${pr.base.ref}\` opens a fresh one; or re-run the Release workflow on \`${pr.base.ref}\` and check that this comment doesn't come back.`;
            console.log(`::error title=Release PR is stale::Release PR #${pr.number} would revert changes on ${pr.base.ref}: ${problems.length} line(s) beyond version strings.`);
            console.error(body);
            const comments = pages(`repos/${repo}/issues/${pr.number}/comments?per_page=100`);
            if (!comments.some((c) => (c.body ?? '').includes(marker))) {
              const file = `${mkdtempSync(`${tmpdir()}/release-pr-guard-`)}/body.md`;
              writeFileSync(file, body);
              gh(['api', '-X', 'POST', `repos/${repo}/issues/${pr.number}/comments`, '-F', `body=@${file}`]);
            }
          }
          if (failed) process.exit(1);
