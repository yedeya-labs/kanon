# QA pipeline — Agent 1 (Explorer), MODE: targeted-invariant. RA-1068. A Kanon lane (plan
# 0001, step 4).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:`
# this file at an exact Kanon tag, passes `project` and `ref` through, and maps the three
# secrets by name (never `secrets: inherit`). The `github` context in a called workflow is
# the caller's, so the resolve step and the hook load read the triggering event, and
# `github.sha`, exactly as they did when this file held the triggers itself.
#
# NOT A JUDGING LANE (`K-MERGE-17`, "Not covered"). It runs the code under test, the
# project's hook and its tests by design, so it reads them from the ref it verifies.
#
# INERT until: the caller is on the default branch + the Explorer's App installed + secrets
# (plan 0001 §8):
#   EXPLORER_APP_ID, EXPLORER_APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN
#
# Verifies ONE PROJECT'S acceptance criteria, per invariant ID, rather than
# sweeping a tier. Phase 5 of the reconciler (RA-1063) is what calls it.
#
# ── SAME SHAPE AS THE EXPLORER'S SWEEP, DELIBERATELY ───────────────────────────────
# `agent-explore.yml` runs a deterministic Playwright sweep to JSON and then has
# the Explorer read the artifact and file issues. This does the same with a different
# producer: `verify-acs.mjs` resolves the project's ACs to citing tests, runs
# them, and writes the JSON. A script that filed its own issues would be a second
# mechanism for something the pipeline already does one way.
#
# ── ITS OWN JOB, ON THE AGENT-LANE BLOCKS (RA-2661) ───────────────────────────
# The criteria run and the agent share one workspace and one database: the agent
# reads the artifact the run wrote, against the data the run left. A reusable
# workflow owns its whole job and takes no steps from its caller, so this lane does
# not hand its job to `agent-lane.yml`. It keeps its own job and calls the spine's
# blocks — `agent-setup`, `agent-run`, `agent-finish` — around its own steps, in the
# order they always ran relative to the agent (the reference adopter's pipeline doc, §6).
#
# ── IT RUNS LOCALLY, AND THAT IS A DECISION, NOT AN OVERSIGHT ───────────────
# RA-1063 records it: option (c). The Explorer has never touched a deployed environment —
# `playwright.config.ts` builds and serves the app in CI — and giving a QA agent
# write access to staging needs a disposable tenant, credentials and a
# blast-radius rule that do not exist. So the ACs are verified against a build of
# the DEPLOYED TAG, and the deployment itself is asserted separately.
#
# WHAT THAT MEANS, SAID HERE RATHER THAN BURIED: this verifies the CODE at the
# tag, not the DEPLOYMENT. A failed migration, a drifted env var, a config
# difference — none are visible to it. The report says so, and phase 5's retro
# must repeat it.
name: Verify ACs (Explorer) — targeted

# THE CALLER'S TRIGGERS — this lane's contract with it:
#
#   workflow_dispatch:
#     inputs:
#       project:
#         description: Project tracking-issue number (the brief is docs/projects/<n>.md)
#         required: true
#       ref:
#         description: >-
#           Tag or SHA to verify. Phase 5 passes the release that contains the
#           project's merges. Defaults to the checked-out default branch, which
#           verifies code that may not be deployed — the report says which it did.
#         required: false
#         default: ''
#
# LABEL TRIGGER (RA-1281). Phase 5 used to reach the Explorer with `gh workflow run`, which
# needs `actions: write` — and `docs/qa/agent-identities.md`'s footnote 2 gives
# the Lead `Actions: No access` on purpose, reasoning that "label churn achieves the
# same with strictly less authority". For this agent that route did not exist: the Explorer
# was `workflow_dispatch`-only, so there was no label to churn, and the dispatch
# failed 403 and held the project.
#
# Re-applying `qa:verify` is now the churn. VERIFIED before building it, the way that
# footnote's own discipline requires: the QA issue body carries both inputs the
# dispatch passed — "Verify project #961" and "The work is deployed in `v0.48.9`" —
# so the label route can express everything the higher-authority route did.
#   issues:
#     types: [labeled]
on:
  workflow_call:
    # The caller's `workflow_dispatch` inputs, passed through. Empty on the label trigger,
    # which carries no inputs, so neither is required here.
    inputs:
      project:
        description: Project tracking-issue number (the brief is docs/projects/<n>.md)
        required: false
        type: string
        default: ""
      ref:
        description: Tag or SHA to verify; empty for the default branch
        required: false
        type: string
        default: ""
    secrets:
      EXPLORER_APP_ID:
        required: true
      EXPLORER_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  # `inputs.project` is empty on a label event and this is evaluated before any step
  # runs, so it cannot use the resolved value. The issue number is the stable stand-in:
  # one QA issue per project, which is what `readWorld` relies on to find it at all.
  group: agent-verify-acs-${{ inputs.project || github.event.issue.number }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). The caller's job holds the
# ceiling and must grant at least this, or the run fails to start; `lane-check` fails a
# caller that grants less.
permissions:
  contents: read
  # REQUIRED NOW, and its absence would be silent. The resolve step below reads the QA
  # issue with the DEFAULT token to recover `project` and `ref`; a permissions block
  # sets every unlisted scope to `none`, so without this `gh issue view` 403s, `gh`
  # prints the error body to stdout, the regex finds no project, and the job gates
  # itself off while staying green — the exact shape of RA-956/RA-1090.
  #
  # This grant used to carry a comment saying it was NOT load-bearing — "granted so a
  # future read-only `run:` step does not silently get an empty result … nothing in
  # this file depends on it yet". That future step is the one below; the note is kept
  # here rather than deleted because it is why the scope was already present.
  issues: read

jobs:
  # Its own job so that the gate runs before the verify job starts its database and mints
  # the App token, and so that the lane's admission rule decides first: an unrelated label
  # starts no runner at all. `qa:verify` is the QA issue's own marker — the label
  # `readWorld` finds it by — so re-applying it is both the trigger and the "verify again"
  # signal; a label event fires on EVERY label, so this must not start for the other dozen.
  filter:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'qa:verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      member: ${{ steps.gate.outputs.member }}
    steps:
      # THE MEMBERSHIP GATE COMES FIRST (K-AGENT-45, kanon#46), before any token is minted:
      # this lane acts only when the event's actor is a member or a registered agent App.
      # `scripts/lane-gate.mjs` says who the actor is for each event; a refusal leaves
      # `member=false`, a notice and a step-summary line, and every later step and job skips.
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

  # THE LANE'S RUN, AS A CALLED WORKFLOW (kanon#279, `K-AGENT-49`). `verify-acs-run.yml` mints the
  # token in a job that holds the key and runs nothing else, then hands it to the agent's job
  # (`verify-acs-agent-job.yml`). Both sit inside this job's scope, so the mint waits
  # with the agent: a token minted before the wait could expire under it.
  verify:
    needs: filter
    if: needs.filter.outputs.member == 'true'
    uses: $/.github/workflows/verify-acs-run.yml
    with:
      project: ${{ inputs.project }}
      ref: ${{ inputs.ref }}
    secrets:
      app-id: ${{ secrets.EXPLORER_APP_ID }}
      app-private-key: ${{ secrets.EXPLORER_APP_PRIVATE_KEY }}
      claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
