# Merge Reconcile — the agent's job
#
# The agent's job of `agent-merge-reconcile.yml`, moved here unchanged apart from its token (kanon#279).
#
# CALLED ONLY BY `merge-reconcile-run.yml`, beside the job that mints this lane's token. The App's private
# key never enters this job (`K-AGENT-49`): the token arrives hex-encoded as the `app-token`
# secret. `Receive the App token` sits where the mint step was, so the token exists in this job
# from the same point as before, and `Revoke the App token` is the last step. Every other step
# is the lane's, as it was; what it read from the lane's earlier jobs (`needs.*.outputs`) and
# the lane's inputs arrives as inputs of the same name. The lane's header says what the job
# does, and `tests/unit/app-key-isolation.test.ts` holds its token steps to the spine's.
#
# WHAT THE AGENT CAN STILL REACH HERE: the token it was always given, for at most the hour it
# lives, and the Claude token. Rewriting a cached action in this job reaches only those.
name: Merge Reconcile — the agent's job

on:
  workflow_call:
    inputs:
      pr:
        description: The merged PR to reconcile, as the filter resolved it.
        required: false
        type: string
        default: ""
      app-slug:
        description: The minted App's slug, from the lane's `mint` job.
        required: true
        type: string
      mint-attempt:
        description: >-
          The run attempt the lane's `mint` job minted the token for. A partial re-run
          ("Re-run failed jobs") reuses that job's outputs, so a token from an earlier
          attempt, which that attempt revoked, is refused by name.
        required: true
        type: string
    secrets:
      app-token:
        description: >-
          The lane's App token, hex-encoded by its `mint` job (a job output holding a masked
          value is dropped). Arrives masked, as every secret does.
        required: true
      claude-token:
        required: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336). Actions' default cap is 360m, so a wedged agent
    # burned six hours and left its issue looking mid-flight. Sized at ~3x the
    # longest real run measured on this workflow, so it never truncates work.
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr }}
    steps:
      # WHEN THE JOB STARTED, for the telemetry row's `timed_out` (plan 0003 §5.1). First, so
      # it is as close to the job's start as a step can be.
      - name: Record when the job started
        id: job
        run: echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The merged default branch — so the agent can grep whether a fold-in landed.
      # Checked out with the DEFAULT token, before the App token is minted, as it always
      # was: this arm only reads the tree and files issues through `gh`, so the persisted
      # git credential stays read-only and the App token reaches the agent as `gh`'s alone.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.event.repository.default_branch }}

      # THE AGENT-LANE BLOCKS, CALLED DIRECTLY (RA-2660, RA-2669). This job keeps its own steps
      # around the agent — the playbook excerpt below must be written into the same
      # workspace before the agent starts — so it calls `agent-setup`, `agent-run` and
      # `agent-finish` itself rather than handing its job to `agent-lane.yml`.
      # The reference adopter's pipeline doc says which to use when. They are `$/` references (RA-2697),
      # read from the commit that defined this workflow rather than from the default
      # branch checked out above, which moves whenever another PR merges during the run.
      # THE TOKEN, RECEIVED WHERE IT WAS MINTED (kanon#279, `K-AGENT-49`): `merge-reconcile-run.yml`'s `mint` job
      # holds the key and mints it; this step decodes and masks it, and the job never sees the key.
      - name: Receive the App token
        id: app-token
        env:
          SEALED: ${{ secrets.app-token }}
          APP_SLUG: ${{ inputs.app-slug }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$'; then
            echo "::error title=app-token::no App token arrived from this lane's mint job; see that job's log for why the mint failed."
            exit 1
          fi
          if [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "::error title=app-token::this is attempt $RUN_ATTEMPT, but the App token was minted for attempt $MINT_ATTEMPT and revoked when that attempt ended. Use \"Re-run all jobs\", not \"Re-run failed jobs\": the token is minted in a job of its own, and only re-running it mints a fresh one."
            exit 1
          fi
          # Decoded with printf and sed alone, so the step needs nothing the runner may lack.
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          {
            echo "token=$TOKEN"
            echo "app-slug=$APP_SLUG"
          } >> "$GITHUB_OUTPUT"

      # NO PROJECT SETUP (RA-2660, RA-2694). This arm never installed and has no database: the
      # agent reads the tree and calls `gh`, and the only scripts it runs before or after
      # are dependency-free `node:` builtins. So it does not call the project-setup hook at
      # all (Kanon plan 0001 §5: a lane that installs nothing does not), and runs those
      # scripts on the runner's own Node, as every step before the hook does on the other
      # lanes. No slug assertion (the reviewer App's login is not a sweep constant) and no
      # push probe (this arm never pushes) — both as before, so this call runs no step; it
      # stays so the lane calls the same three blocks as every other.
      - uses: $/actions/agent-setup
        id: setup
        with:
          arm: merge-reconcile agent
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Only the playbook sections this job uses (RA-2488 option 2). The whole reviewer
      # playbook is ~44 KB, and everything but its follow-up rules is about reviewing an
      # OPEN PR — context this arm cached and re-read every turn for nothing. No model;
      # the section list is a constant in the script, and script + playbook come from the
      # default-branch checkout above, so the merged PR's content cannot choose what is
      # extracted (this step itself is as trusted as the workflow copy running). A renamed
      # heading writes the WHOLE playbook with a ::warning (tests/unit/playbook-excerpt.test.ts
      # reds first); a crash writes nothing and the prompt falls back to the full file.
      # THE LANE'S OWN STEP between the set-up and the agent — the reason it calls the
      # blocks directly.
      #
      # The script is Kanon's, read from the action cache at the tag the caller pinned (plan
      # 0001 §3); the playbook is the adopter's, from the default-branch checkout above.
      - uses: $/actions/kanon-path
        id: kanon
      - name: Extract the playbook sections merge-reconciliation uses
        continue-on-error: true
        run: node "$KANON/scripts/playbook-excerpt.mjs"

      # Auth = Claude subscription (see agent-triage.yml for the graduate-to-API note).
      - uses: $/actions/agent-run
        id: agent
        env:
          KANON: ${{ steps.kanon.outputs.path }}
        with:
          claude-token: ${{ secrets.claude-token }}
          github-token: ${{ steps.app-token.outputs.token }}
          # 5-MINUTE PROMPT CACHE, DELIBERATELY (RA-2058). Unset, this auth path takes the
          # 1-HOUR TTL automatically — that is the documented default for a Claude
          # subscription within its usage limits — and a 1h cache WRITE bills at 2x base
          # input against 1.25x for 5m. Measured: `cache_write_1h_tokens ==
          # cache_write_tokens` on every COST# row, and modelling a run at 2x reproduces
          # the recorded total_cost_usd to 0.15%.
          #
          # The premium buys warmth across breaks, and this arm is an hourly tick whose
          # runs are far shorter than either TTL.
          # Most of the write is per-turn context growth anyway (cache_write ~ a + b*turns,
          # 49-73% growth across the arms), read seconds later by the next turn — an hour
          # of warmth is worth nothing to those bytes.
          #
          # SAFE HERE BECAUSE A CACHE ONLY GOES COLD ON AN IDLE GAP, AND THIS ARM HAS
          # NONE: 100% of runs finish in under 300s, so an expiry is arithmetically
          # impossible. Maximum TOTAL idle per run is 6s. Saving: ~$572/yr.
          #
          # NOT set on agent-implement*/code-audit/triage: they run the test suite inside a
          # Bash turn (E2E alone averages 306s in CI) and the implementer's median idle is
          # 593s over 86% of runs, so one expiry per run would erase the saving. The
          # break-even is 0.93 expiries/run fleet-wide. Full working in RA-2058.
          prompt-cache-ttl: 5m
          # Reviews (and the merge) may be by bots (the Implementer, dependabot); the block permits
          # them (`allowed_bots: "*"`), as this step always did.
          prompt: |
            You are the Reviewer (Agent 3), running the MERGE-RECONCILIATION
            check on PR #${{ env.PR_NUMBER }}, which has ALREADY MERGED. First read
            .agent/reviewer-playbook-excerpt.md — the "Capturing follow-ups" and
            "Beware your own suggested fix" sections of docs/qa/reviewer-playbook.md,
            cut before you started. Those are the playbook rules this job needs; do
            not read the rest of the playbook. Only if that excerpt file is missing,
            read docs/qa/reviewer-playbook.md itself.

            Why you exist: the fold-in path has no tracking artifact by construction.
            When a review raised a fold-in suggestion (or a CHANGES_REQUESTED finding)
            that wasn't applied before merge, the playbook promises a FALLBACK
            `follow-up` issue "so nothing leaks" — but nothing re-triggers you once the
            PR merges (that leaked RA-244, RA-254, and RA-293, whose review landed after the
            merge). You are that re-trigger. Do it now:

            1. Read EVERY review on PR #${{ env.PR_NUMBER }} (latest state per reviewer,
               `gh pr view ${{ env.PR_NUMBER }} --json reviews`). Enumerate each
               ACTIONABLE finding — a blocking / request-changes item, or a fold-in
               suggestion the review expected the author to amend into this PR. IGNORE
               pure confirmations, cosmetics, and no-action nits (per the playbook's bar).
            2. For each actionable finding, decide on the MERGED code whether it was
               APPLIED. This checkout IS the merged default branch — grep/read it (and
               `git log` it) to verify. Separately, search issues (OPEN and CLOSED,
               `gh issue list --search`) for an existing tracking artifact.
            3. For any actionable finding that is BOTH un-applied AND un-tracked, FILE a
               `follow-up` issue — dedup-search first. Labels: `follow-up` +
               `agent:reviewer`, PLUS a `sev:*` (RA-729) — you have the merged code in
               front of you, so judge the REACHABLE impact by the rubric in
               docs/qa/explorer-playbook.md: `sev:critical` = data loss / security /
               data isolation / outage; `sev:high` = core flow broken, no workaround;
               `sev:medium` = degraded, workaround exists; `sev:low` = cosmetic.
               A finding in a data migration (a hand-written migration) has
               already run on every migrated database and no later PR re-runs it, so
               rate it by the worst database state it could have left behind.
               Filing with no severity leaves the finding indistinguishable from a
               stale doc comment, and gets flagged `qa:needs-severity`.
               Milestone — route by SUBJECT, not provenance: engineering-platform or
               QA-pipeline work (a CI guard, build tooling, the agent pipeline
               itself) goes to "Development Automation", as RA-602/RA-571 did. Everything
               else goes to "Product Backlog" at ANY severity. A `sev:critical` /
               `sev:high` product follow-up is LAUNCH-GATING: ALSO pass
               `--label gate-candidate` and leave it on "Product Backlog". Never set a
               roadmap milestone, the launch gate included, yourself — only the developer
               places work on one (RA-1616). Gate hygiene is the constraint (K-WORK-10) —
               if there is a workaround it is `sev:medium` and not a candidate.
               Pass `--label` AND `--milestone` in the SAME `gh issue create`, never
               `create` then `edit`: a bare create races the milestone backstop's
               default (K-WORK-1).
               Body: the finding (what / why / file:line)
               + "Surfaced by PR #${{ env.PR_NUMBER }} review; merged without the fold-in —
               filed by merge-reconciliation." Title it as the WORK, not the symptom.
            4. If everything actionable was applied or is already tracked, do NOTHING —
               no issue, no comment. A clean merge is the common case; silence is correct.

            Propose only — NEVER fix, merge, reopen, or close anything.
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 30
            --max-budget-usd 15
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections

      # Explain a red run (RA-1408) and record what it cost (RA-1485), as the two steps this
      # replaced did. `always()` and `continue-on-error` for the reasons in the block's
      # header; `job-status` because the block cannot see the job's `failure()` from inside
      # itself, and its classifier runs only when that is 'failure'. No `quality-pr-label`:
      # this arm files issues, not PRs, and never had the column.
      - uses: $/actions/agent-finish
        id: finish
        if: always()
        continue-on-error: true
        with:
          arm: merge-reconcile agent
          agent: merge-reconcile
          job-status: ${{ job.status }}
          execution_file: ${{ steps.agent.outputs.execution_file }}
          pr-number: ${{ env.PR_NUMBER }}
          github-token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 30
            --max-budget-usd 15
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Grep,Glob
            --exclude-dynamic-system-prompt-sections
          # The version-2 telemetry row (plan 0002 §2.6): this lane's name and each stage's
          # step CONCLUSION in the lane's own order, never a step's name or log.
          lane: merge-reconcile
          stages: >-
            checkout=${{ steps.checkout.conclusion }}
            token=${{ steps.app-token.conclusion }}
            setup=${{ steps.setup.conclusion }}
            agent=${{ steps.agent.conclusion }}
          job-started-at: ${{ steps.job.outputs.started-at }}
          timeout-minutes: "30"  # the job's own, held to it by tests/unit/telemetry-schema.test.ts
          kanon-error: ${{ steps.setup.outputs.kanon-error }}

      # THE TOKEN DIES WITH THE JOB (`K-AGENT-49`). Last, after every step that uses it. It is
      # decoded from the secret again rather than read from `Receive the App token`, so a run that
      # ended before that step (a decline, a failed gate) still revokes the token its mint job
      # minted. Revoking needs only the token itself, never the key. Never reds the run: an
      # earlier attempt's token was revoked by that attempt, and one that expired is refused.
      - name: Revoke the App token
        if: always()
        env:
          SEALED: ${{ secrets.app-token }}
          MINT_ATTEMPT: ${{ inputs.mint-attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          API_URL: ${{ github.api_url }}
        run: |
          if [ -z "$SEALED" ] || ! printf %s "$SEALED" | grep -Eq '^([0-9a-f]{2})+$' || [ "$MINT_ATTEMPT" != "$RUN_ATTEMPT" ]; then
            echo "No App token of this attempt to revoke"
            exit 0
          fi
          TOKEN="$(printf '%b' "$(printf %s "$SEALED" | sed 's/../\\x&/g')")"
          echo "::add-mask::$TOKEN"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/installation/token" || true)"
          if [ "$STATUS" = "204" ]; then echo "App token revoked"; else echo "::warning title=app-token::the App token could not be revoked (HTTP ${STATUS:-none}); it expires within the hour"; fi
