# The daily project digest, and the health check that rides its tick. RA-1438, RA-1036. A
# Kanon lane (plan 0004, step 10).
#
# A REUSABLE WORKFLOW, CALLED BY THE ADOPTER'S TRIGGER-ONLY CALLER. The caller holds the
# triggers listed above `on:` below, the `permissions:` ceiling, and one job that `uses:`
# this file at an exact Kanon tag, passes `dry_run` through, and maps its secrets by name
# (never `secrets: inherit`).
#
# Reports where each project in `docs/projects/` has got to, and, the part that earns the
# post, what is STOPPED and why. See `scripts/project-digest.mjs` for the derivation and the
# editorial reasoning.
#
# This is NOT the weekly digest's audience. That one is written for a stakeholder outside the
# day-to-day and is forbidden from naming anything pending (RA-166). This one is for the
# developer, and what is pending is the entire point.
#
# It reads the GitHub API and the checked-out briefs only: no database and no cloud.
#
# THE POST GOES THROUGH THE NOTIFY JOB (plan 0011 §4, §5, step N7; `K-OBS-19`). The `digest` job
# writes one Kanon notification, `message.json` of kind `project-digest`, and uploads it; the
# `notify` job hands it to the adopter's hook at `.github/actions/notify/action.yml` with the
# caller's `KANON_CHAT_PROJECT_DIGEST`, and with no other secret. No job here formats for a chat
# system, and only the `notify` job and the gate's presence boolean name the chat secret.
#
# NO HOOK OR NO SECRET, NO DIGEST (plan 0011 §8, decisions 2 and 12). The gate reads whether the
# hook exists at the run's commit and whether the kind's secret is set; without both nothing would
# post, so the `digest` job, whose whole output is the message, is skipped and no model runs. A
# dry run still writes and prints it. The health job runs either way, and never posts (decision
# 13): a repository with no chat channel still gets the health check (Kanon calls this lane for it).
#
# `DIGEST_WEBHOOK` IS GONE (decision 17, a clean break). The lane no longer declares it, so GitHub
# refuses to start a caller that still maps it, health job included, until the line goes;
# `kanon doctor`'s `notify.legacy-secret` and the upgrade skill say what to change.
#
# INERT until: the caller is on the default branch + these secrets (plan 0001 §8):
#   CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY, and a notify hook with KANON_CHAT_PROJECT_DIGEST to post
# ONE OF SECRETS: CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY
# The line above is read by `lane-check` and the requirements file (plan 0009 §10): the Claude
# credential, the subscription token or an Anthropic API key. A caller maps exactly one, and
# `agent-run` refuses both or neither, by name, before the agent starts.
# MAX TURNS: 20, at most 40
# The line above is read by `lane-check` and the requirements file (kanon#891): this lane's turn
# limit, the `--max-turns` in its flags, and Kanon's ceiling on raising it, the `max-turns-ceiling`
# it hands `agent-run`. A person raises it only for one dispatched run, with a reason.
name: Daily project digest

# THE CALLER'S TRIGGERS — this lane's contract with it:
#   schedule: "35 7 * * *"         — daily, after the reconciler's :25 hourly tick, so the
#                                    state this reads is the freshest available
#   workflow_dispatch              — input `dry_run` (boolean, default false: print the
#                                    message and file nothing)
on:
  workflow_call:
    # The caller's `workflow_dispatch` input, passed through. Empty on the schedule, and a
    # STRING here: a caller passes `${{ inputs.dry_run }}`, which a boolean input refuses as
    # `''` on the schedule.
    inputs:
      dry_run:
        description: "'true' to print the message instead of posting it, and file nothing"
        required: false
        type: string
        default: ""
      max_turns:
        description: "Raise the turn limit for this one dispatched run, a whole number from 1 to 40 (the lane's limit is 20). Only a caller's workflow_dispatch input may fill it, and it needs a reason. Kanon refuses anything else before any model call (docs/lanes.md, \"The turn budget\")."
        required: false
        type: string
        default: ""
      reason:
        description: "Why this dispatched run raises max_turns: required when max_turns is set, and recorded in the run's summary (docs/lanes.md, \"The turn budget\")."
        required: false
        type: string
        default: ""
      smoke:
        description: Set by a smoke run only, never by a lane caller. Any value puts the run in a concurrency group of its own, so it neither waits behind nor cancels a real run or another smoke run.
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      # This kind's chat secret (plan 0011 decision 3). Not required: without it the digest posts
      # nothing and runs no model (above). Read only by the `notify` job, and by the gate as one
      # presence boolean.
      KANON_CHAT_PROJECT_DIGEST:
        required: false

concurrency:
  # A smoke run (`inputs.smoke`) takes a group of its own: agent-lanes-smoke.yml says why.
  group: kanon-project-digest${{ inputs.smoke && format('-smoke-{0}', github.run_id) || '' }}
  cancel-in-progress: false

# IN A CALLED WORKFLOW THIS BLOCK CAN ONLY NARROW (plan 0001 §3). The caller's job holds the
# ceiling and must grant at least this, or the run fails to start; `lane-check` fails a
# caller that grants less. The health job's `actions: read` and `issues: write` are held to
# the same ceiling.
permissions:
  contents: read
  issues: read
  # REQUIRED, by two core REST readers, neither of them search. `openPullsOf` lists the open
  # pull requests (`GET /repos/{repo}/pulls?state=open`, kanon#1342) the first time a
  # dispatched member needs its closing PR; without this it fails with a 403 or 404 and stops
  # the job, so no building issue is quietly reported as a stall. The mergeability read
  # (`GET /repos/{repo}/pulls/{n}`) is the other: it runs only after the listing succeeds, and
  # a failed read leaves the member `building`, never `conflicting`. The member search
  # (`is:issue … in:body`) does not use this grant.
  pull-requests: read

jobs:
  # THE MEMBERSHIP GATE (K-AGENT-45, kanon#46), in a job of its own because every job below
  # needs its verdict and the digest and the health job may not wait for each other. On the
  # schedule the actor is whoever last changed the cron; on a dispatch, whoever ran it. A refusal
  # leaves `member=false`, a notice and a step-summary line, and every job skips.
  #
  # AND WHETHER ANYTHING WILL POST (plan 0011 §8): `hook` is `present` or `none`, read from a
  # sparse checkout that runs nothing, and `post` is `true` only with the hook and
  # `KANON_CHAT_PROJECT_DIGEST` both there. The secret is read as one presence boolean, the one
  # reference to it outside the `notify` job that `tests/unit/notify-guard.test.ts` admits; this
  # job holds no Claude credential and no App key.
  #
  # ONLY THE CALLER'S TWO TRIGGERS. As a called workflow it runs on whatever its caller is
  # called on (Kanon's smoke calls it on pull requests), so every other event starts nothing.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      member: ${{ steps.gate.outputs.member }}
      hook: ${{ steps.post.outputs.hook }}
      post: ${{ steps.post.outputs.post }}
    steps:
      - uses: $/actions/kanon-path
      - name: Is the actor a member?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$KANON/scripts/lane-gate.mjs"

      # The hook's directory alone, at the run's commit (decision 8), with no credential kept.
      # Nothing in it runs here: the next step only asks whether the hook's file exists.
      - name: Check out the notify hook
        if: steps.gate.outputs.member == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/notify
          sparse-checkout-cone-mode: false

      # NO HOOK OR NO SECRET, NO POST, SO NO DIGEST (plan 0011 §8; kanon#836's step, moved here
      # from the `digest` job, which holds the Claude credential). Secrets can't be read in an
      # `if:`, so the secret's presence is mapped to this step's env as one boolean, never its value.
      - name: Will the digest be posted?
        id: post
        if: steps.gate.outputs.member == 'true'
        env:
          HAS_SECRET: ${{ secrets.KANON_CHAT_PROJECT_DIGEST != '' }}
        run: |
          if [ -f .github/actions/notify/action.yml ]; then hook=present; else hook=none; fi
          if [ "$hook" = present ] && [ "$HAS_SECRET" = true ]; then post=true; else post=false; fi
          { echo "hook=$hook"; echo "post=$post"; } >> "$GITHUB_OUTPUT"
          if [ "$hook" = none ]; then
            echo "No notify hook: nothing was posted, so the digest is not written and no model runs. The health job still runs (plan 0011 §8)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$post" = false ]; then
            echo "No chat secret for the project digest: this kind was not posted, so the digest is not written and no model runs. The health job still runs (plan 0011 §8)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # THE PRODUCER (plan 0011 §4): it writes the message and uploads it, and holds no chat secret.
  # Only when the digest will be posted, or printed by a dry run (above).
  digest:
    needs: gate
    if: needs.gate.outputs.member == 'true' && (needs.gate.outputs.post == 'true' || inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    # Bounds a hang (RA-1336), sized like the weekly digest's.
    timeout-minutes: 20
    # Deliberately NO `actions: read`. Every status here is derived from issues and PRs:
    # nothing is scraped from run logs, so there is nothing a log-format change can break
    # (RA-1490). Per-tick budget starvation (RA-1484) stays out of this digest for the same
    # reason: seeing it would mean reading a run log.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # The message's artifact, named with this job's own attempt, for the `notify` job to download:
    # empty when nothing was uploaded (a dry run, or a failure before the upload). The `notify`
    # job takes the name from here and never computes it, because after "Re-run failed jobs" its
    # own attempt is one past this one's (plan 0011 §4, §5.4).
    outputs:
      message-artifact: ${{ steps.upload.outcome == 'success' && steps.message.outputs.artifact || '' }}
    steps:
      # WHEN THE JOB STARTED, for the telemetry row's `timed_out` (plan 0003 §5.1). First, so
      # it is as close to the job's start as a step can be.
      - name: Record when the job started
        id: job
        run: echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The briefs under `docs/projects/` (K-LAYOUT-1), which the agent and the script read.
      - uses: actions/checkout@v7
        id: checkout

      # THE AGENT-LANE BLOCKS, CALLED DIRECTLY (P8, RA-2743). This arm mints no App token, so
      # `agent-setup` gets no slug and probes nothing, as the reviewer's does; `agent-run` is
      # the narrative step; `agent-finish` records the cost row. No project setup: the agent
      # reads the tree and calls `gh`, and the script after it is one of Kanon's, which needs
      # only Node's built-in modules.
      - uses: $/actions/agent-setup
        id: setup
        with:
          arm: project-digest agent
          app-slug: ""

      # Kanon's scripts, for the message below, and `KANON` for the agent's environment (kanon#110):
      # from this step's output, which no project file can rewrite.
      - uses: $/actions/kanon-path
        id: kanon

      # BEST-EFFORT, and the only best-effort step here. The numbers below are deterministic;
      # this writes the judgement that a table cannot carry, most importantly whether a
      # stopped project is waiting on a decision or on a re-dispatch. If it fails, times out
      # or writes nothing, the digest still posts, just without the prose.
      - name: Write today's narrative (non-fatal)
        id: agent
        continue-on-error: true
        uses: $/actions/agent-run
        env:
          KANON: ${{ steps.kanon.outputs.path }}
        with:
          max-turns: ${{ inputs.max_turns }}
          max-turns-ceiling: "40"
          max-turns-reason: ${{ inputs.reason }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          # 5-MINUTE PROMPT CACHE, DELIBERATELY (RA-2058). Unset, this auth path takes the
          # 1-HOUR TTL automatically, and a 1h cache WRITE bills at 2x base input against
          # 1.25x for 5m. This arm runs daily, so an hour of warmth is dead long before the
          # next run in any case, and most of the write is per-turn context growth read
          # seconds later by the next turn.
          #
          # SAFE HERE BECAUSE A CACHE ONLY GOES COLD ON AN IDLE GAP, AND THIS ARM HAS NONE:
          # measured on the reference adopter, 100% of runs finish in under 300s, and the
          # most total idle in a run is 15s.
          prompt-cache-ttl: 5m
          prompt: |
            Read the project briefs in `docs/projects/*.md` whose tracking issue
            is still open, and the issues that carry their `<!-- qa:project N -->`
            membership marker, and write **two to four sentences** to
            `narrative.txt` in the repo root saying what a developer starting
            their day should know.

            The reader is the developer who owns this repo. They know the
            codebase, the agent pipeline and the vocabulary. Write for them, not
            for a stakeholder.

            LEAD WITH WHAT IS STOPPED AND WHY. A project moving normally needs
            half a sentence; a project that is stopped needs the reason and what
            would unstick it. If everything is moving, say that in one sentence
            and stop — an honest quiet day beats a padded one.

            THE DISTINCTION THAT MATTERS MOST. An issue labelled `agent:implement`
            with no PR has two causes that look identical and need opposite
            responses:
              - a SCOPE-FIRST BAIL — the implementer posted a plan and stopped,
                correctly, because `agent-implement.yml` forbids it from
                proceeding into a data migration, an auth/credential/security
                change, or destructive schema without a human. It needs a
                DECISION from the developer. Check the issue's comments.
              - a STALLED DISPATCH — the run was skipped or died. It needs a
                RE-DISPATCH.
            Never call one the other. If you cannot tell from the comments, say
            which it looks like and why, rather than asserting.

            RULES:
            - Do NOT restate the numbers — the digest already carries the
              per-project counts and per-issue lines beneath your sentences.
            - Do NOT nag about the developer's own review or merge backlog
              (RA-166). Report where the PIPELINE is stopped, not their queue.
            - Do not invent progress, and do not soften a stall.
          # WITHOUT THIS BLOCK THE STEP IS DENIED EVERY TOOL AND SILENTLY WRITES NOTHING
          # (RA-1473). `Read` reads the briefs, `Bash` runs `gh` for the member issues and
          # their comments, and `Write` produces `narrative.txt`, which is the step's only
          # output. `tests/unit/digest-lanes.test.ts` holds it.
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --max-turns 20
            --max-budget-usd 10
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Glob,Grep,Write
            --exclude-dynamic-system-prompt-sections

      # Record what this run cost (RA-1485). `always()` because a run that FAILED is the one
      # you most want measured. `classify: "false"`, because this arm explains a red narrative
      # in a step of its own below, gated on the narrative step and non-fatal; the block's
      # classifier would key on the job's status instead, which is the wrong signal here.
      - uses: $/actions/agent-finish
        id: finish
        if: always()
        continue-on-error: true
        with:
          claude-args-ran: ${{ steps.agent.outputs.claude-args }}
          arm: project-digest agent
          agent: project-digest
          job-status: ${{ job.status }}
          # The agent step runs `continue-on-error`, so its conclusion is `success` even when the
          # action failed it past its turn cap: the outcome says so (kanon#1014).
          agent-outcome: ${{ steps.agent.outcome }}
          classify: "false"
          execution_file: ${{ steps.agent.outputs.execution_file }}
          claude_args: |
            --model claude-sonnet-5
            --effort high
            --max-turns 20
            --max-budget-usd 10
            --fallback-model claude-opus-5-5
            --allowedTools Read,Bash,Glob,Grep,Write
            --exclude-dynamic-system-prompt-sections
          # The version-2 telemetry row (plan 0002 §2.6, its decision 9: the digests record
          # their rows as the Overseer's).
          lane: project-digest
          stages: >-
            checkout=${{ steps.checkout.conclusion }}
            setup=${{ steps.setup.conclusion }}
            agent=${{ steps.agent.conclusion }}
          job-started-at: ${{ steps.job.outputs.started-at }}
          timeout-minutes: "20"  # the job's own, held to it by tests/unit/telemetry-schema.test.ts
          kanon-error: ${{ steps.setup.outputs.kanon-error }}
          prompt-cache-ttl: ${{ steps.agent.outputs.prompt-cache-ttl }}
          auth: ${{ steps.agent.outputs.auth }}

      # FAILS THE JOB on error, deliberately. A swallowed failure means the digest quietly
      # stops and the developer stops hearing about stalled projects, which is the exact
      # failure this exists to prevent, now invisible. A red run is the cheapest detector.
      #
      # THE MESSAGE, NOT A POST (plan 0011 §4). The script writes one contract message to
      # `MESSAGE_DIR/message.json`, and this step names its artifact with this job's own attempt.
      # A dry run writes the message, its plain text and the Slack hook's payload to the step
      # summary instead, and names no artifact: nothing is uploaded, and the `notify` job skips.
      - name: Write the digest's message
        id: message
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          MESSAGE_DIR: ${{ runner.temp }}/kanon-notify-message
        run: |
          set -euo pipefail
          # `|| true` on the read only — an absent narrative is the degraded path, not a
          # failure. Anything the script itself hits does fail the job.
          NARRATIVE="$(cat narrative.txt 2>/dev/null || true)" \
            node "$KANON/scripts/project-digest.mjs"
          if [ -z "$DRY_RUN" ]; then
            echo "artifact=kanon-notify-project-digest-digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the message
        id: upload
        if: steps.message.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.message.outputs.artifact }}
          path: ${{ runner.temp }}/kanon-notify-message/message.json
          if-no-files-found: error

      # WHY THE NARRATIVE DID NOT LAND (RA-1408). A cap, an outage and a real failure want
      # different responses, and the classifier tells them apart.
      #
      # GATED ON THE STEP, NOT THE JOB (RA-1503). The narrative step is `continue-on-error`,
      # so when it fails the job still finishes green: `failure()` would be false exactly
      # when this explanation is needed. `non-fatal` drops the notice to a warning, because
      # an `::error` on a green job reads as the thing that failed.
      - name: Say whether the model was unreachable or the run genuinely failed
        if: always() && steps.agent.outcome == 'failure'
        uses: $/actions/agent-classify
        with:
          arm: project-digest agent
          non-fatal: "true"
          claude-args: ${{ steps.agent.outputs.claude-args }}
          agent-outcome: ${{ steps.agent.outcome }}

  # ── A WORKFLOW RED ON EVERY RUN (RA-1036) ────────────────────────────────────────────
  #
  # The reconciler failed on EVERY run for weeks in the reference adopter, and nothing
  # escalated it: GitHub's own failure notification goes to a run's actor, which on a
  # scheduled workflow is nobody who reads it. `scripts/workflow-health.mjs` files one issue
  # naming every lane caller red on every recent run, one when the weekly Overseer audit
  # stops landing (where an Overseer is installed), and one naming every lane caller whose
  # `schedule` has gone far longer than its cron without a scheduled run (kanon#813).
  #
  # A SEPARATE JOB, NOT A STEP IN `digest`. Permissions are per job, so `actions: read` here
  # leaves the digest job's refusal of that scope as it is.
  #
  # NO `needs: digest`: the digest and this check answer unrelated questions, so a chat
  # outage cannot hide a dead reconciler. It waits only for the gate, and runs with no hook or
  # no chat secret too. It never posts a chat message (plan 0011 decision 13): the issue it
  # files is the record.
  health:
    needs: gate
    if: needs.gate.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `gh run list`, and each scheduled workflow's state and newest scheduled run.
      actions: read
      # The escalation is an ISSUE, because that is the surface that persists. A red run here
      # would reproduce exactly the bug being fixed.
      issues: write
    steps:
      # The lane callers it watches are the files under `.github/workflows/`.
      - uses: actions/checkout@v7
      - uses: $/actions/kanon-path
      - name: Escalate a workflow red on every recent run, a weekly audit that never landed, or a silent schedule
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # A dry run prints the table and files nothing.
          APPLY: ${{ inputs.dry_run != 'true' && '1' || '' }}
        run: node "$KANON/scripts/workflow-health.mjs"

  # THE POST (plan 0011 §5, `K-OBS-19`): the one job that holds the chat secret, this kind's and no
  # other, with a token that reads contents and nothing more. It hands the `digest` job's message
  # to the adopter's hook through Kanon's `notify` block, which validates it first and records the
  # outcome. Only past an admitting gate, only with a hook, never on a dry run or a cancelled run;
  # after a failed or skipped `digest` it still runs, and records `skipped`.
  # `tests/unit/helpers/notify-jobs.ts` holds it to this shape.
  notify:
    needs: [gate, digest]
    if: ${{ !cancelled() && needs.gate.outputs.member == 'true' && needs.gate.outputs.hook == 'present' && inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.notify.outputs.outcome }}
    steps:
      - uses: $/actions/notify
        id: notify
        with:
          kind: project-digest
          artifact: ${{ needs.digest.outputs.message-artifact }}
          secret: ${{ secrets.KANON_CHAT_PROJECT_DIGEST }}
