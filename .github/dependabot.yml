# Dependabot for Kanon's own actions (plan 0001, decision 14).
#
# `/` covers .github/workflows. Each composite action under actions/ is its own directory,
# so it is listed by glob, and so is Kanon's own project-setup hook under .github/actions/. The AWS
# QA store's two actions under infra/ are listed by path. That includes the exact pin of claude-code-action in
# actions/agent-run: the pin fixes the CLI per Kanon release, and this is what proposes
# each bump, as an ordinary Kanon PR that runs the smoke workflow and the tests. Its tests
# stay red until a maintainer re-probes the Reviewer's grant against the new CLI and pushes
# the record to the bump's branch (#284, `.github/scripts/reviewer-grant-probe.mjs`).
#
# Kanon itself is a dependency here too (#47): the DCO and PR-title checks that judge a PR
# run Kanon's last release, `yedeya-labs/kanon/actions/…@vX.Y.Z`, and this entry proposes
# each new release to them and to the review lane's caller (review.yml) and CI's lane-check
# (ADR 0011, plan 0001 step 4b), as K-ADOPT-11 has it for any adopter: Kanon's own references in
# a group of their own, and never held back by a cooldown. Kanon is first-party, so a
# cooldown would only delay the release that judges the next PR.
#
# THE EXEMPTION MUST BE WRITTEN OUT (#233). An entry that sets no `cooldown` is not free of
# one: Dependabot then applies its default of 3 days, and this entry, which set none, held
# Kanon's pins on v0.10.0 through 13 releases. Its run logs say so ("Days since release : 1
# (cooldown days 3)", "All versions are in cooldown period, returning current version"), and
# Kanon releases several times a day. So the cooldown below keeps those 3 days for every
# third-party action and excludes Kanon. tests/unit/workflows.test.ts pins it, and
# `lane-check` holds every adopter's entry to the same.
#
# DAILY, NOT WEEKLY. The cooldown exemption only helps once Dependabot looks: a weekly entry
# still reached a new Kanon release up to a week late, and a Dependabot run can't be started
# from the UI. Daily matches the entry adopters are given (actions/pr-title/README.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
      - /.github/actions/*
      - /infra/qa-store/aws
      - /infra/qa-store/aws/maintenance
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude: ["yedeya-labs/kanon*"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      # First, so Kanon's references land in this group and not in the catch-all below.
      kanon:
        patterns: ["yedeya-labs/kanon*"]
      github-actions:
        patterns: ["*"]
