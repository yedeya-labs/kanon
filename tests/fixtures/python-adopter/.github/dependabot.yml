version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "yedeya-labs/kanon*"
    commit-message:
      prefix: ci
      include: scope
    groups:
      kanon:
        patterns:
          - "yedeya-labs/kanon*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
