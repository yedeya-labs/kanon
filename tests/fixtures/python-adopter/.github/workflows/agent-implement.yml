# A trigger-only caller of Kanon's implement lane, as an adopter writes it (plan 0001 §3).
# The ceiling covers the crash recovery's job-level grants as well as the lane's own.
name: Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  implement:
    uses: yedeya-labs/kanon/.github/workflows/agent-implement.yml@v1.2.3
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      IMPLEMENTER_APP_ID: ${{ secrets.IMPLEMENTER_APP_ID }}
      IMPLEMENTER_APP_PRIVATE_KEY: ${{ secrets.IMPLEMENTER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
