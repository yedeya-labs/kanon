# A trigger-only caller of Kanon's review lane, as an adopter writes it (plan 0001 §3). Its
# `run-name` ends with the head SHA, which the review-run evidence reads (the lane says so).
name: Review (Reviewer)

run-name: Review ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || inputs.pr_number }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read
  issues: read

jobs:
  review:
    uses: yedeya-labs/kanon/.github/workflows/agent-review.yml@v1.2.3
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
