# A trigger-only caller of Kanon's Overseer lane, as an adopter writes it (plan 0004 step 13).
# `id-token: write` is for the lane's store job alone, which exports the store through the
# store hook, and `actions: write` for the export's delete job alone. GitHub refuses to start a
# called job that asks for more than its caller grants. The adoption record says it is installed.
name: Overseer

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: write
  id-token: write

jobs:
  overseer:
    uses: yedeya-labs/kanon/.github/workflows/agent-overseer.yml@v1.2.3
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
