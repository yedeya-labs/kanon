# A trigger-only caller of Kanon's code-audit lane, as an adopter writes it (plan 0004 step 11).
# `id-token: write` is for the lane's store jobs alone, which read the ledger and write the run
# through the store hook, and `actions: write` for the export's delete job alone. GitHub refuses
# to start a called job that asks for more than its caller grants.
name: Code audit (Explorer)

on:
  schedule:
    - cron: "30 7 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: write
  id-token: write

jobs:
  audit:
    uses: yedeya-labs/kanon/.github/workflows/agent-code-audit.yml@v1.2.3
    secrets:
      EXPLORER_APP_ID: ${{ secrets.EXPLORER_APP_ID }}
      EXPLORER_APP_PRIVATE_KEY: ${{ secrets.EXPLORER_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
