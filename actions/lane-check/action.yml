# Kanon's lane check (plan 0001 §6, K-ADOPT-11), as a composite action.
#
# PERMANENT RULES ONLY. An adopter's lanes are Kanon's reusable workflows, so what is left in
# the adopter is a trigger-only caller per lane and the project-setup hook. This checks those:
#   - each caller holds only `name`, `on`, `permissions` and one job, and no `concurrency`
#     (the lane holds its own group, and the same group on the caller would deadlock them);
#   - that job `uses:` a Kanon lane (an `agent-*` workflow; a call to Kanon's release
#     workflow is no lane caller, kanon#152), passes only its own inputs through by the
#     same name, maps exactly the lane's secrets explicitly (never `secrets: inherit`), and
#     grants at least the permissions the lane declares (top level or any of its jobs);
#   - a job that calls any other Kanon workflow maps its secrets by name or passes none,
#     never `secrets: inherit`;
#   - every Kanon reference under `.github/` pins one exact version, the one this runs at;
#   - the hook exists at its fixed path and declares every input Kanon passes it;
#   - every role a caller's lane runs as has one row, with a slug, in the App register;
#   - the stack document a called lane's prompt reads exists, with `## Gates` once and each other
#     section at most once; a missing playbook is Kanon's baseline (K-LAYOUT-17, plan 0005 §5.2);
#   - the test-database declaration, when there is one, declares one kind Kanon knows;
#   - the escalation and exemptions files parse with the library's own readers (K-LAYOUT-8,
#     K-LAYOUT-15; kanon#153), and a missing one is Kanon's default, named in a notice;
#   - `.github/dependabot.yml` has the entry that proposes Kanon upgrades.
#
# What a lane declares (its inputs, secrets and permissions, and the hook's inputs) is read
# from Kanon's own files at the pinned version, through $GITHUB_ACTION_PATH, never restated.
#
# Needs a checkout of the adopter's repository first, and `yq` (mikefarah v4) on the runner.
# GitHub's hosted runners have it (plan 0001, decision 6). The checks run in one Node process
# (kanon#381), and Node is Kanon's own: the first step is `kanon-path`, which puts the Node major
# Kanon declares on the PATH (kanon#110), so they never run on whatever Node the image shipped.
name: Kanon lane check
description: Fails unless the repository's Kanon lane callers, project-setup hook, App register and Dependabot entry follow Kanon's lane rules.
author: yedeya-labs

runs:
  using: composite
  steps:
    - uses: $/actions/kanon-path
    - name: Check the lane callers
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/lane-check.sh"
