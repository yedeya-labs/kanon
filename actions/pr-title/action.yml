# Kanon's PR-title check (K-SHIP-4), as a composite action.
#
# The script is read from this action's own directory ($GITHUB_ACTION_PATH), at the ref
# the adopter pinned, so the action and its script can never drift apart.
#
# The title is untrusted input: it reaches the script only through the environment,
# never interpolated into a shell line.
#
# Requires Node 18 or later on the runner. GitHub's hosted runners have it; a
# self-hosted runner must provide it. The action does not install Node itself.
name: Kanon PR title
description: Fails unless the pull request title is a conventional commit with one of Kanon's fixed types, and no trailing "(#n)".
author: yedeya-labs

inputs:
  title:
    description: The title to check. Defaults to the pull request's title.
    required: false
    default: ${{ github.event.pull_request.title }}

runs:
  using: composite
  steps:
    - name: Check the PR title
      shell: bash
      env:
        PR_TITLE: ${{ inputs.title }}
      run: node "$GITHUB_ACTION_PATH/pr-title.mjs"
