# Building block 2 of 4 of an agent lane: RUN THE AGENT (RA-2666). See `agent-setup` for
# why the spine is built from blocks, and the shell and input-type rules every block follows.
#
# CALL IT WITH `id: agent`. The block's outputs mirror the action's own names, so the
# lane reads `steps.agent.outputs.execution_file` exactly as it did when the action was
# a step of its own — and `steps.agent.outcome` means what it meant then: the action is the
# last step, and the start stamp before it cannot fail. The user-scope step can, only when the
# runner gives it no usable temp directory, and then the agent must not start (kanon#283).
#
# NOTHING TO TAKE BACK OUT OF THE TREE (RA-2697). Lanes call this block as
# `$/actions/agent-run`, which the runner downloads into its action cache at the
# commit that defined the lane, before the first step. It is never read from the workspace,
# so no lane puts a copy there for the agent to see, and the `restore-paths` step that used
# to take that copy back out is gone with the loading it undid.
#
# SECRETS ARRIVE AS INPUTS. A composite action cannot read `secrets` (RA-1540 is what
# writing one cost), so the lane hands in the OAuth token and the App token. Nothing
# here exports an input to the environment except where a step names it, which is the
# same exposure the action had when its `env:` read the secret directly.
#
# THE STARTING MAP AND THE FAILURES-ONLY SWITCH ARE NOT HERE (RA-2694). Both are this
# project's, and the project-setup hook (`.github/actions/project-setup`) does them before
# `agent-setup`: it writes the map, and exports the switch through `$GITHUB_ENV`, which the
# agent step inherits exactly as it read the value its own `env:` used to set.
name: Agent lane — run the agent
description: >-
  Run claude-code-action with the lane's prompt and flags, after stamping when the agent
  started.

inputs:
  prompt:
    description: The agent's instructions.
    required: true
  claude_args:
    description: The flag block. The lane passes the SAME value to agent-finish, so the cost row cannot disagree.
    required: true
  claude-token:
    description: The Claude OAuth token (the lane's secret, passed in — a composite action cannot read secrets).
    required: true
  github-token:
    description: The minted App token. The agent authenticates as the App, never the default token.
    required: true
  prompt-cache-ttl:
    description: >-
      `CLAUDE_CODE_PROMPT_CACHE_TTL` for this lane, or empty to leave the CLI default.
      The value is decided by the lane, where `cache-ttl-check.mjs` can join it to the arm.
    required: false
    default: ""
  full-transcript:
    description: >-
      'true' prints the agent's whole transcript into the job log — `show_full_output`
      on the action (RA-2651). The lane decides; the default keeps the action's hidden
      output. It changes only what is printed, never the model's input, turns or spend.
    required: false
    default: "false"

outputs:
  execution_file:
    description: claude-code-action's `execution_file` output, for agent-finish.
    value: ${{ steps.agent.outputs.execution_file }}
  started-at:
    description: When the agent step was about to start (UTC, ISO 8601), for agent-finish's quality window.
    value: ${{ steps.started.outputs.at }}

runs:
  using: composite
  steps:
    # THE WINDOW'S LOWER BOUND for the opt-in quality column (RA-1627): stamped just before
    # the agent starts, so nothing the agent opens can predate it. Read from the runner
    # clock rather than `gh run view` — that would need an `actions: read` grant on every
    # caller for a timestamp the job already has. UNCONDITIONAL here, where the spine gated
    # it on the quality label: the stamp is an output nobody reads unless agent-finish is
    # given a label, and a block that runs the agent should not need to know about one.
    - name: Record when the agent started
      id: started
      shell: bash -e {0}
      run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    # WHO THE AGENT SPEAKS AS (plan 0005 §3.3, step L3). `agent-setup` resolved the role and
    # exported its header line; this appends one instruction to the lane's prompt: open every
    # post with that line, whose hidden comment is the role marker. No role resolved, and that
    # instruction is left out. It also names the playbooks `agent-setup` put Kanon's
    # baseline in place of, at a path git ignores, and how to commit the project's own there
    # (kanon#329). The script is Kanon's, beside this block in the action cache, never the
    # workspace's.
    #
    # `continue-on-error`, and the action falls back to the lane's own prompt: an instruction
    # about the header must never cost the run, and an empty prompt must never reach the agent.
    - name: Ask the agent to open every post with its persona header, and name the baseline playbooks
      id: prompt
      continue-on-error: true
      shell: bash -e {0}
      env:
        PROMPT: ${{ inputs.prompt }}
      run: node "$GITHUB_ACTION_PATH/persona-prompt.mjs"

    # A USER SCOPE THIS JOB MADE, for a lane whose flags load no project settings (kanon#283).
    # `--setting-sources user` still loads `$HOME/.claude/` and `$HOME/.claude.json`, and on a
    # persistent self-hosted runner an earlier job may have left a hook, a permission rule or an
    # MCP server there, which would join a grant the lane's flags are meant to be the whole of.
    # The script reads the flags the way the action does and, for such a lane only, points
    # `CLAUDE_CONFIG_DIR` at a new directory under the runner's temp directory through
    # `$GITHUB_ENV`. Never `continue-on-error`: a lane that can't get a clean user scope must not
    # run its agent on the runner's. Every other lane is left exactly as it was.
    - name: Give the agent a user scope this job made, if its flags load no project settings
      shell: bash -e {0}
      env:
        CLAUDE_ARGS: ${{ inputs.claude_args }}
      run: node "$GITHUB_ACTION_PATH/user-scope.mjs"

    # PINNED EXACTLY (plan 0001, decision 14). `@v1` moves under every adopter between two
    # Kanon releases, so the CLI an adopter runs, and the flags Kanon's tests check against
    # it, would be whatever the tag pointed at that day. An exact version fixes the CLI per
    # Kanon release, and Dependabot proposes each bump as a Kanon PR. This is the release
    # `@v1` resolved to when the block moved.
    #
    # A BUMP IS RED UNTIL THE REVIEWER'S GRANT IS RE-PROBED (kanon#284). What the Reviewer's
    # flags allow, and which settings they load, is the CLI's behaviour, and this pin picks
    # the CLI. `tests/unit/reviewer-grant-probe.test.ts` fails while
    # `.github/scripts/reviewer-grant-record.json` names another version: a maintainer runs
    # `.github/scripts/reviewer-grant-probe.mjs` against the CLI the new version installs and
    # commits the record it writes.
    - uses: anthropics/claude-code-action@v1.0.241
      id: agent
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        # Empty leaves the CLI default, which is what an unpinned arm wants — Actions
        # treats an empty env value as set-but-blank, and the CLI reads blank as absent.
        CLAUDE_CODE_PROMPT_CACHE_TTL: ${{ inputs.prompt-cache-ttl }}
      with:
        github_token: ${{ inputs.github-token }}
        # Permit bot-initiated runs (robustness — an issue may be labeled by a bot).
        # The label is the gate; the output is a PR a human must merge (the merge gate).
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text || inputs.prompt }}
        claude_args: ${{ inputs.claude_args }}
        # The string 'true'/'false' the spine's boolean arrived as — the same value the
        # action was handed when this step sat in the spine and read the boolean itself.
        show_full_output: ${{ inputs.full-transcript }}
