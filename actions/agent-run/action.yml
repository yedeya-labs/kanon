# Building block 2 of 4 of an agent lane: RUN THE AGENT (RA-2666). See `agent-setup` for
# why the spine is built from blocks, and the shell and input-type rules every block follows.
#
# CALL IT WITH `id: agent`. The block's outputs mirror the action's own names, so the
# lane reads `steps.agent.outputs.execution_file` exactly as it did when the action was
# a step of its own — and `steps.agent.outcome` means what it meant then: the start stamp and
# the TTL record before the action cannot fail, and the one step after it, the runtime check,
# cannot either (kanon#1470). The user-scope step can, only when the
# runner gives it no usable temp directory, and then the agent must not start (kanon#283). So
# can the turn-budget check, only on a raised `max_turns` the lane refuses (kanon#891).
#
# NOTHING TO TAKE BACK OUT OF THE TREE (RA-2697). Lanes call this block as
# `$/actions/agent-run`, which the runner downloads into its action cache at the
# commit that defined the lane, before the first step. It is never read from the workspace,
# so no lane puts a copy there for the agent to see, and the `restore-paths` step that used
# to take that copy back out is gone with the loading it undid.
#
# SECRETS ARRIVE AS INPUTS. A composite action cannot read `secrets` (RA-1540 is what
# writing one cost), so the lane hands in the Claude credential and the App token. Nothing
# here exports an input to the environment except where a step names it, which is the
# same exposure the action had when its `env:` read the secret directly.
#
# ONE CLAUDE CREDENTIAL, THROUGH `env:` ONLY (plan 0009 §10, step A1). The caller maps either
# the subscription token or an Anthropic API key, and the lane hands each down by its own name,
# `claude-token` or `anthropic-api-key`. The credential check fails the block before the agent
# starts when both are set or neither is, or when one holds the other's shape. The agent step
# then reads them from its `env:`, NEVER from a `with:` of `claude-code-action`: the action
# copies every input into its main step's `ALL_INPUTS` and its API key input into its
# inline-comment step, and an environment variable reaches neither.
# `tests/unit/agent-run-credential.test.ts` holds all of it.
#
# THE STARTING MAP AND THE FAILURES-ONLY SWITCH ARE NOT HERE (RA-2694). Both are this
# project's, and the project-setup hook (`.github/actions/project-setup`) does them before
# `agent-setup`: it writes the map, and exports the switch through `$GITHUB_ENV`, which the
# agent step inherits exactly as it read the value its own `env:` used to set.
name: Agent lane — run the agent
description: >-
  Run claude-code-action with the lane's prompt and flags, on the one Claude credential the
  lane was given, after stamping when the agent started.

inputs:
  prompt:
    description: The agent's instructions.
    required: true
  claude_args:
    description: The flag block. The lane passes the SAME value to agent-finish, so the cost row cannot disagree.
    required: true
  claude-token:
    description: >-
      The Claude subscription token, `CLAUDE_CODE_OAUTH_TOKEN` (the lane's secret, passed in — a
      composite action cannot read secrets). Exactly one of this and `anthropic-api-key` is set.
    required: false
    default: ""
  anthropic-api-key:
    description: >-
      An Anthropic API key, `ANTHROPIC_API_KEY`, in place of the subscription token. Exactly one
      of this and `claude-token` is set.
    required: false
    default: ""
  github-token:
    description: The minted App token. The agent authenticates as the App, never the default token.
    required: true
  prompt-cache-ttl:
    description: >-
      `CLAUDE_CODE_PROMPT_CACHE_TTL` for this lane, or empty to leave the CLI default.
      The value is decided by the lane, and its run's telemetry row records it (the
      `prompt-cache-ttl` output), so the cache-TTL detector judges a pin by the rows that ran
      under it.
    required: false
    default: ""
  max-turns:
    description: >-
      A turn limit raised for this one dispatched run: the lane's `max_turns` input, which only a
      caller's `workflow_dispatch` input fills (kanon#891). Empty runs the lane's own
      `--max-turns`. Otherwise a whole number from 1 to `max-turns-ceiling`, on a
      `workflow_dispatch` run, with `max-turns-reason` set; it replaces the lane's `--max-turns`
      and the `--max-budget-usd` derived from it. Any other value fails the block before the
      agent starts.
    required: false
    default: ""
  max-turns-ceiling:
    description: >-
      Kanon's ceiling for this lane's `max-turns`, a whole number the lane fixes, never its
      caller. Empty on a lane whose limit can't be raised.
    required: false
    default: ""
  max-turns-reason:
    description: >-
      Why this run's turn limit is raised: the lane's `reason` input, from the same dispatch.
      Required when `max-turns` is set; written to the run's step summary.
    required: false
    default: ""
  full-transcript:
    description: >-
      'true' prints the agent's whole transcript into the job log — `show_full_output`
      on the action (RA-2651). The lane decides; the default keeps the action's hidden
      output. It changes only what is printed, never the model's input, turns or spend.
    required: false
    default: "false"

outputs:
  execution_file:
    description: claude-code-action's `execution_file` output, for agent-finish.
    value: ${{ steps.agent.outputs.execution_file }}
  claude-args:
    description: >-
      The flags the agent ran with: the lane's `claude_args`, with a raised turn limit and its
      dollar cap in place of the lane's when the dispatch set one (kanon#891). The lane hands it to
      `agent-finish` as `claude-args-ran`, so the cost row records the cap that bound the run.
    value: ${{ steps.turns.outputs.claude-args }}
  started-at:
    description: When the agent step was about to start (UTC, ISO 8601), for agent-finish's quality window.
    value: ${{ steps.started.outputs.at }}
  auth:
    description: >-
      Which credential the agent ran on, `subscription` or `api-key`: a name, never anything the
      secret holds. Every lane hands it to `agent-finish` as `auth`, for the run's telemetry row
      (plan 0009 §12, step A6).
    value: ${{ steps.credential.outputs.auth }}
  prompt-cache-ttl:
    description: >-
      The prompt-cache TTL this run was pinned at, for `agent-finish`'s telemetry row (#546): the
      `prompt-cache-ttl` input, `default` when the lane left it empty, and empty for a value that
      isn't a plain word, which the row then leaves out.
    value: ${{ steps.ttl.outputs.value }}

runs:
  using: composite
  steps:
    # THE WINDOW'S LOWER BOUND for the opt-in quality column (RA-1627): stamped just before
    # the agent starts, so nothing the agent opens can predate it. Read from the runner
    # clock rather than `gh run view` — that would need an `actions: read` grant on every
    # caller for a timestamp the job already has. UNCONDITIONAL here, where the spine gated
    # it on the quality label: the stamp is an output nobody reads unless agent-finish is
    # given a label, and a block that runs the agent should not need to know about one.
    #
    # IT ALSO CLEARS THE INSTALL MARKER (kanon#1470). A non-ephemeral runner can keep `RUNNER_TEMP`
    # between jobs, so a marker the runtime check below wrote for an earlier job, or an earlier
    # block of this one, is deleted before this block's agent can run. The marker also names its
    # job execution's check run, and is read only by that job execution (kanon#1499). The deletion cannot fail the step: `rm -rf` of a missing
    # path succeeds, and `|| true` covers the rest.
    - name: Record when the agent started
      id: started
      shell: bash -e {0}
      run: |
        if [ -n "$RUNNER_TEMP" ]; then rm -rf -- "$RUNNER_TEMP/kanon-claude-code-not-installed" || true; fi
        echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    # A RAISED TURN LIMIT, CHECKED BEFORE ANYTHING ELSE THE AGENT NEEDS (kanon#891). A person may
    # raise the lane's limit for one dispatched run, with a reason, up to the ceiling the lane
    # fixes. Above it, zero, negative, not a whole number, no reason, or not a dispatch, and the
    # block fails here, by the input's name, before any model call. Never clamped.
    # Set, it replaces the lane's `--max-turns` and the dollar cap derived from it (`K-OBS-12`),
    # and the agent step below runs the flags this step writes. The value reaches the script
    # through `env:` only (`K-AGENT-45`). `turn-budget.mjs` says the rest.
    - name: Check the turn limit raised for this run
      id: turns
      shell: bash -e {0}
      env:
        CLAUDE_ARGS: ${{ inputs.claude_args }}
        MAX_TURNS: ${{ inputs.max-turns }}
        MAX_TURNS_CEILING: ${{ inputs.max-turns-ceiling }}
        MAX_TURNS_REASON: ${{ inputs.max-turns-reason }}
        # The caller's event, which a called workflow's `github` context is: a raise is taken
        # only on a dispatch.
        EVENT_NAME: ${{ github.event_name }}
      run: node "$GITHUB_ACTION_PATH/turn-budget.mjs"

    # THE TTL THIS RUN IS PINNED AT, FOR ITS TELEMETRY ROW (#546). The cache-TTL detector judges a
    # pin (did it take effect, do its runs idle past it) on the rows that ran under it, so the row
    # carries the value the agent step below sets, read from the same input, never from that
    # step's environment. Empty is `default`, the CLI's own choice. Anything but a plain word is
    # left empty, so it can't write another output, and the row leaves it out. It cannot fail.
    - name: Record the prompt-cache TTL the agent is pinned at
      id: ttl
      shell: bash -e {0}
      env:
        TTL: ${{ inputs.prompt-cache-ttl }}
      run: |
        case "$TTL" in
          '') echo "value=default" ;;
          *[!0-9a-z]*) echo "value=" ;;
          *) echo "value=$TTL" ;;
        esac >> "$GITHUB_OUTPUT"

    # THE CLAUDE CREDENTIAL, CHECKED BEFORE ANYTHING ELSE THE AGENT NEEDS (plan 0009 §10).
    # Both or neither set, or a value whose shape doesn't match its name, fails here, by the
    # secret's name and never its value. The values reach the script through `env:` only, never
    # a `run:` line. Never `continue-on-error`: a run with no single credential must not start.
    - name: Check the Claude credential
      id: credential
      shell: bash -e {0}
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: node "$GITHUB_ACTION_PATH/credential-check.mjs"

    # WHO THE AGENT SPEAKS AS (plan 0005 §3.3, step L3). `agent-setup` resolved the role and
    # exported its header line; this appends one instruction to the lane's prompt: open every
    # post with that line, whose hidden comment is the role marker. No role resolved, and that
    # instruction is left out. It also names the playbooks `agent-setup` put Kanon's
    # baseline in place of, at a path git ignores, and how to commit the project's own there
    # (kanon#329). Last, it says the run is headless, so a command still running when the
    # agent stops is lost (kanon#621, below). The script is Kanon's, beside this block in the
    # action cache, never the workspace's.
    #
    # `continue-on-error`, and the action falls back to the lane's own prompt: an instruction
    # about the header must never cost the run, and an empty prompt must never reach the agent.
    # Without the headless rule the agent still can't background a command: the action step's
    # switches do that, and the rule only says why.
    - name: Ask the agent to open every post with its persona header, name the baseline playbooks, and say the run is headless
      id: prompt
      continue-on-error: true
      shell: bash -e {0}
      env:
        PROMPT: ${{ inputs.prompt }}
      run: node "$GITHUB_ACTION_PATH/persona-prompt.mjs"

    # A USER SCOPE THIS JOB MADE, for a lane whose flags load no project settings (kanon#283).
    # `--setting-sources user` still loads `$HOME/.claude/` and `$HOME/.claude.json`, and on a
    # persistent self-hosted runner an earlier job may have left a hook, a permission rule or an
    # MCP server there, which would join a grant the lane's flags are meant to be the whole of.
    # The script reads the flags the way the action does and, for such a lane only, points
    # `CLAUDE_CONFIG_DIR` at a new directory under the runner's temp directory through
    # `$GITHUB_ENV`. Never `continue-on-error`: a lane that can't get a clean user scope must not
    # run its agent on the runner's. Every other lane is left exactly as it was.
    - name: Give the agent a user scope this job made, if its flags load no project settings
      shell: bash -e {0}
      env:
        CLAUDE_ARGS: ${{ inputs.claude_args }}
      run: node "$GITHUB_ACTION_PATH/user-scope.mjs"

    # PINNED EXACTLY (plan 0001, decision 14). `@v1` moves under every adopter between two
    # Kanon releases, so the CLI an adopter runs, and the flags Kanon's tests check against
    # it, would be whatever the tag pointed at that day. An exact version fixes the CLI per
    # Kanon release, and Dependabot proposes each bump as a Kanon PR. This is the release
    # `@v1` resolved to when the block moved.
    #
    # A BUMP IS RED UNTIL THE REVIEWER'S AND THE LEAD'S GRANTS ARE RE-PROBED (kanon#284,
    # kanon#405). What their flags allow, and which settings they load, is the CLI's
    # behaviour, and this pin picks the CLI. `tests/unit/reviewer-grant-probe.test.ts` fails
    # while `.github/scripts/reviewer-grant-record.json` or `lead-grant-record.json` names
    # another version: a maintainer runs `.github/scripts/reviewer-grant-probe.mjs` against
    # the CLI the new version installs and commits the records it writes.
    #
    # NOTHING RUNS IN THE BACKGROUND (kanon#621). The agent runs headless: when it ends its
    # turn the session ends, and nothing resumes it when a background task finishes. Six
    # implement runs in the reference adopter ended `success` with no branch, PR or comment,
    # each after backgrounding its own gates and ending its turn to wait for them. It
    # backgrounded them because it first asked for a 20 and a 40 minute foreground `timeout`,
    # and the Bash tool caps one at 10 minutes. So, for every lane, on CLI 2.1.292:
    #   - `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS` takes `run_in_background` off the Bash tool;
    #   - `BASH_MAX_TIMEOUT_MS` raises the foreground cap to 45 minutes, so a long gate can run
    #     to the end where the agent can wait for it. A lane's own `timeout-minutes` still
    #     bounds the job;
    #   - `--disallowedTools Monitor`, after the lane's flags, takes away the tool that watches a
    #     background command, which the switch above leaves on. The action adds a repeated
    #     `--disallowedTools` to the earlier ones (`ACCUMULATING_FLAGS` in its
    #     `parse-sdk-options.ts`), as the Lead's flags already rely on.
    # `persona-prompt.mjs` tells the agent why. `tests/unit/headless-run.test.ts` pins all four.
    # `agent-finish` is handed the lane's flags without the denial: it is the same on every
    # run, so it changes no comparison a cost row is read for.
    - uses: anthropics/claude-code-action@v1.0.263
      id: agent
      env:
        # Exactly one is non-empty: the credential check above guarantees it. Each is read
        # from the environment by the action, and never passed as one of its inputs.
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        # Empty leaves the CLI default, which is what an unpinned arm wants — Actions
        # treats an empty env value as set-but-blank, and the CLI reads blank as absent.
        CLAUDE_CODE_PROMPT_CACHE_TTL: ${{ inputs.prompt-cache-ttl }}
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        BASH_MAX_TIMEOUT_MS: "2700000"
      with:
        github_token: ${{ inputs.github-token }}
        # Permit bot-initiated runs (robustness — an issue may be labeled by a bot).
        # The label is the gate; the output is a PR a human must merge (the merge gate).
        allowed_bots: "*"
        prompt: ${{ steps.prompt.outputs.text || inputs.prompt }}
        claude_args: |
          ${{ steps.turns.outputs.claude-args }}
          --disallowedTools Monitor
        # The string 'true'/'false' the spine's boolean arrived as — the same value the
        # action was handed when this step sat in the spine and read the boolean itself.
        show_full_output: ${{ inputs.full-transcript }}

    # DID THE ACTION FAIL AT ITS INSTALL OF CLAUDE CODE (kanon#1470)? Then no model was called, and
    # `agent-classify` says so with its `unavailable` notice, where a missing result file alone
    # could only say "cannot tell which". The script reads what the action left on disk (a prompt
    # written during this run, no CLI in place) and the step's own outputs, never its log, and
    # writes a marker into this job's temp directory for `agent-classify` and `agent-telemetry`.
    # Only after the action failed, which the step's own `outcome` says: `!cancelled()` lets it run
    # after a failed step, and no block asks `failure()` (`agent-lane-blocks.test.ts`). It always
    # exits 0, and `continue-on-error` besides, so it never changes the block's outcome.
    - name: Record whether claude-code-action failed to install Claude Code
      if: "!cancelled() && steps.agent.outcome == 'failure'"
      continue-on-error: true
      shell: bash -e {0}
      env:
        OUTCOME: ${{ steps.agent.outcome }}
        CONCLUSION: ${{ steps.agent.outputs.conclusion }}
        EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        STARTED_AT: ${{ steps.started.outputs.at }}
        # This job execution's check run, which the marker names (kanon#1499): a matrix's entries
        # share the job id, never the check run.
        KANON_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
      run: node "$GITHUB_ACTION_PATH/runtime-check.mjs"
